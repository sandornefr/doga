<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKT – Weboldalam</title>
<link rel="icon" href="../kando_favion_light.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{line-height:1.5;min-height:100vh;}
.topbar{display:flex;align-items:center;gap:12px;color:#fff;}
.topbar .cim{font-weight:700;flex:1;}
.topbar a{color:#fff;text-decoration:none;font-size:.9rem;}
.wrap{max-width:900px;margin:0 auto;padding:18px 20px 16px;}
h1{font-size:1.7rem;margin-bottom:4px;}
.card{background:#fff;padding:14px 20px;margin-top:12px;}
.lepesek{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px;}
.lepes{background:#fff;border:1px solid var(--ikt-vonal);border-radius:14px;padding:8px 14px;font-size:.92rem;display:flex;gap:10px;align-items:center;}
.lepes b{flex:none;color:var(--ikt-lila);font-size:1.4rem;line-height:1;}
.sor{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.sor input[type=url]{flex:1;min-width:260px;padding:10px 12px;border:1px solid #cbd2d9;font:inherit;font-size:1.05rem;}
.btn{border:0;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;color:#fff;}
.uzenet{min-height:1.4em;margin-top:6px;font-weight:600;}
html{font-size:16px;}
.uzenet.hiba{color:#b42318;}
.uzenet.jo{color:#067647;}
.uzenet.sarga{color:#b54708;}
.linkem{font-size:1.15rem;font-weight:700;word-break:break-all;}
.linkem a{color:var(--ikt-indigo);}
.megj{color:#52606d;font-size:.9rem;margin-top:6px;}
.kozep{text-align:center;padding:60px 20px;}
.kozep .btn{display:inline-block;margin-top:16px;text-decoration:none;}
.vj-doboz{margin-top:14px;border:1px solid #f0d36b;background:#fff8db;border-radius:10px;padding:10px 14px;}
.allapot{display:inline-block;margin-left:8px;padding:2px 12px;border-radius:99px;font-size:.85rem;font-weight:700;}
.allapot.jo{background:#dcfce7;color:#067647;}
.allapot.rossz{background:#fee4e2;color:#b42318;}
.allapot.fut{background:#eef2ff;color:#4f46e5;}
@media (max-width:640px){.lepesek{grid-template-columns:1fr;}}
/* két fül: A weboldalam · Témaoldal értékelése */
.fulsor{display:flex;gap:8px;margin:10px 0 4px;}
.fulsor button{border:1px solid #cbd2d9;border-radius:99px;padding:6px 16px;font:inherit;font-weight:600;cursor:pointer;background:transparent;color:inherit;}
.fulsor button.aktiv{background:linear-gradient(135deg,#7c3aed,#4f46e5);border-color:transparent;color:#fff;}
.ert-racs{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start;}
.ert-racs table.ell{font-size:.86rem;}
@media (max-width:760px){.ert-racs{grid-template-columns:1fr;}}
</style>
<link rel="stylesheet" href="ikt-nezo.css?v=4">
<link rel="stylesheet" href="ikt.css?v=4">
</head>
<body>
<div class="topbar">
  <span class="cim"><i class="fab fa-github"></i> Weboldalam</span>
  <span id="who"></span>
  <a href="index.html"><i class="fas fa-arrow-left"></i> Vissza</a>
</div>
<div class="wrap" id="app"><div class="kozep">Betöltés…</div></div>

<template id="oldal">
  <h1>Weboldalam</h1>
  <div class="fulsor">
    <button data-ful="web" class="aktiv"><i class="fab fa-github"></i> A weboldalam</button>
    <button data-ful="tema"><i class="fas fa-file-circle-check"></i> Témaoldal értékelése</button>
  </div>
  <div id="ful-web">
  <div class="alcim">Add meg a github.io-s címedet. A tanárod így látja az oldaladat.</div>

  <div class="lepesek">
    <div class="lepes"><b>1</b><span>A GitHubon nyisd meg a repódat. Kattints: <strong>Settings → Pages</strong>.</span></div>
    <div class="lepes"><b>2</b><span>Branch: <code>main</code>, majd <strong>Save</strong>. Várj 1-2 percet.</span></div>
    <div class="lepes"><b>3</b><span>Másold ki a fent megjelenő címet. Illeszd be ide (Ctrl+V).</span></div>
  </div>

  <div class="card">
    <div class="sor">
      <input type="url" id="url" placeholder="https://felhasznalonev.github.io/weboldalam/" maxlength="300" autocomplete="off">
      <button class="btn" id="mentes"><i class="fas fa-paper-plane"></i> Beküldöm</button>
    </div>
    <div class="uzenet" id="uzenet"></div>
  </div>

  <div class="card" id="sajat" hidden></div>
  </div>
  <div id="ful-tema" hidden><div class="card" id="temaert">Betöltés…</div></div>
</template>

<script src="weboldal-ellenor.js?v=3"></script>
<script src="temak.js"></script>
<script src="ikt-ellenor.js?v=4"></script>
<script>
const API = 'https://agazati.up.railway.app';
const FELADAT = 'weboldal';
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const app = document.getElementById('app');

const u = JSON.parse(sessionStorage.getItem('kandoUser') || 'null');
let TOKEN = u ? (u.token || '') : '';
if (u && !TOKEN && u._tesztMod) TOKEN = (JSON.parse(localStorage.getItem('kandoTeacherBackup') || '{}').token || '');
const JOGOS = !!u && (u.szerep === 'oktato' || u._tesztMod || String(u.evfolyam || '') === '9');
const AUTH = { 'Authorization': 'Bearer ' + TOKEN };

function uzen(szoveg, tipus) {
  const el = document.getElementById('uzenet');
  el.className = 'uzenet ' + (tipus || '');
  el.textContent = szoveg || '';
}

async function sajatBetolt() {
  try {
    const r = await fetch(API + '/api/ikt/beadas/sajat?feladat=' + FELADAT, { headers: AUTH });
    if (r.ok) {
      const d = await r.json();
      if (d.beadas && d.beadas.githubUrl) { sajatRajz(d.beadas); return; }
    }
    // Még nincs: ha a Témaoldalnál már megadta a github.io címét, azt ajánljuk fel.
    const rt = await fetch(API + '/api/ikt/beadas/sajat?feladat=temaoldal', { headers: AUTH });
    if (rt.ok) {
      const dt = await rt.json();
      const t = dt.beadas && dt.beadas.githubUrl;
      if (t && WebEllenor.alap(t)) {
        document.getElementById('url').value = WebEllenor.alap(t);
        uzen('Ezt a címet a Témaoldalnál adtad meg. Ha jó, kattints a Beküldöm gombra.', 'sarga');
      }
    }
  } catch (e) {}
}

// ── Témaoldal értékelése fül: a beadott Témaoldal tájékoztató (gépi) pontjai, a tanár végleges pontjai és visszajelzése ──
// A közös ellenőrző és nézegető (ikt-ellenor.js) ezeket használja; itt csak olvasható (IKT_TANULO).
const IKT_TANULO = true;
const TEMAK = window.IKT_TEMAK;
const OLDALAK = ['index.html', 'keplink.html', 'listak.html', 'orarend.html', 'tema.html'];
const H2_SORREND = ['Bemutatás', 'Érdekességek', 'Jellemzők', 'Adatok', 'Rangsor'];
let beadasok = [];
const temak = {};
const ellenorzes = {};
function sorFrissit() {}
function listaRajz() {}
const csoportNev = b => (b.osztaly || '') + (b.csoport ? ' / ' + b.csoport + '. cs.' : '');
function temaNev(b) { const n = beadasTemaSorszam(b); return n && TEMAK[n - 1] ? TEMAK[n - 1][0] : ''; }

function fulValt(ful) {
  document.querySelectorAll('.fulsor button').forEach(g => g.classList.toggle('aktiv', g.dataset.ful === ful));
  document.getElementById('ful-web').hidden = ful !== 'web';
  document.getElementById('ful-tema').hidden = ful !== 'tema';
  try { history.replaceState(null, '', ful === 'tema' ? '#temaoldal' : '#'); } catch (e) {}
  if (ful === 'tema') temaErtekeles(); else illesztOldal();
}

let temaErtFut = false;
async function temaErtekeles() {
  const el = document.getElementById('temaert');
  if (temaErtFut) return;
  temaErtFut = true;
  try {
    const r = await fetch(API + '/api/ikt/beadas/sajat?feladat=temaoldal', { headers: AUTH });
    const d = r.ok ? await r.json() : null;
    const b = d && d.beadas;
    if (!b || !((b.fajlok && b.fajlok.length) || b.githubUrl)) {
      el.innerHTML = '<p>Még nem adtad be a Témaoldalt. A <a href="temaoldal.html">Témaoldal</a> kártyán adhatod be.</p>';
      return;
    }
    // a kapott téma (a h1 összevetéséhez)
    try {
      const rt = await fetch(API + '/api/ikt/tema?feladat=temaoldal', { headers: AUTH });
      const dt = rt.ok ? await rt.json() : null;
      if (dt && dt.temaSorszam && u.email) temak[u.email] = { temaSorszam: dt.temaSorszam };
    } catch (e) {}
    beadasok = [b];
    el.innerHTML = '<p class="megj"><i class="fas fa-spinner fa-spin"></i> Ellenőrzés…</p>';
    const mod = b.fajlok && b.fajlok.length ? 'fajl' : 'github';
    await futtat(b, mod);
    const e = mod === 'github' ? ghEll[b.id] : ellenorzes[b.id];
    if (!e || e.hiba) { el.innerHTML = `<p class="hiba">${esc((e && e.hiba) || 'Nem sikerült ellenőrizni.')}</p>`; return; }
    const v = b.visszajelzes;
    el.innerHTML = `<div class="ert-racs">
      <div>${pontozoRajz(e, b, 'tanulo')}</div>
      <div>
        <p class="megj">Beadva: <b>${esc(b.updatedAt)}</b></p>
        <p style="margin:8px 0"><button class="btn" onclick="nzMegnyit(${b.id})"><i class="fas fa-eye"></i> Megnézem a munkámat</button></p>
        ${v ? `<div class="vj-doboz"><b><i class="fas fa-comment-dots"></i> Visszajelzés a tanárodtól</b> <span class="megj">(${esc(v.updatedAt)})</span>` +
              `<div style="margin-top:6px">${esc(v.szoveg).replace(/\n/g, '<br>')}</div></div>`
            : '<p class="megj">A tanárod még nem küldött visszajelzést.</p>'}
        <p class="megj" style="margin-top:8px">A „kézi” szempontokat és a végső pontszámot a tanárod adja.</p>
      </div></div>`;
  } catch (x) {
    el.innerHTML = '<p class="hiba">Nem sikerült betölteni. Frissítsd az oldalt!</p>';
  } finally {
    temaErtFut = false;
    illesztOldal();
  }
}

// Ne görgessen (Réka szabálya): ha az oldal nem fér ki a képernyőre, kisebb betűvel rajzolja (16 → 9,5 px).
function illesztOldal() {
  if (innerWidth < 760) { document.documentElement.style.fontSize = ''; return; }
  for (let fs = 16; fs >= 9.5; fs -= 0.5) {
    document.documentElement.style.fontSize = fs + 'px';
    if (document.documentElement.scrollHeight <= innerHeight + 1) return;
  }
}
window.addEventListener('resize', () => { clearTimeout(window._illIdo); window._illIdo = setTimeout(illesztOldal, 150); });

async function sajatRajz(b) {
  const el = document.getElementById('sajat');
  el.hidden = false;
  document.getElementById('url').value = b.githubUrl;
  el.innerHTML = `<div class="linkem"><i class="fab fa-github"></i> <a href="${esc(b.githubUrl)}" target="_blank" rel="noopener">${esc(b.githubUrl)}</a>
      <span class="allapot fut" id="allapot"><i class="fas fa-spinner fa-spin"></i> Nézem…</span></div>
    <p class="megj">Beküldve: ${esc(b.updatedAt)}</p>
    <div id="ell"></div>` +
    (b.visszajelzes ? `<div class="vj-doboz"><b><i class="fas fa-comment-dots"></i> Üzenet a tanárodtól</b> <span class="megj">(${esc(b.visszajelzes.updatedAt)})</span>` +
      `<div>${esc(b.visszajelzes.szoveg).replace(/\n/g, '<br>')}</div></div>` : '');
  const e = await WebEllenor.ellenoriz(b.githubUrl, { nev: u && !u._tesztMod ? u.nev : null });
  const a = document.getElementById('allapot');
  if (e.hiba || !e.el) {
    a.className = 'allapot rossz';
    a.innerHTML = '<i class="fas fa-xmark"></i> Még nem érhető el';
  } else {
    a.className = 'allapot ' + (e.ok === e.ossz ? 'jo' : 'fut');
    a.innerHTML = `<i class="fas ${e.ok === e.ossz ? 'fa-check' : 'fa-list-check'}"></i> ${e.ok} / ${e.ossz}`;
  }
  document.getElementById('ell').innerHTML = WebEllenor.rajz(e) +
    (e.el ? '<p class="megj">A piros elemeket javítsd ki VS Code-ban, majd töltsd fel újra a GitHubra. A zöld jelre mutatva látod, mi van rendben.</p>'
          : '<p class="megj">Nem találom az index.html-t. Be van kapcsolva a GitHub Pages? Jó a cím?</p>');
  illesztOldal();
}

async function bekuld() {
  const btn = document.getElementById('mentes');
  let url = document.getElementById('url').value.trim();
  if (!url) { uzen('Előbb illeszd be a címet!', 'hiba'); return; }
  if (/^[a-z0-9-]+\.github\.io/i.test(url)) url = 'https://' + url;   // ha a https:// lemaradt
  if (/github\.com/i.test(url)) { uzen('Ez a repó címe (github.com). A github.io-s cím kell, a Settings → Pages oldalról.', 'hiba'); return; }
  if (!WebEllenor.jo(url)) { uzen('A cím így kezdődjön: https://…github.io/', 'hiba'); return; }
  const fd = new FormData();
  fd.append('feladat', FELADAT);
  fd.append('github_url', url);
  btn.disabled = true;
  uzen('Küldés…');
  try {
    const r = await fetch(API + '/api/ikt/beadas', { method: 'POST', headers: AUTH, body: fd });
    let d = null;
    try { d = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((d && d.error) || ('Hiba történt (' + r.status + ').'));
    uzen('Megkaptam a címedet!', 'jo');
    sajatRajz(d);
  } catch (e) {
    uzen(e.message, 'hiba');
  } finally {
    btn.disabled = false;
  }
}

// ── Indítás ──
if (!u || !TOKEN) {
  app.innerHTML = '<div class="kozep"><h2>Be kell jelentkezned</h2><a class="btn" href="../login.html">Bejelentkezés</a></div>';
} else if (!JOGOS) {
  app.innerHTML = '<div class="kozep"><h2>Ez az oldal a 9. évfolyamnak szól.</h2><a class="btn" href="../portal.html">Vissza a portálra</a></div>';
} else {
  document.getElementById('who').textContent = u.nev || '';
  app.innerHTML = '';
  app.appendChild(document.getElementById('oldal').content.cloneNode(true));
  document.getElementById('mentes').addEventListener('click', bekuld);
  document.querySelectorAll('.fulsor button').forEach(g => g.onclick = () => fulValt(g.dataset.ful));
  if (location.hash === '#temaoldal') fulValt('tema');
  document.getElementById('url').addEventListener('keydown', e => { if (e.key === 'Enter') bekuld(); });
  sajatBetolt();
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKT – Témaoldal</title>
<link rel="icon" href="../kando_favion_light.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f4f6f8;color:#1f2933;font-family:'Segoe UI',system-ui,sans-serif;line-height:1.5;}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#1f2933;color:#fff;}
.topbar .cim{font-weight:700;flex:1;}
.topbar a,.topbar button{color:#fff;background:#3e4c59;border:0;border-radius:6px;padding:6px 12px;text-decoration:none;font:inherit;font-size:.9rem;cursor:pointer;}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px;}
h1{font-size:1.7rem;}
.alcim{color:#52606d;margin-bottom:18px;}
h2{font-size:1.2rem;margin:28px 0 10px;padding-bottom:4px;border-bottom:2px solid #d9e2ec;}
.card{background:#fff;border:1px solid #d9e2ec;border-radius:10px;padding:16px 20px;}
ol.lepesek{padding-left:26px;}
ol.lepesek li{margin:6px 0;}
code{background:#eef2f7;border-radius:4px;padding:1px 5px;font-family:Consolas,monospace;font-size:.92em;}
pre.kod{background:#1f2933;color:#e4e7eb;border-radius:8px;padding:10px 14px;margin:8px 0;font-family:Consolas,monospace;font-size:.9rem;}
.sarga{background:#fff8db;border:1px solid #f0d36b;border-radius:8px;padding:10px 14px;margin-top:14px;}
table.tbl{border-collapse:collapse;width:100%;background:#fff;font-size:.92rem;}
table.tbl th,table.tbl td{border:1px solid #cbd2d9;padding:5px 8px;text-align:left;vertical-align:top;}
table.tbl th{background:#e4e7eb;}
table.tbl td.sz{width:36px;text-align:right;color:#52606d;}
.megj{color:#52606d;font-size:.9rem;margin-top:6px;}
.minta-cim{color:#52606d;margin-bottom:6px;}
iframe.minta{width:100%;height:560px;border:1px solid #cbd2d9;border-radius:8px;background:#fff;}
.temam{margin-top:10px;padding:12px 16px;background:#eef6ff;border:1px solid #b6d4fe;border-radius:8px;min-height:84px;}
.temam .nev{font-size:1.35rem;font-weight:700;color:#1d4ed8;margin:2px 0 6px;}
.temam .hiba{color:#b42318;}
.masold{margin:6px 0 2px 18px;}
.masold li{margin:3px 0;}
.ponthatar{margin-top:8px;font-size:.92rem;}
/* Beadás */
.drop{border:2px dashed #9aa5b1;border-radius:10px;padding:22px;text-align:center;color:#52606d;background:#fafbfc;cursor:pointer;}
.drop.over{border-color:#2563eb;background:#eff6ff;}
.drop i{font-size:1.8rem;display:block;margin-bottom:6px;color:#2563eb;}
.fajllista{list-style:none;margin:12px 0 0;}
.fajllista li{display:flex;align-items:center;gap:10px;padding:5px 8px;border-bottom:1px solid #eef2f7;font-size:.92rem;}
.fajllista li .nev{flex:1;}
.fajllista li .meret{color:#7b8794;font-size:.85rem;min-width:70px;text-align:right;}
.fajllista button{border:0;background:none;color:#b42318;cursor:pointer;font-size:1rem;}
.sor{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}
.sor label{font-weight:600;}
.sor input[type=url]{flex:1;min-width:240px;padding:8px 10px;border:1px solid #cbd2d9;border-radius:6px;font:inherit;}
.btn{border:0;border-radius:8px;padding:10px 20px;font:inherit;font-weight:600;cursor:pointer;background:#2563eb;color:#fff;}
.btn:disabled{background:#9aa5b1;cursor:default;}
.uzenet{min-height:1.6em;margin-top:10px;font-weight:600;}
.uzenet.hiba{color:#b42318;}
.uzenet.jo{color:#067647;}
.kozep{text-align:center;padding:60px 20px;}
.kozep .btn{display:inline-block;margin-top:16px;text-decoration:none;}
@media print{
  .topbar,#beadas-resz,.nyomtat{display:none!important;}
  body{background:#fff;}
  .card{border:0;padding:0;}
  iframe.minta{height:480px;}
}
</style>
</head>
<body>
<div class="topbar">
  <span class="cim"><i class="fas fa-file-code"></i> IKT projektmunka</span>
  <span id="who"></span>
  <button class="nyomtat" onclick="window.print()"><i class="fas fa-print"></i> Nyomtatás</button>
  <a href="../portal.html"><i class="fas fa-arrow-left"></i> Vissza</a>
</div>

<div class="wrap" id="app"><div class="kozep">Betöltés…</div></div>

<template id="feladatlap">
  <h1>IKT projektmunka – számonkérés: Témaoldal</h1>
  <div class="alcim">9. évfolyam · az eddig tanultak: HTML oldal, címsorok, bekezdés, kép, link, listák, táblázat, menü</div>

  <div class="card">
    <p>A saját weboldaladra készíts egy új oldalt a témádról.</p>
    <div id="temam" class="temam">A témád betöltése…</div>
  </div>

  <h2>Feladatok</h2>
  <div class="card">
    <ol class="lepesek">
      <li>A saját weboldal mappádban hozz létre egy új fájlt <code>tema.html</code> néven!</li>
      <li>Hozd létre az alap HTML szerkezetet!</li>
      <li>Állítsd a nyelvet magyarra!</li>
      <li>Csatold a css mappában lévő style.css-t!</li>
      <li>A weboldal lapfülön megjelenő címe: Weboldalam</li>
      <li>Készítsd el a navigációt! Ügyelj arra, hogy a többi oldaladról is elérhető legyen az új témaoldalad!</li>
      <li>Főcímként írd ki a témád nevét!</li>
      <li>Készíts öt alcímet ebben a sorrendben: Bemutatás, Érdekességek, Jellemzők, Adatok, Rangsor!</li>
      <li>A Bemutatás alcím alá írj egy legalább 2 mondatos bekezdést, amelyben a saját szavaiddal bemutatod a témádat!</li>
      <li>Az Érdekességek alcím alá írj egy bekezdést, amelyben legalább 2 érdekességet leírsz a témádról!</li>
      <li>Tölts le a pixabay.com oldalról egy, a témáddal kapcsolatos vagy arra jellemző képet, ne a legnagyobb felbontásban! Mentsd az img mappába, és tedd be az oldalra, a Bemutatás bekezdése alá! Ha a kép nem jeleníthető meg, vagy ha fölé viszed az egeret, jelenjen meg a képre utaló szöveg!</li>
      <li>Az Érdekességek bekezdése alá készíts egy hivatkozást „Tudj meg többet!” szöveggel egy olyan oldalra, ahol többet megtudhatunk a témádról! A hivatkozás új lapon nyíljon meg!</li>
      <li>A Jellemzők alá készíts rendezetlen listát 3 dologról, ami jellemző a témádra! (Pl.: a ló: gyors, erős, tanulékony.)</li>
      <li>Az Adatok alá készíts táblázatot a témádnál megadott 3 oszloppal: egy fejléc sor és 3 sor adat! A táblázatnak és minden cellájának legyen szegélye. Ehhez másold be a <code>css/style.css</code> fájlba ezt:
<pre class="kod">table {
    border-collapse: collapse;
}
th, td {
    border: 1px solid black;
    padding: 5px;
}</pre></li>
      <li>Nézz utána az interneten, mi a 3 „leg” a témádban! Hogy mit keress, azt a témád alatt látod. Írd be őket a Rangsor alá rendezett listába, a legelsővel kezdve! (Pl.: a 3 legnagyobb lófajta: shire, belga hidegvérű, clydesdale.)</li>
      <li>Mentsd el! Töltsd fel lent, a <b>Beadás</b> részben ezeket a fájlokat: <code>index.html</code>, <code>keplink.html</code>, <code>listak.html</code>, <code>orarend.html</code>, <code>tema.html</code>, <code>style.css</code> és a képeidet! (Vagy add meg a github.io címedet.)</li>
    </ol>
    <div class="sarga"><i class="fas fa-magnifying-glass"></i> Ellenőrizd a böngészőben: minden menüpont működik? A kép látszik?</div>
  </div>

  <div id="temak-resz" hidden>
  <h2>Témák</h2>
  <table class="tbl" id="temak">
    <thead><tr><th>#</th><th>Téma</th><th>A táblázat oszlopai</th><th>Rangsor: keresd meg…</th></tr></thead>
    <tbody></tbody>
  </table>
  </div>
  <p class="megj">Ha két forrás kicsit eltér, bármelyik elfogadható.</p>

  <h2>Minta</h2>
  <p class="minta-cim">A minta témája a Lovak, ez nincs a témák között. Rangsor: a 3 legnagyobb lófajta.</p>
  <iframe class="minta" id="minta" title="Minta: Lovak" sandbox></iframe>

  <h2>Pontozás (20 pont)</h2>
  <table class="tbl" id="pontozo">
    <thead><tr><th>#</th><th>Szempont</th><th>Pont</th></tr></thead>
    <tbody></tbody>
  </table>
  <p class="ponthatar">Ponthatárok: 18–20 jeles (5), 15–17 jó (4), 12–14 közepes (3), 10–11 elégséges (2), 0–9 elégtelen (1).</p>

  <div id="beadas-resz">
    <h2>Beadás</h2>
    <div class="card">
      <p>Válaszd ki a fájljaidat (több is lehet egyszerre), vagy húzd ide őket. Újra beadva a régi fájlok helyére az újak kerülnek.</p>
      <div class="drop" id="drop" tabindex="0">
        <i class="fas fa-cloud-arrow-up"></i>
        Kattints ide, vagy húzd ide a fájlokat<br>
        <small>.html, .css, .jpg, .png, .gif, .webp · legfeljebb 12 fájl, fájlonként 3 MB</small>
      </div>
      <input type="file" id="fajlvalaszto" multiple accept=".html,.css,.jpg,.jpeg,.png,.gif,.webp" hidden>
      <ul class="fajllista" id="valasztott"></ul>
      <div class="sor">
        <label for="ghurl">Vagy a github.io címed:</label>
        <input type="url" id="ghurl" placeholder="https://felhasznalonev.github.io/weboldalam/" maxlength="300">
      </div>
      <div class="sor"><button class="btn" id="beadom" disabled><i class="fas fa-paper-plane"></i> Beadom</button></div>
      <div class="uzenet" id="uzenet"></div>
    </div>

    <h2>Amit beadtál</h2>
    <div class="card" id="sajat">Még nem adtál be semmit.</div>
  </div>
</template>

<script src="temak.js"></script>
<script>
const TEMAK = window.IKT_TEMAK;
const API = 'https://agazati.up.railway.app';
const FELADAT = 'temaoldal';
const MAX_FAJL = 12, MAX_MERET = 3 * 1024 * 1024;
const KITERJ = ['html', 'css', 'jpg', 'jpeg', 'png', 'gif', 'webp'];

const PONTOZO = [
  ['A tema.html a saját mappában van', 1],
  ['Alap szerkezet és lang="hu"', 1],
  ['title: Weboldalam', 1],
  ['A css/style.css csatolva', 1],
  ['A menüben ott a Témám, minden oldalon, és működik', 2],
  ['h1: a téma neve', 1],
  ['Öt alcím (h2) jó sorrendben: Bemutatás, Érdekességek, Jellemzők, Adatok, Rangsor', 1],
  ['Bemutatás: legalább 2 mondat, saját szavakkal · Érdekességek: legalább 2 érdekesség', 2],
  ['Témához illő kép a pixabay.com-ról, az img mappából, nem a legnagyobb felbontásban, van alt és title', 2],
  ['„Tudj meg többet!” hivatkozás a témához illő oldalra, új lapon nyílik', 2],
  ['Rendezetlen lista 3 jellemzővel (Jellemzők alatt)', 1],
  ['Rendezett lista a megadott 3 „leg”-gel, helyes sorrendben (Rangsor alatt)', 1],
  ['Táblázat: fejléc + 3 sor, a megadott oszlopokkal, minden cellának szegélye a style.css-ből', 3],
  ['Minden fájl beadva (HTML-ek, style.css, képek), a témája egyezik a kapott témával', 1],
];

const MINTA = `<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><title>Weboldalam</title>
<style>body{font-family:Arial,sans-serif;margin:16px;color:#222}nav{margin-bottom:10px}
table{border-collapse:collapse}th,td{border:1px solid black;padding:5px}
.kephely{width:240px;height:110px;background:#ddd;color:#555;display:flex;align-items:center;justify-content:center;font-size:13px;text-align:center;margin:6px 0}</style>
</head><body>
<nav><a href="#">Főoldal</a> | <a href="#">Képlink</a> | <a href="#">Listák</a> | <a href="#">Órarend</a> | <a href="#">Témám</a></nav>
<h1>Lovak</h1>
<h2>Bemutatás</h2>
<p>A ló növényevő háziállat. Az ember régóta használja munkára, közlekedésre és sportra.</p>
<div class="kephely">[kép: legelésző ló, alt és title]</div>
<h2>Érdekességek</h2>
<p>A ló állva is tud aludni. A csikó a születése után néhány órával már fut.</p>
<a href="#">Tudj meg többet!</a>
<h2>Jellemzők</h2>
<ul><li>gyors</li><li>erős</li><li>tanulékony</li></ul>
<h2>Adatok</h2>
<table><tr><th>fajta</th><th>jellemző szín</th><th>mire használják</th></tr>
<tr><td>lipicai</td><td>fehér</td><td>díjlovaglás</td></tr>
<tr><td>póni</td><td>barna</td><td>gyereklovaglás</td></tr>
<tr><td>arab telivér</td><td>szürke</td><td>versenyzés</td></tr></table>
<h2>Rangsor</h2>
<ol><li>shire</li><li>belga hidegvérű</li><li>clydesdale</li></ol>
</body></html>`;

const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const meretSzoveg = b => b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB';
const app = document.getElementById('app');

const u = JSON.parse(sessionStorage.getItem('kandoUser') || 'null');
let TOKEN = u ? (u.token || '') : '';
if (u && !TOKEN && u._tesztMod) TOKEN = (JSON.parse(localStorage.getItem('kandoTeacherBackup') || '{}').token || '');
const TANAR = !!u && u.szerep === 'oktato' && !u._tesztMod;
const JOGOS = !!u && (u.szerep === 'oktato' || u._tesztMod || String(u.evfolyam || '') === '9');

let valasztott = [];   // File objektumok

function feladatlapRajz() {
  app.innerHTML = '';
  app.appendChild(document.getElementById('feladatlap').content.cloneNode(true));
  document.querySelector('#temak tbody').innerHTML = TEMAK.map((t, i) =>
    `<tr><td class="sz">${i + 1}</td><td>${esc(t[0])}</td><td>${esc(t[1])}</td><td>${esc(t[2])}</td></tr>`).join('');
  document.querySelector('#pontozo tbody').innerHTML = PONTOZO.map((p, i) =>
    `<tr><td class="sz">${i + 1}</td><td>${esc(p[0])}</td><td>${p[1]}</td></tr>`).join('');
  document.getElementById('minta').srcdoc = MINTA;
  if (TANAR) { document.getElementById('temak-resz').hidden = false; document.getElementById('temam').textContent = 'Oktatói nézet: a tanulók témáját a rendszer sorsolja (lásd lent a Témák listáját).'; }
  else temaBetolt();
  beadasInit();
  sajatBetolt();
}

// ── A sorsolt téma ──
async function temaBetolt() {
  const el = document.getElementById('temam');
  try {
    const r = await fetch(API + '/api/ikt/tema?feladat=' + FELADAT, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    let d = null;
    try { d = await r.json(); } catch (e) {}
    if (!r.ok || !d || !TEMAK[d.temaSorszam - 1]) throw new Error((d && d.error) || 'Nem sikerült betölteni a témádat.');
    const t = TEMAK[d.temaSorszam - 1];
    el.innerHTML = `A témádat a rendszer sorsolta. A te témád:<div class="nev">${esc(t[0])}</div>` +
      `A táblázat oszlopai: <b>${esc(t[1])}</b><br>Rangsor: keresd meg ${esc(t[2])}!`;
  } catch (e) {
    el.innerHTML = `<span class="hiba">${esc(e.message)} Frissítsd az oldalt, vagy szólj a tanárodnak.</span>`;
  }
}

// ── Beadás ──
function beadasInit() {
  const drop = document.getElementById('drop');
  const valaszto = document.getElementById('fajlvalaszto');
  drop.addEventListener('click', () => valaszto.click());
  drop.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); valaszto.click(); } });
  valaszto.addEventListener('change', () => { hozzaad(valaszto.files); valaszto.value = ''; });
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); hozzaad(e.dataTransfer.files); });
  document.getElementById('ghurl').addEventListener('input', gombAllapot);
  document.getElementById('beadom').addEventListener('click', bead);
}

function uzen(szoveg, tipus) {
  const el = document.getElementById('uzenet');
  el.className = 'uzenet ' + (tipus || '');
  el.textContent = szoveg || '';
}

function hozzaad(lista) {
  const hibak = [];
  for (const f of lista) {
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    if (!KITERJ.includes(ext)) { hibak.push(f.name + ': ez a fájltípus nem tölthető fel'); continue; }
    if (f.size > MAX_MERET) { hibak.push(f.name + ': túl nagy (legfeljebb 3 MB)'); continue; }
    if (f.size === 0) { hibak.push(f.name + ': üres fájl'); continue; }
    valasztott = valasztott.filter(v => v.name.toLowerCase() !== f.name.toLowerCase());
    valasztott.push(f);
  }
  if (valasztott.length > MAX_FAJL) { valasztott = valasztott.slice(0, MAX_FAJL); hibak.push('Legfeljebb 12 fájlt adhatsz be.'); }
  listaRajz();
  uzen(hibak.join(' · '), hibak.length ? 'hiba' : '');
}

function listaRajz() {
  document.getElementById('valasztott').innerHTML = valasztott.map((f, i) =>
    `<li><i class="far fa-file"></i><span class="nev">${esc(f.name)}</span><span class="meret">${meretSzoveg(f.size)}</span>` +
    `<button title="Kiveszem" onclick="kivesz(${i})"><i class="fas fa-xmark"></i></button></li>`).join('');
  gombAllapot();
}

function kivesz(i) { valasztott.splice(i, 1); listaRajz(); }

function gombAllapot() {
  const url = document.getElementById('ghurl').value.trim();
  document.getElementById('beadom').disabled = valasztott.length === 0 && url === '';
}

async function bead() {
  const btn = document.getElementById('beadom');
  const url = document.getElementById('ghurl').value.trim();
  if (url && !/^https:\/\/[a-z0-9-]+\.github\.io(\/\S*)?$/i.test(url)) { uzen('A cím így kezdődjön: https://…github.io/', 'hiba'); return; }
  const fd = new FormData();
  fd.append('feladat', FELADAT);
  if (url) fd.append('github_url', url);
  valasztott.forEach(f => fd.append('fajlok', f, f.name));
  btn.disabled = true;
  uzen('Feltöltés…');
  try {
    const r = await fetch(API + '/api/ikt/beadas', { method: 'POST', headers: { 'Authorization': 'Bearer ' + TOKEN }, body: fd });
    let data = null;
    try { data = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error((data && data.error) || ('Hiba történt (' + r.status + ').'));
    valasztott = [];
    listaRajz();
    uzen('Sikeres beadás!', 'jo');
    sajatRajz(data);
  } catch (e) {
    uzen(e.message, 'hiba');
  } finally {
    gombAllapot();
  }
}

async function sajatBetolt() {
  try {
    const r = await fetch(API + '/api/ikt/beadas/sajat?feladat=' + FELADAT, { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    if (!r.ok) return;
    const d = await r.json();
    if (d.beadas) sajatRajz(d.beadas);
  } catch (e) {}
}

function sajatRajz(b) {
  const el = document.getElementById('sajat');
  const elo = API + b.elonezet;
  const fajlok = (b.fajlok || []).map(f => {
    const html = /\.html$/i.test(f.fajlnev);
    return `<li><i class="far ${html ? 'fa-file-code' : 'fa-file'}"></i><span class="nev">` +
      (html ? `<a href="${esc(elo + encodeURIComponent(f.fajlnev))}" target="_blank" rel="noopener">${esc(f.fajlnev)}</a>` : esc(f.fajlnev)) +
      `</span><span class="meret">${meretSzoveg(f.meret)}</span></li>`;
  }).join('');
  el.innerHTML = `<p>Utoljára beadva: <b>${esc(b.updatedAt)}</b></p>` +
    (b.githubUrl ? `<p>GitHub: <a href="${esc(b.githubUrl)}" target="_blank" rel="noopener">${esc(b.githubUrl)}</a></p>` : '') +
    (fajlok ? `<ul class="fajllista">${fajlok}</ul><p class="megj">A HTML fájl nevére kattintva megnézheted, hogyan látszik.</p>` : '');
}

// ── Indítás (a deklarációk után) ──
if (!u || !TOKEN) {
  app.innerHTML = '<div class="kozep"><h2>Be kell jelentkezned</h2><a class="btn" href="../login.html">Bejelentkezés</a></div>';
} else if (!JOGOS) {
  app.innerHTML = '<div class="kozep"><h2>Ez az oldal a 9. évfolyamnak szól.</h2><a class="btn" href="../portal.html">Vissza a portálra</a></div>';
} else {
  document.getElementById('who').textContent = u.nev || '';
  feladatlapRajz();
}
</script>
</body>

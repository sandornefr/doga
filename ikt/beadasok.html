<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKT beadások – Témaoldal</title>
<link rel="icon" href="../kando_favion_light.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#f4f6f8;color:#1f2933;font-family:'Segoe UI',system-ui,sans-serif;line-height:1.45;}
.topbar{display:flex;align-items:center;gap:12px;padding:10px 20px;background:#1f2933;color:#fff;}
.topbar .cim{font-weight:700;flex:1;}
.topbar a{color:#fff;background:#3e4c59;border-radius:6px;padding:6px 12px;text-decoration:none;font-size:.9rem;}
.wrap{max-width:1200px;margin:0 auto;padding:20px;}
.szuro{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.szuro select{padding:6px 10px;border:1px solid #cbd2d9;border-radius:6px;font:inherit;}
.szuro .db{color:#52606d;}
.tanulo{background:#fff;border:1px solid #d9e2ec;border-radius:10px;margin-bottom:12px;}
.fej{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;flex-wrap:wrap;}
.fej .nev{font-weight:700;min-width:200px;}
.fej .oszt{color:#52606d;min-width:90px;}
.fej .ido{color:#52606d;font-size:.9rem;}
.fej .pont{margin-left:auto;font-weight:700;}
.fej .pont small{font-weight:400;color:#52606d;}
.fej a{font-size:.9rem;}
.reszletek{display:none;padding:0 16px 14px;border-top:1px solid #eef2f7;}
.tanulo.nyitva .reszletek{display:block;}
.fajlok{margin:10px 0;font-size:.9rem;display:flex;gap:6px 14px;flex-wrap:wrap;}
.fajlok span{color:#7b8794;}
table.ell{border-collapse:collapse;width:100%;font-size:.9rem;}
table.ell th,table.ell td{border:1px solid #e4e7eb;padding:4px 8px;text-align:left;vertical-align:top;}
table.ell th{background:#f0f4f8;}
table.ell td.p{width:60px;text-align:center;white-space:nowrap;}
.ok{color:#067647;}
.nem{color:#b42318;}
.kezi{color:#b54708;}
.megj{color:#52606d;font-size:.85rem;}
.kozep{text-align:center;padding:60px 20px;}
.hiba{color:#b42318;}
.tema{color:#1d4ed8;font-weight:600;}
.fej .nincs{color:#b54708;font-size:.9rem;}
.fej button.ujra{border:1px solid #cbd2d9;background:#fff;border-radius:6px;padding:3px 8px;font:inherit;font-size:.82rem;cursor:pointer;color:#b42318;}
details.temalista{margin-top:24px;background:#fff;border:1px solid #d9e2ec;border-radius:10px;padding:10px 16px;}
details.temalista summary{cursor:pointer;font-weight:700;}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem;margin-top:10px;}
table.tbl th,table.tbl td{border:1px solid #e4e7eb;padding:4px 8px;text-align:left;}
table.tbl th{background:#f0f4f8;}
.szuro .mind{margin-left:auto;border:0;border-radius:8px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--ikt-gomb,#4f46e5);color:#fff;}
.szuro .mind:disabled{opacity:.7;cursor:default;}
.ghgomb{border:1px solid #cbd2d9;background:#fff;border-radius:6px;padding:3px 10px;font:inherit;font-size:.85rem;cursor:pointer;}
.fajlok.gh{margin-top:14px;}
</style>
<link rel="stylesheet" href="ikt.css?v=1">
</head>
<body>
<div class="topbar">
  <span class="cim"><i class="fas fa-inbox"></i> IKT beadások – Témaoldal</span>
  <a href="temaoldal.html"><i class="fas fa-file-lines"></i> Feladatlap</a>
  <a href="../oktato-portal.html"><i class="fas fa-arrow-left"></i> Vissza</a>
</div>
<div class="wrap" id="app"><div class="kozep">Betöltés…</div></div>

<script src="temak.js"></script>
<script>
const TEMAK = window.IKT_TEMAK;
const API = 'https://agazati.up.railway.app';
const FELADAT = 'temaoldal';
const H2_SORREND = ['Bemutatás', 'Érdekességek', 'Jellemzők', 'Adatok', 'Rangsor'];
const OLDALAK = ['index.html', 'keplink.html', 'listak.html', 'orarend.html', 'tema.html'];
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const app = document.getElementById('app');
const u = JSON.parse(sessionStorage.getItem('kandoUser') || localStorage.getItem('kandoUser') || 'null');
const TOKEN = u && u.szerep === 'oktato' ? u.token : '';
const AUTH = { 'Authorization': 'Bearer ' + TOKEN };

let beadasok = [];   // tanulónként egy sor: beadás és/vagy kiosztott téma
let temak = {};      // email → {id, temaSorszam}
const ellenorzes = {};   // beadás id → eredmény

async function betolt() {
  try {
    const [r, rt] = await Promise.all([
      fetch(API + '/api/ikt/beadasok?feladat=' + FELADAT, { headers: AUTH }),
      fetch(API + '/api/ikt/temak?feladat=' + FELADAT, { headers: AUTH })]);
    if (!r.ok || !rt.ok) throw new Error('Hiba ' + (r.ok ? rt.status : r.status));
    const bl = (await r.json()).beadasok || [];
    const tl = (await rt.json()).temak || [];
    temak = {};
    tl.forEach(t => temak[t.email] = t);
    // Aki már kapott témát, de még nem adott be, az is a listán van.
    beadasok = bl.slice();
    tl.filter(t => !bl.some(b => b.email === t.email)).forEach(t => beadasok.push(
      { id: 't' + t.id, email: t.email, nev: t.nev, osztaly: t.osztaly, csoport: t.csoport, fajlok: [], nincsBeadas: true }));
    beadasok.sort((a, b) => csoportNev(a).localeCompare(csoportNev(b), 'hu') || String(a.nev || '').localeCompare(String(b.nev || ''), 'hu'));
  } catch (e) {
    app.innerHTML = `<div class="kozep hiba">Nem sikerült betölteni: ${esc(e.message)}</div>`;
    return;
  }
  const csoportok = [...new Set(beadasok.map(csoportNev))].sort();
  app.innerHTML = `<div class="szuro"><label for="csop">Csoport:</label>
    <select id="csop"><option value="">mind</option>${csoportok.map(c => `<option>${esc(c)}</option>`).join('')}</select>
    <span class="db" id="db"></span>
    <button class="mind" onclick="mindetEllenoriz(this)" title="A kiválasztott csoport minden beadását újra ellenőrzi (a github.io oldalakat is), legfeljebb 4-et egyszerre"><i class="fas fa-list-check"></i> Mindet ellenőrzöm</button></div>
    <p class="megj" style="margin-bottom:12px">Az automatikus előellenőrzés csak a kódot nézi. A tartalmat (saját szavak, témához illő kép és link, a „leg”-ek helyessége, a kép felbontása) neked kell elbírálnod – ezeknél „kézi” áll.</p>
    <div id="lista"></div>
    <details class="temalista"><summary>A 35 téma</summary>
      <table class="tbl"><thead><tr><th>#</th><th>Téma</th><th>A táblázat oszlopai</th><th>Rangsor: keresd meg…</th></tr></thead>
      <tbody>${TEMAK.map((t, i) => `<tr><td>${i + 1}</td><td>${esc(t[0])}</td><td>${esc(t[1])}</td><td>${esc(t[2])}</td></tr>`).join('')}</tbody></table>
    </details>`;
  document.getElementById('csop').addEventListener('change', listaRajz);
  listaRajz();
  // A feltöltött fájlokat betöltéskor ellenőrzi; a csak github.io-s beadásokat is (legfeljebb 4 egyszerre).
  await parhuzamosan(beadasok.filter(b => !b.nincsBeadas && (b.fajlok.length || b.githubUrl)), 4, b => futtat(b, b.fajlok.length ? 'fajl' : 'github'));
}

function temaNev(b) {
  const t = temak[b.email];
  return t && TEMAK[t.temaSorszam - 1] ? t.temaSorszam + '. ' + TEMAK[t.temaSorszam - 1][0] : 'nincs téma';
}

async function ujrasorsol(email) {
  const t = temak[email];
  if (!t) return;
  const b = beadasok.find(x => x.email === email);
  if (!confirm('Biztosan törlöd ' + (b && b.nev ? b.nev : email) + ' témáját (' + temaNev(b) + ')?\nA következő megnyitáskor a rendszer új témát sorsol neki.')) return;
  const r = await fetch(API + '/api/ikt/tema/' + t.id, { method: 'DELETE', headers: AUTH });
  if (!r.ok) { alert('Nem sikerült törölni (' + r.status + ').'); return; }
  betolt();
}

// Egy beadás ellenőrzése: 'fajl' = a feltöltött fájlok, 'github' = a github.io oldal.
const ghEll = {};   // beadás id → a GitHubos ellenőrzés eredménye
async function futtat(b, mod) {
  if (mod === 'github') {
    const alap = githubAlap(b.githubUrl);
    ghEll[b.id] = alap ? { fut: true } : { hiba: 'A cím nem https://….github.io/… alakú: ' + b.githubUrl };
    sorFrissit(b);
    if (!alap) return;
    try {
      const forras = forrasGithub(alap);
      ghEll[b.id] = await ellenoriz(b, forras);
      if (!(await forras.letezik('index.html')))
        ghEll[b.id].figyel = 'Ezen a címen nem található az index.html sem – lehet, hogy rossz a cím, vagy a GitHub Pages nincs bekapcsolva.';
    }
    catch (e) { ghEll[b.id] = { hiba: 'Nem sikerült letölteni a GitHubról: ' + e.message }; }
  } else {
    ellenorzes[b.id] = await ellenoriz(b, forrasFajlok(b));
  }
  sorFrissit(b);
}

async function parhuzamosan(lista, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, lista.length) }, async () => { while (i < lista.length) await fn(lista[i++]); }));
}

async function mindetEllenoriz(gomb) {
  const sz = document.getElementById('csop').value;
  const lista = beadasok.filter(b => !b.nincsBeadas && (!sz || csoportNev(b) === sz));
  gomb.disabled = true;
  const feladatok = [];
  lista.forEach(b => { if (b.fajlok.length) feladatok.push([b, 'fajl']); if (b.githubUrl) feladatok.push([b, 'github']); });
  let kesz = 0;
  gomb.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Ellenőrzés… 0 / ${feladatok.length}`;
  await parhuzamosan(feladatok, 4, async ([b, m]) => {
    await futtat(b, m);
    gomb.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Ellenőrzés… ${++kesz} / ${feladatok.length}`;
  });
  gomb.disabled = false;
  gomb.innerHTML = '<i class="fas fa-list-check"></i> Mindet ellenőrzöm';
}

const csoportNev = b => (b.osztaly || '–') + (b.csoport ? ' / ' + b.csoport + '. cs.' : '');

function listaRajz() {
  const sz = document.getElementById('csop').value;
  const lista = beadasok.filter(b => !sz || csoportNev(b) === sz);
  document.getElementById('db').textContent = lista.length + ' tanuló, ebből ' + lista.filter(b => !b.nincsBeadas).length + ' beadás';
  document.getElementById('lista').innerHTML = lista.length ? lista.map(b => `
    <div class="tanulo" id="t${b.id}">
      <div class="fej" onclick="this.parentElement.classList.toggle('nyitva')">
        <span class="nev">${esc(b.nev || b.email)}</span>
        <span class="oszt">${esc(csoportNev(b))}</span>
        <span class="tema">${esc(temaNev(b))}</span>
        ${temak[b.email] ? `<button class="ujra" title="A tanuló témájának törlése: a következő megnyitáskor új témát kap" onclick="event.stopPropagation(); ujrasorsol(${esc(JSON.stringify(b.email))})"><i class="fas fa-shuffle"></i> Új téma</button>` : ''}
        ${b.nincsBeadas ? '<span class="nincs"><i class="fas fa-hourglass-half"></i> még nem adott be</span>' : `<span class="ido"><i class="far fa-clock"></i> ${esc(b.updatedAt)}</span>`}
        ${b.fajlok.some(f => f.fajlnev.toLowerCase() === 'tema.html') ? `<a href="${esc(API + b.elonezet + 'tema.html')}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fas fa-eye"></i> tema.html</a>` : ''}
        ${b.githubUrl ? `<a href="${esc(b.githubUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><i class="fab fa-github"></i> github.io</a>` : ''}
        <span class="pont" id="p${b.id}">${b.nincsBeadas ? '' : '…'}</span>
      </div>
      <div class="reszletek" id="r${b.id}"><p class="megj">${b.nincsBeadas ? 'Még nincs beadott fájl.' : 'Ellenőrzés…'}</p></div>
    </div>`).join('') : '<div class="kozep">Még nincs beadás.</div>';
  lista.forEach(b => { if (ellenorzes[b.id] || ghEll[b.id]) sorFrissit(b); });
}

function tablaRajz(e) {
  return `<table class="ell"><thead><tr><th>#</th><th>Szempont</th><th>Eredmény</th><th>Pont</th></tr></thead><tbody>
    ${e.sorok.map((s, i) => `<tr><td class="p">${i + 1}</td><td>${esc(s.cim)}</td>
      <td>${s.allapot === 'ok' ? '<span class="ok"><i class="fas fa-check"></i></span> ' : s.allapot === 'nem' ? '<span class="nem"><i class="fas fa-xmark"></i></span> ' : '<span class="kezi"><i class="fas fa-user-pen"></i> kézi</span> '}${esc(s.megj || '')}</td>
      <td class="p">${s.allapot === 'kezi' ? '? / ' + s.max : (s.allapot === 'ok' ? s.max : 0) + ' / ' + s.max}</td></tr>`).join('')}
    </tbody></table>`;
}
const pontSzoveg = e => `${e.auto} <small>/ ${e.autoMax} automatikus · ${e.keziMax} pont kézi</small>`;

function sorFrissit(b) {
  const e = ellenorzes[b.id], g = ghEll[b.id];
  const p = document.getElementById('p' + b.id), r = document.getElementById('r' + b.id);
  if (!p || !r) return;
  // A fejlécben a feltöltött fájlok eredménye; ha csak link van, a GitHubos.
  const fo = e || (g && g.sorok ? g : null);
  p.innerHTML = fo ? pontSzoveg(fo) + (!e && fo ? ' <small>(GitHub)</small>' : '') : (g && g.fut ? '…' : '');
  let html = '';
  if (b.fajlok.length) {
    const fajlok = b.fajlok.map(f => /\.html$/i.test(f.fajlnev)
      ? `<a href="${esc(API + b.elonezet + encodeURIComponent(f.fajlnev))}" target="_blank" rel="noopener">${esc(f.fajlnev)}</a>`
      : `${esc(f.fajlnev)} <span>(${Math.max(1, Math.round(f.meret / 1024))} KB)</span>`).join('');
    html += `<div class="fajlok"><b>Feltöltött fájlok:</b> ${fajlok}</div>` + (e ? tablaRajz(e) : '<p class="megj">Ellenőrzés…</p>');
  }
  if (b.githubUrl) {
    html += `<div class="fajlok gh"><b><i class="fab fa-github"></i> GitHub:</b> <a href="${esc(b.githubUrl)}" target="_blank" rel="noopener">${esc(b.githubUrl)}</a>`;
    if (!g) html += ` <button class="ghgomb" onclick="futtat(beadasok.find(x => x.id === ${esc(JSON.stringify(b.id))}), 'github')"><i class="fas fa-magnifying-glass"></i> GitHubon is ellenőrzöm</button></div>`;
    else if (g.fut) html += ' <span class="megj"><i class="fas fa-spinner fa-spin"></i> letöltés és ellenőrzés…</span></div>';
    else if (g.hiba) html += `</div><p class="hiba">${esc(g.hiba)}</p>`;
    else html += ` <span class="megj">(${esc(pontSzoveg(g).replace(/<[^>]+>/g, ''))})</span></div>` +
      (g.figyel ? `<p class="hiba"><i class="fas fa-triangle-exclamation"></i> ${esc(g.figyel)}</p>` : '') + tablaRajz(g);
  }
  r.innerHTML = html || '<p class="megj">Még nincs beadott fájl.</p>';
}

// ── Előellenőrzés a pontozó szerint ──
function kapottTema(b) {
  const t = temak[b.email];
  return t && TEMAK[t.temaSorszam - 1] ? TEMAK[t.temaSorszam - 1][0] : null;
}
// Kis-nagybetű és szóközök nélkül; a zárójeles kiegészítés elhagyható (pl.: „Macskafélék (vadon élő)” = „Macskafélék”).
function temaEgyezik(h1, tema) {
  const n = x => String(x || '').toLowerCase().replace(/\s+/g, ' ').replace(/[.!]+$/, '').trim();
  return n(h1) === n(tema) || n(h1) === n(tema.replace(/\s*\(.*?\)\s*/g, ' '));
}
const fajlnev = href => decodeURIComponent(String(href || '').split(/[?#]/)[0]).split('/').pop().toLowerCase();

// ── Források: ugyanazt az ellenőrzést kapja a feltöltött fájl és a github.io oldal ──
// szoveg(út): a fájl szövege vagy null · letezik(út): van-e ilyen fájl · meret(út): bájt vagy null
// Az út a weboldal gyökeréhez képest értendő (pl.: tema.html, css/style.css, img/kep.jpg).
function forrasFajlok(b) {
  const keres = ut => b.fajlok.find(x => x.fajlnev.toLowerCase() === fajlnev(ut));
  const cache = {};
  return {
    tipus: 'fajl',
    hianyUzenet: ut => 'nincs beadva: ' + fajlnev(ut),
    szoveg(ut) {
      const f = keres(ut);
      if (!f) return Promise.resolve(null);
      return cache[f.fajlnev] ||= fetch(API + '/api/ikt/beadas/' + b.id + '/fajl/' + encodeURIComponent(f.fajlnev), { headers: AUTH })
        .then(r => r.ok ? r.text() : null).catch(() => null);
    },
    letezik: ut => Promise.resolve(!!keres(ut)),
    meret: ut => Promise.resolve(keres(ut) ? keres(ut).meret : null),
    vanKep: () => b.fajlok.some(f => /\.(jpe?g|png|gif|webp)$/i.test(f.fajlnev)),
  };
}

// A github.io cím alapja: https://<név>.github.io/<mappa>/ – ha fájlra mutat, annak a mappája.
function githubAlap(url) {
  try {
    const u = new URL(String(url || '').trim());
    if (u.protocol !== 'https:' || !/^[a-z0-9-]+\.github\.io$/i.test(u.hostname)) return null;
    let p = u.pathname;
    if (/\/[^/]+\.[a-z0-9]+$/i.test(p)) p = p.replace(/[^/]+$/, '');
    if (!p.endsWith('/')) p += '/';
    return u.origin + p;
  } catch (e) { return null; }
}

function forrasGithub(alap) {
  const cache = {};
  const letolt = ut => {
    const cel = new URL(String(ut).replace(/^\.\//, ''), alap).href;
    return cache[cel] ||= fetch(cel, { cache: 'no-store' })
      .then(async r => r.ok ? { ok: true, blob: await r.blob() } : { ok: false })
      .catch(() => ({ ok: false, hiba: true }));
  };
  return {
    tipus: 'github',
    alap,
    hianyUzenet: ut => ut + ' nem található a GitHubon – lehet, hogy nem töltötte fel',
    szoveg: async ut => { const r = await letolt(ut); return r.ok ? await r.blob.text() : null; },
    letezik: async ut => (await letolt(ut)).ok,
    meret: async ut => { const r = await letolt(ut); return r.ok ? r.blob.size : null; },
    vanKep: null,   // a GitHubon a tema.html képének megléte számít (lent)
  };
}
const szoveg = el => (el ? el.textContent : '').replace(/\s+/g, ' ').trim();
const mondatok = t => (t.match(/[^.!?]+[.!?]+/g) || []).length;

// A h2-k közötti elemek (dokumentum-sorrendben), a megadott alcím után a következő h2-ig.
function szakasz(doc, cim) {
  const minden = [...doc.body.querySelectorAll('*')];
  const kezd = minden.findIndex(el => el.tagName === 'H2' && szoveg(el).toLowerCase() === cim.toLowerCase());
  if (kezd < 0) return [];
  const ki = [];
  for (let i = kezd + 1; i < minden.length && minden[i].tagName !== 'H2'; i++) ki.push(minden[i]);
  return ki;
}

async function ellenoriz(b, f) {
  const sorok = [];
  const add = (cim, max, allapot, megj) => sorok.push({ cim, max, allapot, megj });
  const [temaSzoveg, cssNyers] = await Promise.all([f.szoveg('tema.html'), f.szoveg('css/style.css')]);
  const cssSzoveg = cssNyers || '';
  const doc = temaSzoveg ? new DOMParser().parseFromString(temaSzoveg, 'text/html') : null;
  const head = doc ? doc.head : null;
  let kepMegvan = false;

  add('A tema.html beadva', 1, temaSzoveg ? 'ok' : 'nem', temaSzoveg ? '' : f.hianyUzenet('tema.html'));
  if (!doc) {
    ['Alap szerkezet és lang="hu"', 'title: Weboldalam', 'A css/style.css csatolva'].forEach(c => add(c, 1, 'nem', ''));
  } else {
    const szerk = /<!doctype html>/i.test(temaSzoveg) && /<head[\s>]/i.test(temaSzoveg) && /<body[\s>]/i.test(temaSzoveg);
    const lang = (doc.documentElement.getAttribute('lang') || '').toLowerCase() === 'hu';
    add('Alap szerkezet és lang="hu"', 1, szerk && lang ? 'ok' : 'nem', [!szerk && 'hiányos váz (doctype/head/body)', !lang && 'nincs lang="hu"'].filter(Boolean).join(', '));
    const title = szoveg(head.querySelector('title'));
    add('title: Weboldalam', 1, title === 'Weboldalam' ? 'ok' : 'nem', title ? '„' + title + '”' : 'nincs title');
    const link = [...head.querySelectorAll('link[rel~="stylesheet"]')].some(l => (l.getAttribute('href') || '').replace(/^\.\//, '') === 'css/style.css');
    add('A css/style.css csatolva', 1, link ? 'ok' : 'nem', link ? '' : 'nincs <link href="css/style.css"> a head-ben');
  }

  // Menü: minden beadott oldalon legyen tema.html link, és a menü minden linkje létező fájlra mutasson.
  const hianyzik = [], nincsMeg = [], rosszLink = [];
  const oldalSzoveg = await Promise.all(OLDALAK.map(o => o === 'tema.html' ? temaSzoveg : f.szoveg(o)));
  for (let i = 0; i < OLDALAK.length; i++) {
    const o = OLDALAK[i], t = oldalSzoveg[i];
    if (t == null) { nincsMeg.push(o); continue; }
    const d = new DOMParser().parseFromString(t, 'text/html');
    const linkek = [...d.querySelectorAll('nav a, a')].map(a => a.getAttribute('href') || '');
    if (!linkek.some(h => fajlnev(h) === 'tema.html')) hianyzik.push(o);
    for (const h of linkek.filter(h => /\.html?$/i.test(h.split(/[?#]/)[0]) && !/^https?:/i.test(h)))
      if (!(await f.letezik(h.split(/[?#]/)[0]))) rosszLink.push(o + ' → ' + h);
  }
  add('A menüben ott a Témám, minden oldalon, és működik', 2, hianyzik.length || nincsMeg.length || rosszLink.length ? 'nem' : 'ok',
    [nincsMeg.length && (f.tipus === 'github' ? 'nem található a GitHubon: ' : 'nincs beadva: ') + nincsMeg.join(', '),
     hianyzik.length && 'nincs tema.html link: ' + hianyzik.join(', '),
     rosszLink.length && 'nem létező oldal: ' + rosszLink.slice(0, 3).join(', ')].filter(Boolean).join(' · '));

  if (!doc) {
    ['h1: a téma neve', 'Öt alcím (h2) jó sorrendben'].forEach(c => add(c, 1, 'nem', ''));
    add('Bemutatás 2 mondat · Érdekességek 2 érdekesség', 2, 'nem', '');
    add('Kép: img mappából, alt és title', 2, 'nem', '');
    add('„Tudj meg többet!” hivatkozás, új lapon', 2, 'nem', '');
    add('Rendezetlen lista 3 jellemzővel', 1, 'nem', '');
    add('Rendezett lista 3 „leg”-gel', 1, 'nem', '');
    add('Táblázat: fejléc + 3 sor, szegély a style.css-ből', 3, 'nem', '');
  } else {
    const h1 = szoveg(doc.querySelector('h1'));
    const kapott = kapottTema(b);
    if (!h1) add('h1: a téma neve', 1, 'nem', 'nincs h1');
    else if (!kapott) add('h1: a téma neve', 1, 'kezi', '„' + h1 + '” – a tanulónak nincs kiosztott témája');
    else add('h1: a téma neve', 1, temaEgyezik(h1, kapott) ? 'ok' : 'nem', '„' + h1 + '” · kapott téma: „' + kapott + '”');
    const h2k = [...doc.querySelectorAll('h2')].map(szoveg);
    const jo = h2k.length >= 5 && H2_SORREND.every((c, i) => (h2k[i] || '').toLowerCase() === c.toLowerCase());
    add('Öt alcím (h2) jó sorrendben', 1, jo ? 'ok' : 'nem', jo ? '' : 'van: ' + (h2k.join(', ') || 'nincs h2'));

    const bemP = szakasz(doc, 'Bemutatás').filter(e => e.tagName === 'P').map(szoveg).join(' ');
    const erdP = szakasz(doc, 'Érdekességek').filter(e => e.tagName === 'P').map(szoveg).join(' ');
    const bemOk = mondatok(bemP) >= 2, erdOk = erdP.length > 0;
    add('Bemutatás 2 mondat · Érdekességek 2 érdekesség', 2, bemOk && erdOk ? 'kezi' : 'nem',
      [`Bemutatás: ${mondatok(bemP)} mondat`, erdOk ? 'Érdekességek: van bekezdés (saját szavak? 2 érdekesség?)' : 'nincs bekezdés az Érdekességek alatt'].join(' · '));

    const img = szakasz(doc, 'Bemutatás').find(e => e.tagName === 'IMG') || doc.querySelector('img');
    if (!img) add('Kép: img mappából, alt és title', 2, 'nem', 'nincs kép');
    else {
      const src = img.getAttribute('src') || '';
      const hibak = [];
      if (!/^(\.\/)?img\//i.test(src)) hibak.push('nem az img mappából: ' + src);
      else if (!(await f.letezik(src))) { hibak.push(f.tipus === 'github' ? f.hianyUzenet(src.replace(/^\.\//, '')) : 'a képfájl nincs beadva: ' + fajlnev(src)); }
      else kepMegvan = true;
      if (!(img.getAttribute('alt') || '').trim()) hibak.push('nincs alt');
      if (!(img.getAttribute('title') || '').trim()) hibak.push('nincs title');
      const meret = kepMegvan ? await f.meret(src) : null;
      add('Kép: img mappából, alt és title', 2, hibak.length ? 'nem' : 'kezi',
        hibak.length ? hibak.join(', ') : `${fajlnev(src)}${meret ? ' (' + Math.max(1, Math.round(meret / 1024)) + ' KB)' : ''} – témához illő? nem a legnagyobb felbontás?`);
    }

    const a = [...doc.querySelectorAll('a')].find(x => szoveg(x).replace(/[!.]+$/, '').toLowerCase() === 'tudj meg többet');
    if (!a) add('„Tudj meg többet!” hivatkozás, új lapon', 2, 'nem', 'nincs ilyen szövegű link');
    else {
      const href = a.getAttribute('href') || '';
      const ujlap = (a.getAttribute('target') || '').toLowerCase() === '_blank';
      const kulso = /^https?:\/\//i.test(href);
      add('„Tudj meg többet!” hivatkozás, új lapon', 2, ujlap && kulso ? 'kezi' : 'nem',
        [kulso ? href : 'nem weboldal: ' + (href || 'üres'), !ujlap && 'nincs target="_blank"'].filter(Boolean).join(' · ') + (ujlap && kulso ? ' – témához illő?' : ''));
    }

    const ul = szakasz(doc, 'Jellemzők').find(e => e.tagName === 'UL');
    const ulDb = ul ? ul.querySelectorAll(':scope > li').length : 0;
    add('Rendezetlen lista 3 jellemzővel', 1, ulDb >= 3 ? 'ok' : 'nem', ul ? ulDb + ' elem' : 'nincs ul a Jellemzők alatt');

    const ol = szakasz(doc, 'Rangsor').find(e => e.tagName === 'OL');
    const olDb = ol ? ol.querySelectorAll(':scope > li').length : 0;
    add('Rendezett lista 3 „leg”-gel', 1, olDb >= 3 ? 'kezi' : 'nem',
      ol ? olDb + ' elem: ' + [...ol.querySelectorAll(':scope > li')].map(szoveg).join(', ') + ' – helyes sorrend?' : 'nincs ol a Rangsor alatt');

    const tbl = szakasz(doc, 'Adatok').find(e => e.tagName === 'TABLE') || doc.querySelector('table');
    const thDb = tbl ? tbl.querySelectorAll('th').length : 0;
    const adatSor = tbl ? [...tbl.querySelectorAll('tr')].filter(tr => tr.querySelector('td')).length : 0;
    const css = cssSzoveg.replace(/\/\*[\s\S]*?\*\//g, '');
    // Szegély a style.css-ből (így ellenőrizhető, hogy a CSS-csatolás működik); a cellákba írt stílus nem elég.
    const cssSzegely = /(^|[},\s])(th\s*,\s*td|td\s*,\s*th)\s*\{[^}]*border\s*:/i.test(css)
      || (/(^|[},\s])td\s*\{[^}]*border\s*:/i.test(css) && /(^|[},\s])th\s*\{[^}]*border\s*:/i.test(css));
    const cellak = tbl ? [...tbl.querySelectorAll('th, td')] : [];
    const inlineSzegely = cellak.length > 0 && cellak.every(c => /border\s*:/i.test(c.getAttribute('style') || ''));
    const cellaSzegely = cssSzegely;
    const hibak = [];
    if (!tbl) hibak.push('nincs táblázat');
    else {
      if (thDb < 3) hibak.push('fejléc: ' + thDb + ' th');
      if (adatSor < 3) hibak.push('adatsor: ' + adatSor);
    }
    if (!cellaSzegely) hibak.push(inlineSzegely ? 'a szegély a cellákban van, nem a style.css-ben' : 'a style.css-ben nincs th, td szegély');
    add('Táblázat: fejléc + 3 sor, szegély a style.css-ből', 3, hibak.length ? 'nem' : 'kezi',
      hibak.length ? hibak.join(', ') : `${thDb} oszlop, ${adatSor} adatsor – a megadott oszlopok?`);
  }

  const hianyFajl = [];
  for (const n of [...OLDALAK, 'css/style.css']) if (!(await f.letezik(n))) hianyFajl.push(n);
  const kep = f.vanKep ? f.vanKep() : kepMegvan;
  const kapott = kapottTema(b);
  const h1Jo = !!(doc && kapott && temaEgyezik(szoveg(doc.querySelector('h1')), kapott));
  add('Minden fájl beadva (HTML-ek, style.css, képek), a témája egyezik a kapott témával', 1,
    hianyFajl.length || !kep || !h1Jo ? 'nem' : 'ok',
    [hianyFajl.length || !kep ? (f.tipus === 'github' ? 'nem található a GitHubon: ' : 'hiányzik: ') + [...hianyFajl, !kep && 'kép'].filter(Boolean).join(', ') : '',
     !kapott ? 'nincs kiosztott téma' : !h1Jo ? 'a h1 nem a kapott téma' : ''].filter(Boolean).join(' · '));

  const auto = sorok.filter(s => s.allapot === 'ok').reduce((a, s) => a + s.max, 0);
  const autoMax = sorok.filter(s => s.allapot !== 'kezi').reduce((a, s) => a + s.max, 0);
  const keziMax = sorok.filter(s => s.allapot === 'kezi').reduce((a, s) => a + s.max, 0);
  return { sorok, auto, autoMax, keziMax };
}

if (!TOKEN) {
  app.innerHTML = '<div class="kozep"><h2>Ez az oldal oktatóknak szól.</h2><p style="margin-top:10px"><a href="../login.html">Bejelentkezés</a></p></div>';
} else {
  betolt();
}
</script>

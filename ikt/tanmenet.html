<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IKT – Vezetett tanmenet</title>
<link rel="icon" href="../kando_favion_light.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* Semmi nem görget (Réka kérése): az oldal pontosan a képernyő magas, a betűméret a képernyőhöz igazodik,
   egyszerre egy alkalom látszik, fülekkel; a hosszú kód oszlopokba tördelődik, a kinézet kicsinyítve fér be. */
*{box-sizing:border-box;margin:0;padding:0;}
html{font-size:clamp(10.5px,min(1.02vw,1.85vh),27px);}
html,body{height:100%;}
body{line-height:1.5;height:100dvh;overflow:hidden;display:flex;flex-direction:column;}
button,input,select,textarea{font:inherit;}
.topbar{display:flex;align-items:center;gap:12px;color:#fff;flex:none;}
.topbar .cim{font-weight:700;flex:1;}
.topbar a{color:#fff;text-decoration:none;font-size:.9rem;}
.kozep{text-align:center;padding:60px 0;}
.kozep .btn{display:inline-block;margin-top:14px;padding:9px 18px;color:#fff;text-decoration:none;}
#app{flex:1;min-height:0;}

.fo{height:100%;display:grid;grid-template-columns:17rem minmax(0,1fr);gap:1.2rem;padding:1.1rem 1.6rem;}
/* bal: az alkalmak */
.sav{display:flex;flex-direction:column;gap:.55rem;min-height:0;}
.sav .fejcim{font-weight:800;font-size:1.15rem;color:#ede9fe;line-height:1.25;}
.sav .fejal{font-size:.82rem;color:var(--d-halvany,#6b7280);margin-bottom:.2rem;}
.ab{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;cursor:pointer;padding:.55rem .7rem;border-radius:.8rem;
  border:1px solid var(--d-keret,#e6e1fb);background:var(--d-kartya,#fff);color:#e2e8f0;font-size:.95rem;}
.ab:hover{border-color:#7c3aed;}
.ab.aktiv{border-color:#a78bfa;background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(79,70,229,.25));}
.ab .sz{flex:none;width:2.1rem;height:2.1rem;border-radius:.6rem;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,#7c3aed,#4f46e5);}
.ab .nev{flex:1;min-width:0;font-weight:700;line-height:1.25;}
.ab .nev small{display:block;font-weight:400;font-size:.78rem;color:var(--d-halvany,#94a3b8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ab .jelzo{flex:none;width:1.3rem;text-align:center;}
.ab .jelzo .fa-check{color:#86efac;}
.ab .jelzo .fa-circle-question{color:#fca5a5;}
.ab.attekgomb .sz{background:linear-gradient(135deg,#0891b2,#0e7490);}

/* jobb: a kiválasztott alkalom */
.jobb{display:flex;flex-direction:column;min-height:0;border:1px solid var(--d-keret,#e6e1fb);border-radius:1rem;background:var(--d-kartya,#fff);box-shadow:0 6px 24px rgba(0,0,0,.3);overflow:hidden;}
.jfej{flex:none;display:flex;align-items:center;gap:1rem;padding:.75rem 1.1rem;border-bottom:1px solid var(--d-keret,#e6e1fb);}
.jfej h1{font-size:1.35rem;line-height:1.2;color:#ede9fe;}
.jfej h1 small{display:block;font-size:.85rem;font-weight:400;color:var(--d-halvany,#94a3b8);}
.fulek{margin-left:auto;display:flex;gap:.3rem;flex:none;}
.fulek button{border:1px solid var(--d-keret,#cbd2d9);border-radius:99px;padding:.35rem .95rem;font-size:.9rem;font-weight:600;cursor:pointer;background:transparent;color:#cbd5e1;}
.fulek button.aktiv{background:linear-gradient(135deg,#7c3aed,#4f46e5);border-color:transparent;color:#fff;}
.tartalom{flex:1;min-height:0;position:relative;}
.panel{position:absolute;inset:0;overflow:hidden;}
.panel[hidden]{display:none;}

/* Lépések fül */
.lp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.9fr);gap:1.4rem;padding:1rem 1.2rem;height:100%;}
.lp h3{font-size:1rem;color:#c4b5fd;margin-bottom:.3rem;}
.lp h3 i{width:1.3rem;}
.lp p{margin-bottom:.9rem;}
.lp ol{padding-left:1.7rem;}
.lp ol li{margin:.15rem 0;break-inside:avoid;}
.lp ol.ket{columns:2;column-gap:2rem;}

/* Kód fül: tördelt sorok, szükség esetén több oszlopban (column-fill:auto) */
.kod{height:100%;margin:0;padding:.8rem 1rem;background:#0b1020;color:#e2e8f0;font-family:Consolas,'Courier New',monospace;line-height:1.45;
  white-space:pre-wrap;overflow-wrap:anywhere;column-fill:auto;column-gap:1.6rem;column-rule:1px solid #1e293b;overflow:hidden;}
.kod .ks{display:block;min-height:1.45em;break-inside:avoid;}
.kod .megj{color:#64748b;}

/* Kinézet fül: a mintaoldal kicsinyítve fér be */
.kinezet{height:100%;background:#fff;position:relative;overflow:hidden;}
.kinezet iframe{position:absolute;top:0;left:0;border:0;background:#fff;transform-origin:0 0;}
.kinezet .elolink{position:absolute;right:.6rem;bottom:.6rem;background:#312e81;color:#fff;border-radius:99px;padding:.3rem .9rem;font-size:.85rem;text-decoration:none;}

/* jelzés: állandó magas sáv alul (nem ugrik) */
.teendo{flex:none;display:flex;align-items:center;gap:.7rem;padding:.6rem 1.1rem;border-top:1px solid var(--d-keret,#e6e1fb);min-height:3.6rem;}
.teendo .tg{flex:none;border:1px solid var(--d-keret,#cbd2d9);border-radius:99px;padding:.4rem 1rem;font-weight:600;cursor:pointer;background:transparent;color:#cbd5e1;font-size:.92rem;}
.teendo .tg.kesz.aktiv{background:rgba(34,197,94,.2);border-color:#22c55e;color:#bbf7d0;}
.teendo .tg.nemertem.aktiv{background:rgba(239,68,68,.2);border-color:#ef4444;color:#fecaca;}
.teendo .kerdes{flex:1;display:flex;gap:.5rem;min-width:0;}
.teendo .kerdes.rejt{visibility:hidden;}
.teendo input{flex:1;min-width:0;padding:.4rem .7rem;border-radius:.5rem;border:1px solid #cbd2d9;font-size:.92rem;}
.teendo .kuld{flex:none;border:0;border-radius:99px;padding:.4rem 1rem;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(135deg,#7c3aed,#4f46e5);font-size:.92rem;}
.teendo .uz{flex:none;width:13rem;font-size:.85rem;text-align:right;}

/* oktatói áttekintés */
.attek{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:1.4rem;padding:1rem 1.2rem;height:100%;}
.attek .szuro{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem;font-size:.9rem;}
.attek select{padding:.25rem .5rem;border-radius:.4rem;}
table.at{width:100%;border-collapse:collapse;}
table.at th,table.at td{border:1px solid var(--d-keret,#e6e1fb);padding:.25rem .45rem;text-align:center;}
table.at td.n{text-align:left;}
table.at th{background:#0f3460;color:#e0e7ff;}
table.at .ok{color:#86efac;}
table.at .nem{color:#fca5a5;}
.attek h3{font-size:1rem;color:#c4b5fd;margin-bottom:.3rem;}
.kerdesek li{margin:.3rem 0 .3rem 1.1rem;}
.kerdesek .ido{color:var(--d-halvany,#94a3b8);font-size:.85em;}

/* telefonon (keskeny képernyőn) szabad görgetni */
@media (max-width:760px){
  html{font-size:14px;}
  body{height:auto;overflow:auto;}
  .fo{height:auto;grid-template-columns:1fr;}
  .jobb{min-height:80vh;}
  .lp,.attek{grid-template-columns:1fr;height:auto;}
  .panel{position:static;}
  .tartalom{min-height:60vh;}
  .kinezet{height:60vh;}
  .teendo{flex-wrap:wrap;}
}
</style>
<link rel="stylesheet" href="ikt.css?v=3">
<style>
/* az ikt.css után: a felső sáv is rem-ben */
body .topbar{padding:.7rem 1.6rem;}
</style>
</head>
<body>
<div class="topbar">
  <span class="cim"><i class="fas fa-route"></i> Vezetett tanmenet</span>
  <span id="who"></span>

</div>
<div id="app"><div class="kozep">Betöltés…</div></div>

<script>
// IKT Projektmunka I. – Vezetett tanmenet (9. évfolyam): a Weboldalam lépésről lépésre, Réka órai mintaoldala
// (https://sandornefr.github.io/IKT_9.A-1.cs/) szerint. A minta statikus másolata: tanmenet-minta/ (nem függ a github.io-tól).
// A tanuló alkalmanként jelez (kész / van, amit nem ért) – csak a szerveren tárolva (/api/ikt/teendo), a böngészőben semmi.
// Semmi nem görget: bal oldalt az alkalmak, jobb oldalt egyszerre egy, fülekkel (Lépések, Kód, Kinézet).
const API = 'https://agazati.up.railway.app';
const MINTA = 'tanmenet-minta/';
const ELO_MINTA = 'https://sandornefr.github.io/IKT_9.A-1.cs/';
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const app = document.getElementById('app');

const u = JSON.parse(sessionStorage.getItem('kandoUser') || 'null');
let TOKEN = u ? (u.token || '') : '';
if (u && !TOKEN && u._tesztMod) TOKEN = (JSON.parse(localStorage.getItem('kandoTeacherBackup') || '{}').token || '');
const JOGOS = !!u && (u.szerep === 'oktato' || u._tesztMod || String(u.evfolyam || '') === '9');
const OKTATO = !!u && u.szerep === 'oktato';
const AUTH = { 'Authorization': 'Bearer ' + TOKEN };

// Új oldal: mindig ez a 7 lépés (Réka mondatai, IKT_9_STILUS.md). A menü az 5. alkalommal jön.
const ujOldal = (fajl, focim) => [

];

// Egy alkalom: cím, mit csináltunk, lépések, minta (kódrészletek a mintaoldalból + kinézet), ha hiányoztál.
// resz: { fajl, navNelkul } – a mintafájl egészben, az eredeti behúzással; navNelkul: a menü (nav) nélkül, mert az csak az 5. alkalommal jön.
const ALKALMAK = [
  {
    cim: 'VS Code és a mappa', al: 'az IKT mappa: css és img',
    mit: 'IKT mappát hoztunk létre a saját meghajtódon az iskolai számítógépen. Benne lett egy css mappa a style.css fájllal, és egy img mappa a képeknek. A mappát VS Code-ban nyitjuk meg.',

    ],

    hiany: 'Kérdezd meg egy osztálytársadat, hogyan néz ki az IKT mappája, és hozd létre ugyanígy a sajátodat a saját meghajtódon!',
  },
  {
    cim: 'Főoldal', al: 'index.html: a neved, bemutatkozás, kollázs',
    mit: 'Elkészült az első oldalunk, a főoldal (index.html). A főcím a nevünk, alatta bemutatkozunk két bekezdésben, és betettük a kollázs képünket.',
    lepesek: [
      ...ujOldal('index.html', 'Főcímként írd ki a teljes nevedet!'),
      'Készíts egy alcímet Bemutatkozás szöveggel!',
      'Az alcím alá írj egy bekezdést magadról!',
      'Írj egy második bekezdést arról, miért a mi iskolánkat választottad!',
      'Készíts egy alcímet Kollázs képem szöveggel!',
      'Mentsd a kollázs képedet az img mappába, és tedd be az alcím alá, 500 képpont szélesen!',
      'Ha a kép nem jeleníthető meg, vagy ha fölé viszed az egeret, jelenjen meg a képre utaló szöveg!',
      'Mentsd el, és nézd meg a böngészőben!',
    ],
    reszek: [{ fajl: 'index.html', navNelkul: true }],
    kinezet: 'index.html',
    hiany: 'A Lépések alapján készítsd el a főoldaladat; a mintán megnézheted, hogyan néz ki nálam.',
  },
  {
    cim: 'Kép és link', al: 'keplink.html: kattintható kép, új lapon',
    mit: 'Új oldalt készítettünk (keplink.html). Betettünk egy képet, ami egyben link is: rákattintva új lapon megnyílik egy oldal, ahol többet megtudhatunk arról, ami a képen van.',
    lepesek: [
      ...ujOldal('keplink.html', 'Főcímként írd ki: KÉP + LINK feladat'),
      'Tölts le a pixabay.com oldalról egy képet, ne a legnagyobb felbontásban, és mentsd az img mappába!',
      'Tedd be a képet a főcím alá!',
      'Ha a kép nem jeleníthető meg, vagy ha fölé viszed az egeret, jelenjen meg a képre utaló szöveg!',
      'Ha a képre kattintasz, nyíljon meg egy oldal, ahol többet megtudhatunk arról, ami a képen van!',
      'A hivatkozás új lapon nyíljon meg!',
      'Mentsd el, és próbáld ki a böngészőben!',
    ],
    reszek: [{ fajl: 'keplink.html', navNelkul: true }],
    kinezet: 'keplink.html',
    hiany: 'A Lépések alapján készítsd el a keplink.html oldalt; a kép bármi lehet, ami neked tetszik.',
  },
  {
    cim: 'Listák', al: 'listak.html: felsorolás és számozott lista',
    mit: 'Új oldalt készítettünk (listak.html), rajta két listát: egy felsorolást a kedvenc szabadidős tevékenységeinkről, és egy számozott listát a kedvenc tantárgyainkról.',
    lepesek: [
      ...ujOldal('listak.html', 'Főcímként írd ki: LISTÁK'),
      'Készíts egy alcímet: Kedvenc szabadidős tevékenységeim:',
      'Alá készíts rendezetlen listát 3 tevékenységgel!',
      'Készíts egy alcímet: Kedvenc tantárgyaim:',
      'Alá készíts rendezett listát 3 tantárggyal!',
      'Mentsd el, és nézd meg a böngészőben!',
    ],
    reszek: [{ fajl: 'listak.html', navNelkul: true }],
    kinezet: 'listak.html',
    hiany: 'A Lépések alapján készítsd el a listak.html oldalt a saját tevékenységeiddel és tantárgyaiddal.',
  },
  {
    cim: 'Órarend és menü', al: 'orarend.html: táblázat; menü minden oldalon',
    mit: 'Elkészült az órarendünk táblázatban (orarend.html). Utána minden oldalra menüt tettünk, így bármelyik oldalról el lehet jutni a többire.',
    lepesek: [
      ...ujOldal('orarend.html', 'Főcímként írd ki: Órarend'),
      'Készíts táblázatot az órarendedből! A fejléc sorban legyen: Óra, Időpont, Hétfő, Kedd, Szerda, Csütörtök, Péntek!',
      'Minden órának legyen egy sora (0.–8. óra), benne az óra sorszámával és az időpontjával!',
      'Írd be a tantárgyaidat a megfelelő cellákba!',
      'A táblázatnak legyen szegélye!',
      'Készítsd el a navigációt minden oldaladon! A menüből mind a négy oldal legyen elérhető: FŐOLDAL, KÉP+LINK, LISTÁK, ÓRAREND.',
      'Ellenőrizd a böngészőben: minden menüpont működik?',
    ],
    reszek: [{ fajl: 'orarend.html' }],
    kinezet: 'orarend.html',
    hiany: 'A Lépések alapján készítsd el az órarendedet, és tedd be a menüt mind a négy oldaladra.',
  },
  {
    cim: 'GitHub', al: 'feltöltés, GitHub Pages, a link beküldése',
    mit: 'Feltöltöttük a weboldalunkat a GitHubra, és bekapcsoltuk a GitHub Pages-t. Így a weboldalunk bárhonnan elérhető egy github.io-s címen, és ezt a címet beküldtük a Weboldalam csempén.',
    lepesek: [
      'Hozz létre egy fiókot a github.com oldalon, vagy jelentkezz be a meglévővel!',
      'Hozz létre egy új repót a weboldaladnak!',
      'Töltsd fel a weboldalad összes fájlját a mappáival együtt (css, img)!',
      'Kapcsold be a GitHub Pages-t: Settings → Pages, Branch: main, majd Save!',
      'Várj 1-2 percet, és nyisd meg a megjelenő címet!',
      'Másold ki a címet, és küldd be a <a href="weboldal.html">Weboldalam</a> csempén!',
    ],
    elo: true,
    hiany: 'A Lépések alapján töltsd fel az oldaladat, és küldd be a címét a Weboldalam csempén.',
  },
];

const MAPPA_FA = `IKT/
├── css/
│   └── style.css
└── img/

(az 5. alkalom végére)
IKT/
├── css/
│   └── style.css
├── img/
│   ├── kollazs.jpg
│   └── kivi.jpg
├── index.html
├── keplink.html
├── listak.html
└── orarend.html`;

// A mintafájlok szövege (egyszer töltjük le).
const mintaCache = {};
const mintaSzoveg = f => mintaCache[f] ||= fetch(MINTA + f, { cache: 'no-cache' }).then(r => r.ok ? r.text() : '').catch(() => '');

let jelzesek = {};   // alkalom → { allapot, megjegyzes, updatedAt }
let aktiv = null;    // a kiválasztott alkalom sorszáma (oktatónál 0 = áttekintés)
let aktivFul = 'lepes';

// Egy elem betűméretét addig csökkenti, amíg a tartalma befér (nincs görgetés). Kód esetén oszlopokat is próbál.
function illeszt(el, { min = 0.55, max = 1.05, oszlop = 1 } = {}) {
  if (!el || !el.clientHeight) return;
  for (let fs = max; fs >= min - 0.001; fs -= 0.025) {
    el.style.fontSize = fs.toFixed(3) + 'rem';
    for (let c = 1; c <= oszlop; c++) {
      if (oszlop > 1) el.style.columnCount = c;
      if (el.scrollHeight <= el.clientHeight + 1 && el.scrollWidth <= el.clientWidth + 1) return;
    }
  }
}

function savRajz() {
  const ikon = n => { const j = jelzesek[n]; return !j ? '' : j.allapot === 'kesz' ? '<i class="fas fa-check" title="kész"></i>' : '<i class="fas fa-circle-question" title="kérdésem van"></i>'; };
  document.getElementById('sav').innerHTML =
    `<div class="fejcim">A Weboldalam lépésről lépésre</div><div class="fejal">Válaszd ki az alkalmat!</div>` +
    (OKTATO ? `<button class="ab attekgomb${aktiv === 0 ? ' aktiv' : ''}" data-n="0"><span class="sz"><i class="fas fa-table"></i></span><span class="nev">Ki hol tart?<small>a tanulók jelzései</small></span></button>` : '') +
    ALKALMAK.map((a, i) => `<button class="ab${aktiv === i + 1 ? ' aktiv' : ''}" data-n="${i + 1}"><span class="sz">${i + 1}</span><span class="nev">${esc(a.cim)}<small>${esc(a.al)}</small></span><span class="jelzo">${ikon(i + 1)}</span></button>`).join('');
  document.querySelectorAll('#sav .ab').forEach(b => b.onclick = () => valaszt(+b.dataset.n));
}

function valaszt(n, ful) {
  aktiv = n;
  aktivFul = ful || 'lepes';
  try { history.replaceState(null, '', n ? '#a' + n : '#attekintes'); } catch (e) {}
  savRajz();
  if (n === 0) { attekRajzKeret(); return; }
  const a = ALKALMAK[n - 1];
  const vanKinezet = !!(a.kinezet || a.elo);
  document.getElementById('jobb').innerHTML = `
    <div class="jfej">
      <h1>${n}. ${esc(a.cim)}<small>${esc(a.al)}</small></h1>
      <div class="fulek">
        <button data-ful="lepes"><i class="fas fa-list-ol"></i> Lépések</button>
        <button data-ful="kod"><i class="fas fa-code"></i> ${a.mappa ? 'Mappák' : a.elo ? 'Cím' : 'Kód'}</button>
        ${vanKinezet ? '<button data-ful="kinezet"><i class="fas fa-display"></i> Kinézet</button>' : ''}
      </div>
    </div>
    <div class="tartalom">
      <div class="panel" data-panel="lepes"><div class="lp">
        <div>
          <h3><i class="fas fa-chalkboard-user"></i> Mit csináltunk</h3><p>${esc(a.mit)}</p>
          <h3><i class="fas fa-user-clock"></i> Ha hiányoztál</h3><p>${esc(a.hiany)}</p>
        </div>
        <div><h3><i class="fas fa-list-ol"></i> Lépések</h3><ol class="${a.lepesek.length > 9 ? 'ket' : ''}">${a.lepesek.map(l => `<li>${l}</li>`).join('')}</ol></div>
      </div></div>
      <div class="panel" data-panel="kod" hidden><pre class="kod"></pre></div>
      ${vanKinezet ? `<div class="panel" data-panel="kinezet" hidden><div class="kinezet"></div></div>` : ''}
    </div>
    ${OKTATO ? '' : `<div class="teendo">
      <button class="tg kesz" data-allapot="kesz"><i class="fas fa-check"></i> Kész vagyok vele</button>
      <button class="tg nemertem" data-allapot="nemertem"><i class="fas fa-circle-question"></i> Van, amit nem értek</button>
      <div class="kerdes rejt"><input type="text" maxlength="500" placeholder="Írd le röviden, mit nem értesz! (A tanárod látja.)"><button class="kuld"><i class="fas fa-paper-plane"></i> Elküldöm</button></div>
      <div class="uz megj"></div>
    </div>`}`;
  document.querySelectorAll('#jobb .fulek button').forEach(b => b.onclick = () => fulValt(b.dataset.ful));
  if (!OKTATO) teendoEsemenyek(n);
  fulValt(aktivFul);
}

async function fulValt(ful) {
  aktivFul = ful;
  document.querySelectorAll('#jobb .fulek button').forEach(b => b.classList.toggle('aktiv', b.dataset.ful === ful));
  document.querySelectorAll('#jobb .panel').forEach(p => p.hidden = p.dataset.panel !== ful);
  const a = ALKALMAK[aktiv - 1];
  if (ful === 'lepes') illeszt(document.querySelector('#jobb .lp'), { min: 0.6, max: 1.05 });
  if (ful === 'kod') await kodRajz(a);
  if (ful === 'kinezet') kinezetRajz(a);
}

// Kód soronként: a hosszú sor tördelődik, a folytatás a sor behúzása alatt kezdődik (+2 karakter).
function kodSorok(szoveg) {
  return szoveg.split('\n').map(sor => {
    const beh = sor.match(/^\s*/)[0].replace(/\t/g, '    ').length;
    return `<span class="ks" style="padding-left:${beh + 2}ch;text-indent:-2ch">${esc(sor.trim()) || ' '}</span>`;
  }).join('');
}

async function kodRajz(a) {
  const pre = document.querySelector('#jobb .kod');
  if (!pre.dataset.kesz) {
    if (a.mappa) pre.innerHTML = kodSorok(MAPPA_FA);
    else if (a.elo) pre.innerHTML = kodSorok('A weboldalam címe:\n' + ELO_MINTA + '\n\nA Kinézet fülön megnézheted, vagy nyisd meg új lapon!') +
      `<span class="ks"> </span><span class="ks"><a href="${esc(ELO_MINTA)}" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i> Megnyitom új lapon</a></span>`;
    else {
      const darabok = [];
      for (const r of a.reszek) {
        let sz = (await mintaSzoveg(r.fajl)).replace(/\r/g, '').trim();
        if (r.navNelkul) sz = sz.replace(/\n[ \t]*<nav>[\s\S]*?<\/nav>[ \t]*/, '');
        darabok.push(`<span class="ks megj">${esc('<!-- ' + r.fajl + ' -->')}</span>` + kodSorok(sz || '(nem található)'));
      }
      pre.innerHTML = darabok.join('<span class="ks"> </span>');
    }
    pre.dataset.kesz = '1';
  }
  if (aktivFul === 'kod') illeszt(pre, { min: 0.5, max: 1, oszlop: 4 });
}

// A mintaoldal 1100 px szélesen, a tartalom teljes magasságában, a dobozba kicsinyítve.
const KIN_SZ = 1100;
function kinezetRajz(a) {
  const doboz = document.querySelector('#jobb .kinezet');
  let f = doboz.querySelector('iframe');
  const meretez = () => {
    try {
      const d = f.contentDocument;
      const h = Math.max(300, d.body.scrollHeight + 24);
      const s = Math.min(1, doboz.clientWidth / KIN_SZ, doboz.clientHeight / h);
      f.style.width = KIN_SZ + 'px'; f.style.height = h + 'px';
      f.style.transform = `scale(${s})`;
      f.style.left = Math.max(0, (doboz.clientWidth - KIN_SZ * s) / 2) + 'px';
    } catch (e) {}
  };
  if (!f) {
    f = document.createElement('iframe');
    // azonos eredetű, szkript nélküli statikus mintaoldal: a méretét le lehet mérni; szkript nem futhat benne
    f.setAttribute('sandbox', 'allow-same-origin allow-popups allow-popups-to-escape-sandbox');
    f.setAttribute('scrolling', 'no');
    f.title = 'A minta kinézete';
    f.src = MINTA + (a.kinezet || 'index.html');
    f.addEventListener('load', () => { meretez(); [...f.contentDocument.images].forEach(k => k.complete || k.addEventListener('load', meretez)); });
    doboz.appendChild(f);
    doboz.insertAdjacentHTML('beforeend', a.elo
      ? `<a class="elolink" href="${esc(ELO_MINTA)}" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i> Az élő oldalam a GitHubon</a>`
      : `<a class="elolink" href="${esc(MINTA + a.kinezet)}" target="_blank" rel="noopener"><i class="fas fa-up-right-from-square"></i> Megnyitom nagyban</a>`);
  } else meretez();
}

function teendoRajz(n) {
  const el = document.querySelector('#jobb .teendo');
  if (!el || aktiv !== n) return;
  const j = jelzesek[n];
  el.querySelectorAll('.tg').forEach(b => b.classList.toggle('aktiv', !!j && b.dataset.allapot === j.allapot));
  const kerdes = el.querySelector('.kerdes');
  kerdes.classList.toggle('rejt', !(j && j.allapot === 'nemertem') && !el.dataset.nyitva);
  const inp = el.querySelector('input');
  if (j && j.allapot === 'nemertem' && document.activeElement !== inp) inp.value = j.megjegyzes || '';
}

async function jelzesKuld(n, allapot, megjegyzes) {
  const el = document.querySelector('#jobb .teendo');
  const uz = el.querySelector('.uz');
  uz.textContent = 'Mentés…'; uz.style.color = '';
  try {
    const r = await fetch(API + '/api/ikt/teendo/' + n, { method: 'PUT', headers: { ...AUTH, 'Content-Type': 'application/json' }, body: JSON.stringify({ allapot, megjegyzes }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('Hiba: ' + r.status));
    if (allapot) jelzesek[n] = { allapot, megjegyzes, updatedAt: '' }; else delete jelzesek[n];
    delete el.dataset.nyitva;
    teendoRajz(n); savRajz();
    uz.textContent = !allapot ? 'Visszavontad a jelzést.' : allapot === 'kesz' ? 'Szuper! Elmentve.' : 'Elküldve, a tanárod látja.';
    uz.style.color = '#86efac';
  } catch (e) {
    uz.textContent = 'Nem sikerült menteni: ' + e.message; uz.style.color = '#fca5a5';
  }
}

function teendoEsemenyek(n) {
  const el = document.querySelector('#jobb .teendo');
  el.querySelectorAll('.tg').forEach(b => b.onclick = () => {
    const j = jelzesek[n];
    if (b.dataset.allapot === 'kesz') { jelzesKuld(n, j && j.allapot === 'kesz' ? '' : 'kesz', ''); return; }
    // „Van, amit nem értek”: előbb megírja, mit nem ért, az Elküldöm menti.
    if (j && j.allapot === 'nemertem') { jelzesKuld(n, '', ''); return; }
    el.dataset.nyitva = '1'; teendoRajz(n);
    el.querySelector('input').focus();
  });
  const kuld = () => {
    const t = el.querySelector('input').value.trim();
    if (!t) { const uz = el.querySelector('.uz'); uz.textContent = 'Írd le röviden, mit nem értesz!'; uz.style.color = '#fcd34d'; return; }
    jelzesKuld(n, 'nemertem', t);
  };
  el.querySelector('.kuld').onclick = kuld;
  el.querySelector('input').onkeydown = e => { if (e.key === 'Enter') kuld(); };
  teendoRajz(n);
}

// ── Oktatói áttekintés: tanulónként az alkalmak jelzései ──
let attekAdat = null;
const csopNev = t => (t.osztaly || '') + (t.csoport ? ' / ' + t.csoport + '. cs.' : '');
async function attekRajzKeret() {
  document.getElementById('jobb').innerHTML = `<div class="jfej"><h1>Ki hol tart?<small>Csak azok a tanulók látszanak, akik már jeleztek valamit.</small></h1></div>
    <div class="tartalom"><div class="panel"><div class="attek" id="attek">Betöltés…</div></div></div>`;
  if (!attekAdat) {
    try {
      const r = await fetch(API + '/api/ikt/teendok', { headers: AUTH });
      if (!r.ok) { document.getElementById('attek').innerHTML = '<p class="megj">Az áttekintéshez IKT jogosultság kell.</p>'; return; }
      attekAdat = (await r.json()).teendok || [];
    } catch (e) { document.getElementById('attek').innerHTML = '<p class="hiba">Nem sikerült betölteni.</p>'; return; }
  }
  const csop = [...new Set(attekAdat.map(csopNev))].sort((a, b) => a.localeCompare(b, 'hu'));
  document.getElementById('attek').innerHTML = `<div><div class="szuro"><label>Csoport: <select id="at-csop"><option value="">mind</option>${csop.map(c => `<option>${esc(c)}</option>`).join('')}</select></label></div><div id="at-tabla"></div></div><div id="at-kerdes" class="kerdesek"></div>`;
  document.getElementById('at-csop').onchange = attekRajz;
  attekRajz();
}
function attekRajz() {
  const sz = document.getElementById('at-csop').value;
  const adat = attekAdat.filter(t => !sz || csopNev(t) === sz);
  const tanulok = {};
  adat.forEach(t => { (tanulok[t.email] ||= { nev: t.nev || t.email, csop: csopNev(t), j: {} }).j[t.alkalom] = t; });
  const sorok = Object.values(tanulok).sort((a, b) => a.csop.localeCompare(b.csop, 'hu') || a.nev.localeCompare(b.nev, 'hu'));
  const kerdesek = adat.filter(t => t.allapot === 'nemertem');
  document.getElementById('at-tabla').innerHTML = !sorok.length ? '<p class="megj">Még senki nem jelzett.</p>' :
    `<table class="at"><thead><tr><th>Tanuló</th><th>Csoport</th>${ALKALMAK.map((a, i) => `<th title="${esc(a.cim)}">${i + 1}.</th>`).join('')}</tr></thead><tbody>` +
    sorok.map(s => `<tr><td class="n">${esc(s.nev)}</td><td>${esc(s.csop)}</td>${ALKALMAK.map((a, i) => {
      const j = s.j[i + 1];
      return `<td>${!j ? '' : j.allapot === 'kesz' ? '<i class="fas fa-check ok" title="kész"></i>' : `<i class="fas fa-circle-question nem" title="${esc(j.megjegyzes || '')}"></i>`}</td>`;
    }).join('')}</tr>`).join('') + '</tbody></table>';
  document.getElementById('at-kerdes').innerHTML = `<h3><i class="fas fa-circle-question" style="color:#fca5a5"></i> Amit nem értenek (${kerdesek.length})</h3>` +
    (kerdesek.length ? '<ul>' + kerdesek.map(t => `<li><b>${esc(t.nev || t.email)}</b> (${esc(csopNev(t))}) – ${t.alkalom}. ${esc(ALKALMAK[t.alkalom - 1] ? ALKALMAK[t.alkalom - 1].cim : '')}: „${esc(t.megjegyzes || '')}” <span class="ido">${esc(t.updatedAt)}</span></li>`).join('') + '</ul>' : '<p class="megj">Nincs kérdés.</p>');
  illeszt(document.getElementById('attek'), { min: 0.55, max: 1 });
}

let atmeretezIdo;
window.addEventListener('resize', () => { clearTimeout(atmeretezIdo); atmeretezIdo = setTimeout(() => { if (aktiv === 0) attekRajz(); else if (aktiv) fulValt(aktivFul); }, 150); });

async function indit() {
  document.getElementById('who').textContent = u.nev || '';
  app.innerHTML = `<div class="fo"><nav class="sav" id="sav"></nav><section class="jobb" id="jobb"></section></div>`;
  if (!OKTATO) {
    try {
      const r = await fetch(API + '/api/ikt/teendo/sajat', { headers: AUTH });
      if (r.ok) ((await r.json()).teendok || []).forEach(t => jelzesek[t.alkalom] = t);
    } catch (e) {}
  }
  // #a3 → a 3. alkalom; oktatónál alapból az áttekintés
  const m = /^#a(\d+)$/.exec(location.hash);
  const n = m && ALKALMAK[+m[1] - 1] ? +m[1] : (OKTATO ? 0 : 1);
  valaszt(n);
}

if (!u) {
  app.innerHTML = '<div class="kozep"><h2>Be kell jelentkezned</h2><a class="btn" href="../login.html">Bejelentkezés</a></div>';
} else if (!JOGOS) {
  app.innerHTML = '<div class="kozep"><h2>Ez az oldal a 9. évfolyamnak szól.</h2><a class="btn" href="../portal.html">Vissza a portálra</a></div>';
} else {
  indit();
}
</script>

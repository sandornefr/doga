<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gyakorló feladatok kiadása – Kandó</title>
<link rel="icon" href="../../kando_favion_dark.png" type="image/png" media="(prefers-color-scheme: light)">
<link rel="icon" href="../../kando_favion_light.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
/* Oktatói oldal: felül csoportválasztó, alatta témánként lenyitható pipás lista (a Csoportjaim fül kiadásával azonos adat) */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #0d1117; --bg2: #161b22; --bg3: #1f2937; --border: #30363d; --text: #e6edf3; --muted: #8b949e;
        --accent: #3fb950; --yellow: #f59e0b; --font: 'Segoe UI', system-ui, sans-serif; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 16px; min-height: 100vh; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); }
.topbar img { height: 30px; display: block; }
.vissza { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border); color: var(--muted); text-decoration: none; font-size: .85rem; }
.vissza:hover { border-color: var(--accent); color: var(--accent); }
.cim { font-weight: 700; font-size: 1.1rem; } .cim i { color: var(--accent); margin-right: 6px; }
main { max-width: 1000px; margin: 0 auto; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 16px; }
.magyar { color: var(--muted); line-height: 1.5; }
.csoportok { display: flex; flex-wrap: wrap; gap: 8px; }
.cs-gomb { font: inherit; font-size: .9rem; padding: 7px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--bg2); color: var(--text); cursor: pointer; }
.cs-gomb:hover { border-color: var(--accent); }
.cs-gomb.aktiv { border-color: var(--accent); background: rgba(63,185,80,.15); color: var(--accent); font-weight: 600; }
.cs-gomb small { color: var(--muted); margin-left: 4px; }
.tema { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 16px; }
.tema summary { cursor: pointer; padding: 6px 0; font-size: 1rem; list-style: none; display: flex; align-items: center; gap: 10px; }
.tema summary::-webkit-details-marker { display: none; }
.tema summary::before { content: '\25B8'; color: var(--muted); }
.tema[open] summary::before { content: '\25BE'; }
.db { margin-left: auto; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.db b { color: var(--accent); }
.gombok { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0 4px; }
.gomb { font: inherit; font-size: .85rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.gomb:hover { border-color: var(--accent); }
.gomb.zar:hover { border-color: #f85149; }
.lista { columns: 2 340px; column-gap: 28px; margin-top: 6px; }
.csop { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 0 4px; break-after: avoid; }
.elem { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; break-inside: avoid; }
.elem input { width: 17px; height: 17px; accent-color: var(--accent); }
.elem.kiadva .nev { color: var(--accent); }
.elem .kw { color: var(--muted); font-size: .8rem; }
.elem .datum { margin-left: auto; font-size: .75rem; color: var(--muted); white-space: nowrap; }
.uzenet { padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--border); color: var(--muted); }
.hiba { border-color: #f85149; color: #ffa198; }
.megerosit { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 10px; border-radius: 8px; background: rgba(248,81,73,.1); border: 1px solid #f85149; margin: 6px 0; font-size: .9rem; }
</style>
</head>
<body>
<header class="topbar">
  <a href="../../oktato-portal.html" title="Oktatói felület"><img src="../kandologo2.png" alt="Kandó"></a>
  <a href="../../oktato-portal.html" class="vissza"><i class="fas fa-arrow-left"></i> Oktatói felület</a>
  <span class="cim"><i class="fas fa-dumbbell"></i>Gyakorló feladatok kiadása</span>
</header>
<main>
  <p class="magyar">Válaszd ki a csoportot, és pipáld ki, amit az órán megoldottatok. A csoport tanulói otthon csak a kipipált feladatokat látják (Python → Gyakorló feladatok). Minden pipa azonnal mentődik.</p>
  <div class="csoportok" id="csoportok"><span class="magyar">Csoportok betöltése…</span></div>
  <div id="temak"></div>
</main>

<script src="feladatok/alapok.js?v=4"></script>
<script src="feladatok/ciklus.js?v=5"></script>
<script>
'use strict';
const API = 'https://agazati.up.railway.app';
const U = JSON.parse(sessionStorage.getItem('kandoUser') || localStorage.getItem('kandoUser') || '{}');
const TOKEN = (U.szerep === 'oktato' && U.token) || localStorage.getItem('admin_token') || '';
if (!TOKEN) location.replace('../../login.html');
const TEMAK = window.GYAKORLO_TEMAK || [];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const NAP = ['vasárnap', 'hétfő', 'kedd', 'szerda', 'csütörtök', 'péntek', 'szombat'];
const huDatum = s => { const d = new Date(s + 'T12:00:00'); return `${d.getMonth() + 1}. ${d.getDate()}. (${NAP[d.getDay()]})`; };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const csoportNev = k => { const [e, o, c] = k.split('.'); return !c ? `${e}.${o}` : c === 'info' ? `${e}.${o} informatika` : `${e}.${o} ${c}. cs.`; };
const st = { csoportok: [], csoport: null, feloldva: new Map(), nyitott: new Set(), zarKerdes: null };

async function kerd(url, opt = {}) {
  const r = await fetch(API + url, { ...opt, headers: { ...(opt.headers || {}), Authorization: 'Bearer ' + TOKEN } });
  if (r.status === 401) { location.replace('../../login.html?expired=1'); throw new Error('401'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function indul() {
  const most = new Date(), tanev = most.getMonth() >= 7 ? most.getFullYear() : most.getFullYear() - 1;
  let orak = [];
  try { orak = await kerd(`/api/csoportjaim/orarend?tanev=${tanev}`); }
  catch { document.getElementById('csoportok').innerHTML = '<div class="uzenet hiba">Az órarend betöltése nem sikerült. Frissítsd az oldalt!</div>'; return; }
  st.csoportok = [...new Set(orak.map(o => `${o.evfolyam}.${o.osztaly}.${o.csoport || ''}`))]
    .sort((a, b) => a.localeCompare(b, 'hu', { numeric: true }));
  if (!st.csoportok.length) {
    document.getElementById('csoportok').innerHTML = '<div class="uzenet">Még nincs felvéve órarend. Az admin felület <b>Csoportjaim</b> fülén, a Beállítások gombbal veheted fel.</div>';
    return;
  }
  let utolso = null;
  try { utolso = localStorage.getItem('gyakorlo_kiadas_csoport'); } catch {}
  valaszt(st.csoportok.includes(utolso) ? utolso : st.csoportok[0]);
}

function rajzolCsoportok() {
  document.getElementById('csoportok').innerHTML = st.csoportok.map(k =>
    `<button class="cs-gomb${k === st.csoport ? ' aktiv' : ''}" onclick="valaszt('${esc(k)}')">${esc(csoportNev(k))}</button>`).join('');
}

async function valaszt(k) {
  st.csoport = k; st.zarKerdes = null;
  try { localStorage.setItem('gyakorlo_kiadas_csoport', k); } catch {}
  rajzolCsoportok();
  await betolt();
}

async function betolt() {
  const k = st.csoport;
  try {
    const lista = await kerd(`/api/oktato/gyakorlo/feloldas?csoport=${encodeURIComponent(k)}`);
    if (k !== st.csoport) return;
    st.feloldva = new Map(lista.map(x => [x.feladat, x.datum]));
    rajzolTemak();
  } catch {
    document.getElementById('temak').innerHTML = '<div class="uzenet hiba">A kiadott feladatok betöltése nem sikerült. Frissítsd az oldalt!</div>';
  }
}

function rajzolTemak() {
  document.getElementById('temak').innerHTML = TEMAK.map(t => {
    const db = t.feladatok.filter(f => st.feloldva.has(f.id)).length;
    let csop = null, lista = '';
    for (const f of t.feladatok) {
      if (f.csop !== csop && f.csop !== t.cim) { csop = f.csop; lista += `<div class="csop">${esc(csop)}</div>`; }
      const d = st.feloldva.get(f.id);
      lista += `<label class="elem${d ? ' kiadva' : ''}"><input type="checkbox" ${d ? 'checked' : ''} onchange="pipa('${f.id}', this.checked)">
        <span class="nev">${f.sorszam}. ${esc(f.cim)}</span>${f.kell ? `<span class="kw">(${esc(f.kell)})</span>` : ''}
        ${d ? `<span class="datum">${esc(huDatum(d))}</span>` : ''}</label>`;
    }
    const kerdes = st.zarKerdes === t.id ? `<div class="megerosit">Biztosan visszazárod a téma összes feladatát ennél a csoportnál?
        <button class="gomb zar" onclick="tema('${t.id}', false, true)">Igen, visszazárom</button>
        <button class="gomb" onclick="st.zarKerdes = null; rajzolTemak()">Mégse</button></div>` : '';
    return `<details class="tema" style="margin-bottom:10px" ${st.nyitott.has(t.id) ? 'open' : ''} ontoggle="nyit('${t.id}', this.open)">
      <summary><b>${esc(t.cim)}</b><span class="db">kiadva: <b>${db}</b> / ${t.feladatok.length}</span></summary>
      <div class="gombok">
        <button class="gomb" onclick="tema('${t.id}', true)"><i class="fas fa-lock-open"></i> Az egész téma tanult</button>
        <button class="gomb zar" onclick="tema('${t.id}', false)"><i class="fas fa-lock"></i> Mindet visszazárom</button>
      </div>${kerdes}
      <div class="lista">${lista}</div></details>`;
  }).join('');
}

function nyit(id, nyitva) { if (nyitva) st.nyitott.add(id); else st.nyitott.delete(id); }

async function ment(feladatok, feloldva) {
  try {
    await kerd('/api/oktato/gyakorlo/feloldas', { method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ csoport: st.csoport, feladatok, feloldva, datum: iso(new Date()) }) });
  } catch {
    document.getElementById('temak').insertAdjacentHTML('afterbegin', '<div class="uzenet hiba" style="margin-bottom:10px">A mentés nem sikerült. Próbáld újra!</div>');
  }
  await betolt();
}
function pipa(id, be) { ment([id], be); }
function tema(id, be, megerositve) {
  const t = TEMAK.find(x => x.id === id);
  if (!t) return;
  if (!be && !megerositve) { st.zarKerdes = id; st.nyitott.add(id); rajzolTemak(); return; }
  st.zarKerdes = null;
  const ids = t.feladatok.map(f => f.id).filter(fid => be ? !st.feloldva.has(fid) : st.feloldva.has(fid));
  if (ids.length) ment(ids, be); else rajzolTemak();
}

indul();
</script>
</body>
</html>

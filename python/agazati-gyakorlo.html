<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gyakorló feladatok</title>
  <link rel="icon" href="../kando_favion_dark.png"  type="image/png" media="(prefers-color-scheme: light)">
  <link rel="icon" href="../kando_favion_light.png" type="image/png" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:#0f172a; --bg2:#111827; --bg3:#1e293b; --border:#1f2937;
      --text:#e2e8f0; --muted:#94a3b8;
      --konnyu:#22c55e; --kozepes:#f59e0b; --nehez:#ef4444;
      --font:'Segoe UI',system-ui,sans-serif;
      --topbar-h:54px; --tabbar-h:46px; --bottom-h:54px;
      --list-w:210px;
    }
    html,body { height:100%; overflow:hidden; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); display:flex; flex-direction:column; }

    /* TOPBAR */
    .topbar { height:var(--topbar-h); background:var(--bg2); border-bottom:1px solid var(--border);
      display:flex; align-items:center; padding:0 12px; gap:8px; flex-shrink:0; }
    .topbar-logo { height:30px; }
    .topbar-title { font-size:0.95rem; font-weight:700; color:var(--text); white-space:nowrap; }
    .topbar-spacer { flex:1; }
    #pyodide-status { font-size:0.72rem; padding:2px 8px; border-radius:4px;
      background:rgba(245,158,11,.12); color:#fcd34d; border:1px solid rgba(245,158,11,.3); white-space:nowrap; }
    #pyodide-status.ready { background:rgba(34,197,94,.1); color:#86efac; border-color:rgba(34,197,94,.3); }
    .btn-back { display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:8px;
      background:transparent; border:1.5px solid var(--border); color:var(--muted);
      font-size:0.82rem; cursor:pointer; text-decoration:none; transition:all .2s; white-space:nowrap; }
    .btn-back:hover { border-color:var(--konnyu); color:var(--konnyu); }

    /* TABBAR */
    .tabbar { height:var(--tabbar-h); background:var(--bg2); border-bottom:1px solid var(--border);
      display:flex; align-items:center; padding:0 12px; gap:6px; flex-shrink:0; }
    .diff-tab { display:flex; align-items:center; gap:6px; padding:6px 14px; border-radius:8px;
      border:1.5px solid var(--border); background:transparent; color:var(--muted);
      font-size:0.84rem; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; }
    .diff-tab .badge { font-size:0.7rem; background:rgba(255,255,255,.08); border-radius:10px;
      padding:1px 6px; font-weight:700; }
    .diff-tab.konnyu.active  { border-color:var(--konnyu); color:var(--konnyu); background:rgba(34,197,94,.1); }
    .diff-tab.kozepes.active { border-color:var(--kozepes); color:var(--kozepes); background:rgba(245,158,11,.1); }
    .diff-tab.nehez.active   { border-color:var(--nehez); color:var(--nehez); background:rgba(239,68,68,.1); }
    .diff-tab:not(.active):hover { border-color:#374151; color:var(--text); }
    .tabbar-spacer { flex:1; }
    .btn-random { display:flex; align-items:center; gap:6px; padding:6px 14px; border-radius:8px;
      border:1.5px solid #4f46e5; background:rgba(79,70,229,.1); color:#a5b4fc;
      font-size:0.84rem; font-weight:600; cursor:pointer; transition:all .2s; white-space:nowrap; }
    .btn-random:hover { background:rgba(79,70,229,.25); color:#c7d2fe; }

    /* LAYOUT */
    .layout { display:flex; flex:1; overflow:hidden;
      height:calc(100vh - var(--topbar-h) - var(--tabbar-h) - var(--bottom-h)); }

    /* TASK LIST */
    .task-list-panel { width:var(--list-w); flex-shrink:0; background:var(--bg2);
      border-right:1.5px solid var(--border); display:flex; flex-direction:column; overflow:hidden; }
    .task-list-header { padding:8px 10px 6px; font-size:0.7rem; font-weight:700; letter-spacing:.06em;
      text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); flex-shrink:0; }
    .task-list-scroll { flex:1; overflow-y:auto; padding:4px; }
    .task-list-scroll::-webkit-scrollbar { width:4px; }
    .task-list-scroll::-webkit-scrollbar-track { background:transparent; }
    .task-list-scroll::-webkit-scrollbar-thumb { background:#1f2937; border-radius:4px; }
    .task-item { display:flex; align-items:center; gap:6px; padding:7px 8px; border-radius:7px;
      cursor:pointer; transition:background .15s; font-size:0.82rem; color:var(--muted); line-height:1.3; }
    .task-item:hover { background:rgba(255,255,255,.05); color:var(--text); }
    .task-item.active { background:rgba(79,70,229,.15); color:#c7d2fe; }
    .task-item .task-num { font-size:0.68rem; font-weight:700; opacity:.5; flex-shrink:0; width:18px; }

    /* MIDDLE: task description */
    .desc-panel { width:340px; flex-shrink:0; background:var(--bg2); border-right:1.5px solid var(--border);
      display:flex; flex-direction:column; overflow:hidden; }
    .desc-header { padding:10px 14px 8px; border-bottom:1px solid var(--border); flex-shrink:0; }
    .desc-header h2 { font-size:0.95rem; font-weight:700; color:var(--text); }
    .desc-header .desc-meta { display:flex; gap:8px; margin-top:4px; }
    .desc-badge { font-size:0.68rem; font-weight:700; padding:2px 8px; border-radius:10px; }
    .desc-badge.konnyu  { background:rgba(34,197,94,.15); color:var(--konnyu); border:1px solid rgba(34,197,94,.3); }
    .desc-badge.kozepes { background:rgba(245,158,11,.15); color:var(--kozepes); border:1px solid rgba(245,158,11,.3); }
    .desc-badge.nehez   { background:rgba(239,68,68,.15); color:var(--nehez); border:1px solid rgba(239,68,68,.3); }
    .desc-badge.pont    { background:rgba(99,102,241,.15); color:#a5b4fc; border:1px solid rgba(99,102,241,.3); }
    .desc-scroll { flex:1; overflow-y:auto; padding:12px 14px; font-size:0.84rem; line-height:1.6;
      color:#cbd5e1; }
    .desc-scroll::-webkit-scrollbar { width:4px; }
    .desc-scroll::-webkit-scrollbar-thumb { background:#1f2937; border-radius:4px; }
    .desc-scroll pre { background:#0f172a; border:1px solid var(--border); border-radius:7px;
      padding:10px 12px; font-size:0.8rem; overflow-x:auto; margin:8px 0; color:#86efac;
      font-family:'Consolas','Courier New',monospace; white-space:pre; }
    .desc-scroll .minta-label { font-size:0.72rem; color:var(--muted); font-weight:600;
      text-transform:uppercase; letter-spacing:.05em; margin:12px 0 4px; }


    /* EDITOR AREA */
    .editor-area { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:300px; }
    .editor-container { flex:1; overflow:hidden; min-height:0; }
    #editor { width:100%; height:100%; }

    /* TERMINAL */
    .terminal-wrap { height:150px; flex-shrink:0; background:#0a0f1a; border-top:1.5px solid var(--border);
      display:flex; flex-direction:column; }
    .terminal-header { display:flex; align-items:center; padding:4px 10px;
      background:var(--bg3); border-bottom:1px solid var(--border); font-size:0.72rem;
      color:var(--muted); gap:6px; flex-shrink:0; }
    #terminal { flex:1; overflow-y:auto; padding:8px 12px; font-family:'Consolas','Courier New',monospace;
      font-size:0.82rem; color:#86efac; white-space:pre-wrap; word-break:break-word; }
    #terminal.empty { color:#4b5563; font-style:italic; font-family:var(--font); }
    #terminal.has-error { color:#fca5a5; }
    #terminal::-webkit-scrollbar { width:4px; }
    #terminal::-webkit-scrollbar-thumb { background:#1f2937; border-radius:4px; }

    /* BOTTOM BAR */
    .bottom-bar { height:var(--bottom-h); background:var(--bg2); border-top:1.5px solid var(--border);
      display:flex; align-items:center; padding:0 12px; gap:8px; flex-shrink:0; }
    .btn-run { display:flex; align-items:center; gap:6px; padding:8px 18px; border-radius:8px;
      background:#166534; border:1.5px solid var(--konnyu); color:var(--konnyu);
      font-size:0.88rem; font-weight:700; cursor:pointer; transition:all .2s; font-family:var(--font); }
    .btn-run:hover { background:#15803d; color:#fff; }
    .btn-run:disabled { opacity:.5; cursor:not-allowed; }
    .btn-stop { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px;
      background:#7f1d1d; border:1.5px solid #ef4444; color:#fca5a5;
      font-size:0.88rem; font-weight:700; cursor:pointer; transition:all .2s; font-family:var(--font); }
    .btn-stop:hover { background:#991b1b; color:#fff; }
    .btn-sol { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px;
      background:transparent; border:1.5px solid #374151; color:#9ca3af;
      font-size:0.84rem; cursor:pointer; transition:all .2s; font-family:var(--font); }
    .btn-sol:hover { border-color:#6b7280; color:var(--text); }
    .btn-bug { display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px;
      background:transparent; border:1.5px solid rgba(239,68,68,.4); color:#f87171;
      font-size:0.84rem; cursor:pointer; transition:all .2s; font-family:var(--font); }
    .btn-bug:hover { background:rgba(239,68,68,.1); border-color:#ef4444; color:#fca5a5; }
    .btn-check { display:flex; align-items:center; gap:6px; padding:8px 16px; border-radius:8px;
      background:#1e3a5f; border:1.5px solid #3b82f6; color:#93c5fd;
      font-size:0.88rem; font-weight:700; cursor:pointer; transition:all .2s; font-family:var(--font); }
    .btn-check:hover:not(:disabled) { background:#1d4ed8; color:#fff; border-color:#60a5fa; }
    .btn-check:disabled { opacity:.4; cursor:not-allowed; }
    .bottom-spacer { flex:1; }
    #run-spinner { display:none; }

    /* Check panel (a desc-panel alján) */
    #check-panel { margin-top:16px; border-top:1px solid var(--border); padding-top:14px; display:none; }
    .check-row { display:flex; align-items:flex-start; gap:8px; padding:5px 8px; border-radius:6px;
      margin-bottom:4px; font-size:0.82rem; background:#111827; border:1px solid var(--border); }
    .check-row.pass { border-color:rgba(34,197,94,.35); }
    .check-row.fail { border-color:rgba(239,68,68,.3); }
    .check-row .ci { font-size:0.8rem; flex-shrink:0; margin-top:1px; }
    .check-row.pass .ci { color:#22c55e; }
    .check-row.fail .ci { color:#ef4444; }
    .check-row .cl { color:var(--text); line-height:1.4; }
    .check-score { font-size:0.78rem; color:var(--muted); margin-top:8px; text-align:right; }
    #check-banner { display:none; margin-top:10px; background:rgba(34,197,94,.12);
      border:1.5px solid rgba(34,197,94,.4); border-radius:10px; padding:10px 14px;
      text-align:center; font-size:0.9rem; color:#22c55e; font-weight:700; }

    /* INPUT AREA */
    .input-wrap { display:flex; flex-direction:column; gap:2px; position:relative; }
    .input-label { font-size:0.7rem; color:var(--muted); }
    #input-values { width:220px; height:28px; background:#0f172a; border:1px solid var(--border);
      border-radius:6px; color:#e0e0e0; font-size:0.8rem; padding:2px 8px;
      font-family:'Consolas','Courier New',monospace; resize:none; transition:border-color .2s; }
    #input-values:focus { outline:none; border-color:#4f46e5; }
    #input-values.warn { border-color:#f59e0b; animation:inputPulse .4s ease 2; }
    @keyframes inputPulse { 0%,100%{border-color:#f59e0b} 50%{border-color:#fde68a;box-shadow:0 0 6px rgba(245,158,11,.5)} }
    #input-hint { position:absolute; bottom:calc(100% + 6px); right:0;
      background:#1e293b; border:1px solid #f59e0b; border-radius:8px;
      padding:6px 10px; font-size:0.75rem; color:#fcd34d; white-space:nowrap;
      display:none; z-index:50; pointer-events:none; }
    #input-hint::after { content:''; position:absolute; bottom:-6px; right:20px;
      border:6px solid transparent; border-top-color:#f59e0b; border-bottom:none; }

    /* MODALS */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:500;
      align-items:center; justify-content:center; padding:16px; }
    .modal-overlay.open { display:flex; }
    .modal-box { background:#16213e; border:1.5px solid #1f3460; border-radius:14px; padding:20px;
      max-width:580px; width:100%; max-height:85vh; overflow-y:auto; font-family:var(--font); }
    .modal-box h3 { font-size:1rem; font-weight:700; color:var(--text); margin-bottom:12px; }
    .modal-box pre { background:#0a0f1a; border:1px solid var(--border); border-radius:8px;
      padding:14px; font-size:0.82rem; color:#86efac; overflow-x:auto; white-space:pre;
      font-family:'Consolas','Courier New',monospace; }
    .modal-close { display:flex; justify-content:flex-end; margin-top:14px; }
    .modal-close button { padding:6px 18px; background:transparent; border:1px solid #374151;
      border-radius:8px; color:#9ca3af; cursor:pointer; font-family:var(--font); font-size:0.85rem; }
    .modal-close button:hover { border-color:#6b7280; color:var(--text); }

    /* EMPTY STATE */
    #empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center;
      flex:1; gap:10px; color:var(--muted); font-size:0.9rem; }
    #empty-state i { font-size:2.5rem; opacity:.3; }

    /* NO TASKS */
    .no-tasks { padding:16px 10px; font-size:0.8rem; color:var(--muted); text-align:center;
      font-style:italic; line-height:1.5; }
  </style>
</head>
<body>

<!-- Auth check -->
<script>
(function(){
  const u = JSON.parse(sessionStorage.getItem('kandoUser') || '{}');
  if (!u.token && u.szerep !== 'oktato' && u.szerep !== 'vendeg' && !u._tesztMod)
    location.replace('../portal.html');
})();
</script>

<!-- Teszt mód banner -->
<div id="teszt-mod-banner" style="display:none;">
  <i class="fas fa-user-graduate"></i>
  <span>Diák teszt mód – <strong>Teszt Elek</strong> nézetében vagy</span>
  <a href="../portal.html" style="padding:3px 12px;background:transparent;border:1px solid #4a5568;
    border-radius:6px;color:#94a3b8;font-size:0.76rem;font-weight:600;text-decoration:none;">&#8592; Vissza</a>
</div>

<!-- Topbar -->
<header class="topbar">
  <span id="kando-logo-wrap" style="position:relative;display:inline-block;">
    <a href="../portal.html" title="Főmenü"><img src="kandologo2.png" alt="Kandó" class="topbar-logo" style="cursor:pointer;display:block;"></a>
    <span id="kando-bug-badge" style="display:none;position:absolute;inset:0;background:rgba(0,0,0,0.45);border-radius:4px;font-size:1.2rem;align-items:center;justify-content:center;pointer-events:none;">🐛</span>
  </span>
  <span class="topbar-title"><i class="fas fa-graduation-cap" style="color:#a5b4fc;margin-right:5px;"></i>Gyakorló feladatok</span>
  <div class="topbar-spacer"></div>
  <div id="streak-counter" style="display:none;align-items:center;gap:5px;padding:4px 12px;background:#1e293b;border:1px solid #374151;border-radius:20px;font-size:0.82rem;font-weight:700;color:#fb923c;" title="Egymást követő napok, amikor beléptél a gyakorlóba"></div>
  <div id="pyodide-status">Pyodide betölt...</div>
  <a class="btn-back" href="../python-hub.html"><i class="fas fa-arrow-left"></i> Vissza</a>
</header>

<!-- Difficulty tab bar -->
<div class="tabbar">
  <button class="diff-tab konnyu active" id="tab-konnyu" onclick="setTab('konnyu')">
    <i class="fas fa-seedling"></i> Könnyű <span class="badge" id="cnt-konnyu">0</span>
  </button>
  <button class="diff-tab kozepes" id="tab-kozepes" onclick="setTab('kozepes')">
    <i class="fas fa-dumbbell"></i> Közepes <span class="badge" id="cnt-kozepes">0</span>
  </button>
  <button class="diff-tab nehez" id="tab-nehez" onclick="setTab('nehez')">
    <i class="fas fa-fire"></i> Nehéz <span class="badge" id="cnt-nehez">0</span>
  </button>
  <button class="diff-tab" id="tab-feladatkeszito" onclick="setTab('feladatkeszito')"
    style="border-color:rgba(168,85,247,.35);color:#c084fc;">
    <i class="fas fa-pencil"></i> Feladatkészítők <span class="badge" id="cnt-feladatkeszito" style="background:rgba(168,85,247,.2)">0</span>
  </button>
  <div class="tabbar-spacer"></div>
  <button class="btn-random" onclick="pickRandom()">
    <i class="fas fa-shuffle"></i> Véletlenszerű
  </button>
</div>

<!-- Main layout -->
<div class="layout">
  <!-- Task list -->
  <div class="task-list-panel">
    <div class="task-list-header">Feladatok</div>
    <div class="task-list-scroll" id="task-list"></div>
  </div>

  <!-- Description + checklist -->
  <div class="desc-panel">
    <div id="desc-header" class="desc-header" style="display:none;">
      <h2 id="desc-title"></h2>
      <div class="desc-meta">
        <span class="desc-badge pont" id="desc-pont"></span>
        <span class="desc-badge" id="desc-diff"></span>
      </div>
    </div>
    <div class="desc-scroll" id="desc-content">
      <div id="empty-state"><i class="fas fa-mouse-pointer"></i><span>Válassz feladatot a listából</span></div>
      <div id="check-panel"></div>
      <div id="check-banner"></div>
    </div>
  </div>

  <!-- Editor area -->
  <div class="editor-area">
    <div class="editor-container">
      <div id="editor"></div>
    </div>
    <div class="terminal-wrap">
      <div class="terminal-header">
        <i class="fas fa-terminal" style="font-size:.7rem;"></i>
        <span>Kimenet</span>
      </div>
      <div id="terminal" class="empty">A kód futtatásának eredménye itt jelenik meg.</div>
    </div>
  </div>
</div>

<!-- Bottom bar -->
<div class="bottom-bar">
  <button class="btn-run" id="btn-run" onclick="runCode()">
    <i class="fas fa-play"></i> Futtatás
    <span id="run-spinner"><i class="fas fa-spinner fa-spin"></i></span>
  </button>
  <button class="btn-stop" id="btn-stop" style="display:none;" onclick="stopCode()">
    <i class="fas fa-stop"></i> Leállítás
  </button>
  <button class="btn-check" id="btn-check" onclick="checkCode()" disabled>
    <i class="fas fa-check-circle"></i> Ellenőrzés
  </button>
  <button class="btn-sol" onclick="showSolution()">
    <i class="fas fa-lightbulb"></i> Megoldás
  </button>
  <button class="btn-bug" id="btn-bug" style="display:none;" onclick="reportTaskBug()">
    <i class="fas fa-bug"></i> Hiba a feladatban
  </button>
  <div class="bottom-spacer"></div>
  <div class="input-wrap" title="Ha a kód input()-ot tartalmaz, ide add meg az értékeket. Minden sor egy input() hívás értéke.">
    <div id="input-hint"><i class="fas fa-exclamation-triangle" style="margin-right:4px;"></i>A kódban input() van – add meg az értékeket!</div>
    <div class="input-label"><i class="fas fa-keyboard" style="margin-right:3px;opacity:.7;"></i>input() értékek <span style="opacity:.5;font-size:.65rem;">(soronként)</span></div>
    <textarea id="input-values" placeholder="Ha input() van a kódban,&#10;ide írd az értékeket"></textarea>
  </div>
</div>

<!-- Solution modal -->
<div class="modal-overlay" id="solution-modal">
  <div class="modal-box" style="border-color:#4f46e5;">
    <h3><i class="fas fa-lightbulb" style="color:#a5b4fc;"></i> Minta megoldás</h3>
    <pre id="solution-code"></pre>
    <div id="solution-tips" style="margin-top:10px;font-size:0.83rem;color:#94a3b8;line-height:1.6;display:none;"></div>
    <div class="modal-close"><button onclick="document.getElementById('solution-modal').classList.remove('open')">Bezárás</button></div>
  </div>
</div>

<script>
// ── Streak counter ─────────────────────────────────────────────────────────
(function() {
  const u = JSON.parse(sessionStorage.getItem('kandoUser') || '{}');
  if (!u.email) return;
  const email = u.email.replace('@kkszki.hu', '');
  const rankHeaders = u.token ? { 'Authorization': 'Bearer ' + u.token } : {};
  fetch('https://agazati.up.railway.app/api/leaderboard/rank/' + encodeURIComponent(email), { headers: rankHeaders })
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      const streak = data?.streak ?? 0;
      const el = document.getElementById('streak-counter');
      if (!el || streak < 1) return;
      const label = streak >= 30 ? 'Élő Legenda' : streak >= 14 ? 'Kitartó Harcos' : streak >= 7 ? 'Heti Hős' : streak >= 3 ? 'Ügyes Kezdő' : null;
      el.innerHTML = '🔥 ' + streak + ' nap' + (label ? ' · ' + label : '');
      el.style.display = 'flex';
    })
    .catch(() => {});
})();
// ──────────────────────────────────────────────────────────────────────────

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let allTasks = [];
let filteredTasks = [];
let currentTask = null;
let currentTab = 'konnyu';
let editor = null;
let lastOutput = '';

// Pyodide Web Worker
let pyWorker = null;
let pyWorkerReady = false;
let _runResolve = null;
let _runTimeout = null;
const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v0.27.3/full/';
const WORKER_SRC = `importScripts('${PYODIDE_URL}pyodide.js');
let py=null;
(async()=>{
  try{py=await loadPyodide({indexURL:'${PYODIDE_URL}'});self.postMessage({type:'ready'});}
  catch(e){self.postMessage({type:'loadError',msg:e.message});}
})();
self.onmessage=async function(e){
  if(e.data.type!=='run'||!py)return;
  let out='',hasErr=false;
  py.setStdout({batched:t=>{out+=t+'\\n';}});
  py.setStderr({batched:t=>{out+=t+'\\n';hasErr=true;}});
  try{await py.runPythonAsync(e.data.code);}
  catch(ex){out+=ex.message+'\\n';hasErr=true;}
  self.postMessage({type:'result',output:out.trim(),hasError:hasErr});
};`;

// ═══════════════════════════════════════════════════════════════════
async function loadTasks() {
  try {
    const res = await fetch('feladatok.txt?v=' + Date.now());
    const text = await res.text();
    allTasks = parseTasks(text);
    renderCounts();
    setTab('konnyu');
  } catch(e) {
    console.error('feladatok.txt betöltési hiba:', e);
  }
}

function parseTasks(text) {
  const tasks = [];
  const blocks = text.replace(/\r\n/g, '\n').split(/(?=^\d+\. feladat$)/m).filter(b => b.trim());

  for (const block of blocks) {
    const lines = block.split('\n');
    const numMatch = lines[0].trim().match(/^(\d+)\. feladat$/);
    if (!numMatch) continue;

    const id = parseInt(numMatch[1]);
    let pont = 8, cim = '', tipus = '', nehezseg = 'kozepes';
    let uj = false, feladatkeszito = false;
    let i = 1;

    while (i < lines.length) {
      const l = lines[i].trim();
      if      (l.startsWith('Pont: '))         { pont          = parseInt(l.slice(6));               i++; }
      else if (l.startsWith('Cim: '))          { cim           = l.slice(5).trim();                  i++; }
      else if (l.startsWith('Tipus: '))        { tipus          = l.slice(7).trim();                  i++; }
      else if (l.startsWith('Nehezseg: '))     { nehezseg      = l.slice(10).trim();                 i++; }
      else if (l.startsWith('Uj: '))           { uj            = l.slice(4).trim() === 'igen';       i++; }
      else if (l.startsWith('Feladatkeszito: ')){ feladatkeszito= l.slice(17).trim() === 'igen';     i++; }
      else if (l.startsWith('ModulNev: '))     { /* skip */                                           i++; }
      else if (l === 'ModulTartalom:')         { break; } // modul szekció, for loop kezeli
      else if (l === '')                       { i++; break; }
      else i++; // ismeretlen mező átugrása
    }

    let szovegLines = [], criteriaLines = [], tippekLines = [], megoldasLines = [];
    let section = 'szoveg';

    for (; i < lines.length; i++) {
      const l  = lines[i];
      const lt = l.trim();
      if (lt === 'Pontozas:')     { section = 'pontozas'; continue; }
      if (lt === 'Tippek:')       { section = 'tippek';   continue; }
      if (lt === 'Megoldas:')     { section = 'megoldas'; continue; }
      if (lt === 'ModulTartalom:'){ section = 'modul';    continue; }
      if (lt === 'ModulVege')     { section = 'szoveg';   continue; }

      if      (section === 'szoveg')            szovegLines.push(l);
      else if (section === 'pontozas' && lt)    criteriaLines.push(lt);
      else if (section === 'tippek'   && lt)    tippekLines.push(lt);
      else if (section === 'megoldas')          megoldasLines.push(l);
      // 'modul' szekció kihagyva
    }

    tasks.push({
      id, pont, cim, tipus, nehezseg, uj, feladatkeszito,
      szoveg:   szovegLines.join('\n').trim(),
      criteria: criteriaLines,
      tippek:   tippekLines.join('\n').trim(),
      megoldas: megoldasLines.join('\n').trimEnd(),
    });
  }
  return tasks;
}

function renderCounts() {
  ['konnyu','kozepes','nehez'].forEach(d => {
    document.getElementById('cnt-' + d).textContent =
      allTasks.filter(t => t.nehezseg === d && !t.feladatkeszito).length;
  });
  document.getElementById('cnt-feladatkeszito').textContent =
    allTasks.filter(t => t.feladatkeszito).length;
}

function setTab(tab) {
  currentTab = tab;
  ['konnyu','kozepes','nehez','feladatkeszito'].forEach(d => {
    const el = document.getElementById('tab-' + d);
    if (el) el.classList.toggle('active', d === tab);
  });
  if (tab === 'feladatkeszito') {
    filteredTasks = allTasks.filter(t => t.feladatkeszito);
    document.getElementById('tab-feladatkeszito').style.borderColor = 'rgba(168,85,247,.8)';
    document.getElementById('tab-feladatkeszito').style.color = '#e9d5ff';
    document.getElementById('tab-feladatkeszito').style.background = 'rgba(168,85,247,.12)';
  } else {
    const fkTab = document.getElementById('tab-feladatkeszito');
    if (fkTab && tab !== 'feladatkeszito') {
      fkTab.style.borderColor = 'rgba(168,85,247,.35)';
      fkTab.style.color = '#c084fc';
      fkTab.style.background = '';
    }
    filteredTasks = allTasks.filter(t => t.nehezseg === tab && !t.feladatkeszito);
  }
  renderTaskList();
  if (filteredTasks.length > 0) selectTask(filteredTasks[0]);
}

function renderTaskList() {
  const el = document.getElementById('task-list');
  if (filteredTasks.length === 0) {
    el.innerHTML = '<div class="no-tasks">Nincs feladat ebben a kategóriában.</div>';
    return;
  }
  el.innerHTML = filteredTasks.map(t => `
    <div class="task-item${currentTask && currentTask.id === t.id ? ' active' : ''}"
         onclick="selectTask(allTasks.find(x=>x.id===${t.id}))">
      <span class="task-num">${t.id}.</span>
      <span>${esc(t.cim)}${t.uj ? ' <span style="font-size:.58rem;font-weight:800;color:#22c55e;background:rgba(34,197,94,.15);border:1px solid rgba(34,197,94,.3);border-radius:3px;padding:0 4px;vertical-align:middle">ÚJ</span>' : ''}</span>
    </div>`).join('');
}

  document.getElementById('check-panel').style.display = 'none';
  document.getElementById('check-panel').innerHTML = '';
  document.getElementById('check-banner').style.display = 'none';
  document.getElementById('btn-check').disabled = false;

  // Update task list highlight
  renderTaskList();

  // Populate description panel
  document.getElementById('desc-header').style.display = 'block';
  document.getElementById('desc-title').textContent = task.id + '. ' + task.cim;
  document.getElementById('desc-pont').textContent = task.pont + ' pont';

  // Feladatkészítő szavazógomb

  const voteHtml = task.feladatkeszito ? `<div id="fk-vote-box" style="margin-bottom:10px;padding:8px 12px;background:rgba(168,85,247,.08);border:1px solid rgba(168,85,247,.3);border-radius:8px;display:flex;align-items:center;gap:10px;font-size:0.82rem;color:#c084fc;">
    <i class="fas fa-pencil" style="color:#a855f7"></i>
    <span style="flex:1">Ez egy <strong>Feladatkészítő</strong> feladat — szavazd meg, hogy bekerüljön a dolgozati feladatok közé!</span>
    <button id="fk-vote-btn" onclick="voteFeladatkeszito(${task.id})"
      style="padding:4px 14px;border-radius:6px;border:1px solid ${voted[task.id] ? '#22c55e' : 'rgba(168,85,247,.6)'};
      background:${voted[task.id] ? 'rgba(34,197,94,.15)' : 'rgba(168,85,247,.15)'};
      color:${voted[task.id] ? '#22c55e' : '#c084fc'};font-size:0.8rem;font-weight:700;cursor:${voted[task.id] ? 'default' : 'pointer'};">

function pickRandom() {
  if (filteredTasks.length === 0) return;
  const t = filteredTasks[Math.floor(Math.random() * filteredTasks.length)];

function voteFeladatkeszito(taskId) {
  const voteKey = '_practiceVotes';
  const voted = JSON.parse(localStorage.getItem(voteKey) || '{}');
  if (voted[taskId]) return;
  voted[taskId] = true;
  localStorage.setItem(voteKey, JSON.stringify(voted));

  const u = JSON.parse(sessionStorage.getItem('kandoUser') || '{}');
  const task = allTasks.find(t => t.id === taskId);
  fetch('https://agazati.up.railway.app/api/feedback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', ...(u.token ? { Authorization: 'Bearer ' + u.token } : {}) },
    body: JSON.stringify({ email: u.email || 'vendeg', task_id: taskId, task_cim: task?.cim || '', tipus: 'practice_vote' })
  }).catch(() => {});

  // Gomb frissítése
  const btn = document.getElementById('fk-vote-btn');
  if (btn) {
    btn.innerHTML = '<i class="fas fa-check"></i> Szavaztam';
    btn.style.borderColor = '#22c55e';
    btn.style.background = 'rgba(34,197,94,.15)';
    btn.style.color = '#22c55e';
    btn.style.cursor = 'default';

function formatDesc(text) {
  // Split on ```...``` blocks and "Minta kód:" label
  let html = '';
  const parts = text.split(/(```[\s\S]*?```)/);
  for (const part of parts) {
    if (part.startsWith('```')) {
      const code = part.slice(3, part.endsWith('```') ? -3 : undefined).trim();
      html += '<div class="minta-label">Minta I/O:</div><pre>' + esc(code) + '</pre>';
    } else {
      const cleaned = part.replace(/^Minta kód:\s*/m, '').trim();
      if (cleaned) html += '<p style="white-space:pre-wrap;">' + esc(cleaned) + '</p>';
    }
  }
  return html;
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// PYODIDE WEB WORKER
// ═══════════════════════════════════════════════════════════════════
function setPyStatus(msg, cls='') {
  const el = document.getElementById('pyodide-status');
  el.textContent = msg; el.className = cls;
}

function initPyWorker() {
  const blob = new Blob([WORKER_SRC], { type: 'text/javascript' });
  const url = URL.createObjectURL(blob);
  pyWorker = new Worker(url);
  URL.revokeObjectURL(url);
  pyWorkerReady = false;
  setPyStatus('Betöltés... (~10 mp)', '');
  pyWorker.onmessage = function(e) {
    if (e.data.type === 'ready') {
      pyWorkerReady = true;
      setPyStatus('Kész ✓', 'ready');
    } else if (e.data.type === 'loadError') {
      setPyStatus('Hiba', 'error');
    } else if (e.data.type === 'result') {
      clearTimeout(_runTimeout); _runTimeout = null;
      if (_runResolve) { _runResolve(e.data); _runResolve = null; }
    }
  };
  pyWorker.onerror = function() {
    clearTimeout(_runTimeout); _runTimeout = null;
    if (_runResolve) { _runResolve({ output: 'Worker hiba – próbáld újra!', hasError: true }); _runResolve = null; }
    pyWorker = null; pyWorkerReady = false;
    setPyStatus('Hiba', 'error');
  };
}

function stopCode() {
  if (pyWorker) { pyWorker.terminate(); pyWorker = null; }
  pyWorkerReady = false;
  clearTimeout(_runTimeout); _runTimeout = null;
  if (_runResolve) { _runResolve({ output: '⏹ Futtatás leállítva.', hasError: false }); _runResolve = null; }
  initPyWorker();
  document.getElementById('btn-run').disabled = false;
  document.getElementById('run-spinner').style.display = 'none';
  document.getElementById('btn-stop').style.display = 'none';
}

function runPyCode(fullCode, timeoutMs = 10000) {
  return new Promise((resolve) => {
    _runResolve = resolve;
    _runTimeout = setTimeout(() => {
      _runResolve = null;
      resolve({ output: '⏱️ Időtúllépés – a kód ' + (timeoutMs/1000) + ' mp-nél tovább futott.\nVégtelen ciklus? Ellenőrizd a megállási feltételt!', hasError: true });
      if (pyWorker) { pyWorker.terminate(); pyWorker = null; }
      pyWorkerReady = false;
      initPyWorker();
    }, timeoutMs);
    pyWorker.postMessage({ type: 'run', code: fullCode });
  });
}

window.addEventListener('load', () => { initPyWorker(); });

// ═══════════════════════════════════════════════════════════════════
// KÓDFUTTATÁS
// ═══════════════════════════════════════════════════════════════════
async function runCode() {
  if (!editor) return;
  if (!pyWorkerReady) {
    const term = document.getElementById('terminal');
    term.textContent = 'A Python motor még töltődik, kérlek várj...';
    term.className = 'empty';
    return;
  }
  const btn = document.getElementById('btn-run');
  const btnStop = document.getElementById('btn-stop');
  const spinner = document.getElementById('run-spinner');
  btn.disabled = true; btnStop.style.display = 'flex'; spinner.style.display = 'inline';
  const term = document.getElementById('terminal');
  term.className = 'empty'; term.textContent = 'Futtatás...';

  const code = editor.getValue();
  const rawInputs = document.getElementById('input-values').value;
  const inputs = rawInputs.trim() ? rawInputs.split('\n').map(s => s.trimEnd()) : [];

  if (inputs.length === 0 && /\binput\s*\(/.test(code)) {
    flashInputHint();
  }

  const setup = `import builtins,sys\n_mi=iter(${JSON.stringify(inputs)})\ndef _inp(p=''):\n val=str(next(_mi,''))\n sys.stdout.write(str(p));sys.stdout.write(val+'\\n');return val\nbuiltins.input=_inp\n`;
  const res = await runPyCode(setup + '\n' + code);

  let outText = res.output;
  if (res.hasError && inputs.length === 0 && /\binput\s*\(/.test(code) &&
      (outText.includes('invalid literal') || outText.includes('ValueError'))) {
    outText = '⚠️ A kód input()-ot vár, de nem adtál meg értéket!\nÍrd be az input() értékeket a jobb alsó mezőbe (soronként), majd futtasd újra.\n\n' + outText;
  }

  lastOutput = outText || (res.hasError ? '' : '(Nincs kimenet)');
  term.textContent = lastOutput;
  term.className = res.hasError ? 'has-error' : '';
  btn.disabled = false; btnStop.style.display = 'none'; spinner.style.display = 'none';
}

function flashInputHint() {
  const wrap = document.getElementById('input-values');
  const hint = document.getElementById('input-hint');
  wrap.classList.add('warn');
  hint.style.display = 'block';
  setTimeout(() => { wrap.classList.remove('warn'); hint.style.display = 'none'; }, 3000);
}

// ═══════════════════════════════════════════════════════════════════
// ELLENŐRZÉS + PROGRESS MENTÉS
// ═══════════════════════════════════════════════════════════════════
async function checkCode() {
  if (!currentTask || !currentTask.criteria || !currentTask.criteria.length) return;
  const btn = document.getElementById('btn-check');
  btn.disabled = true;

  await runCode(); // kód futtatása kimenet megszerzéséhez
  const code = editor.getValue();

  const results = [];
  for (const crit of currentTask.criteria) {
    const parts = crit.split('|');
    const spec  = parts[0].trim();
    const label = (parts[1] || spec).trim();
    let pass = false;

    if (spec.startsWith('bekeres:'))    { pass = code.includes(spec.slice(8)); }
    else if (spec.startsWith('int_float:')) {
      const n = parseInt(spec.slice(10)) || 1;
      pass = (code.match(/\bint\s*\(|\bfloat\s*\(/g) || []).length >= n;
    }
    else if (spec.startsWith('import:')) {
      const mod = spec.slice(7);
      pass = new RegExp(`\\bimport\\s+${mod}\\b|\\bfrom\\s+${mod}\\b`).test(code);
    }
    else if (spec === 'if')             { pass = /\bif\b/.test(code); }
    else if (spec === 'elif')           { pass = /\belif\b/.test(code); }
    else if (spec.startsWith('tartalmaz:')) { pass = code.includes(spec.slice(10)); }
    else if (spec === 'def')            { pass = /\bdef\b/.test(code); }
    else if (spec === 'return')         { pass = /\breturn\b/.test(code); }
    else if (spec === 'while')          { pass = /\bwhile\b/.test(code); }
    else if (spec === 'for')            { pass = /\bfor\b/.test(code); }
    else if (spec.startsWith('teszt:')) {
      const rest = spec.slice(6);
      const sep  = rest.lastIndexOf(':');
      if (sep > 0) {
        const inputs   = rest.slice(0, sep) ? rest.slice(0, sep).split(',') : [];
        const expected = rest.slice(sep + 1).trim();
        pass = await runWithMockInputs(code, inputs, expected);
      }
    }

    results.push({ label, pass });
  }

  btn.disabled = false;
  const passed = results.filter(r => r.pass).length;
  renderCheckResults(results, passed === results.length);
  if (passed === results.length) saveAgazatiProgress(currentTask);
}

async function runWithMockInputs(code, inputs, expected) {
  if (!pyWorker || !pyWorkerReady) return false;
  try {
    const setup = `import builtins,sys\n_mi=iter(${JSON.stringify(inputs)})\ndef _inp(p=''):\n val=str(next(_mi,''))\n sys.stdout.write(str(p));sys.stdout.write(val+'\\n');return val\nbuiltins.input=_inp\n`;
    const result = await runPyCode(setup + '\n' + code, 5000);
    return !result.hasError && result.output.includes(expected);
  } catch { return false; }
}

function renderCheckResults(results, allPass) {
  const panel  = document.getElementById('check-panel');
  const banner = document.getElementById('check-banner');
  panel.style.display = 'block';
  panel.innerHTML = results.map(r => `
    <div class="check-row ${r.pass ? 'pass' : 'fail'}">
      <i class="fas fa-${r.pass ? 'check' : 'times'} ci"></i>
      <span class="cl">${esc(r.label)}</span>
    </div>`).join('')
    + `<div class="check-score">${results.filter(r=>r.pass).length} / ${results.length} teljesítve</div>`;

  if (allPass) {
    banner.style.display = 'block';
    banner.innerHTML = `<i class="fas fa-trophy" style="margin-right:6px;"></i>Tökéletes! ${currentTask.pont}/${currentTask.pont} pont – megoldottad!`;
  } else {
    banner.style.display = 'none';
  }
}

function saveAgazatiProgress(task) {
  const u = JSON.parse(sessionStorage.getItem('kandoUser') || '{}');
  if (!u.token || !u.email) return; // vendég nem ment

  const lsKey = `agazati_done_${task.id}_${u.email}`;
  if (localStorage.getItem(lsKey)) return; // már mentve

  const osztaly = u.osztaly ? `${u.evfolyam || ''}.${u.osztaly}` : '';
  fetch('https://agazati.up.railway.app/api/progress', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + u.token },
    body: JSON.stringify({
      email: u.email, nev: u.nev || '', osztaly,
      targy: 'python', feladat: task.cim,
      pont: task.pont, maxPont: task.pont, mode: 'practice'
    })
  }).then(r => { if (r.ok) localStorage.setItem(lsKey, '1'); }).catch(() => {});
}

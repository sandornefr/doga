<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Számonkérés – Kandó</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0b1120;color:#e0e0e0;font-family:'Segoe UI',sans-serif;min-height:100vh}
    .topbar{background:#16213e;border-bottom:1px solid #1f2937;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50}
    .topbar-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;color:#e0e0e0;text-decoration:none}
    .topbar-logo img{height:32px}
    .topbar-right{display:flex;align-items:center;gap:10px}
    .btn{padding:7px 16px;border-radius:8px;border:none;cursor:pointer;font-size:0.88rem;font-weight:600;transition:all .2s}
    .btn-primary{background:#1d4ed8;color:#fff}.btn-primary:hover{background:#2563eb}
    .btn-success{background:#15803d;color:#fff}.btn-success:hover{background:#16a34a}
    .btn-ghost{background:transparent;border:1px solid #374151;color:#9ca3af;text-decoration:none}.btn-ghost:hover{border-color:#6b7280;color:#e0e0e0}
    .btn-sm{padding:4px 10px;font-size:0.8rem}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .container{max-width:860px;margin:0 auto;padding:24px 16px}
    .msg{padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:0.88rem}
    .msg-err{background:#7f1d1d;border:1px solid #dc2626;color:#fca5a5}
    .msg-warn{background:#78350f;border:1px solid #d97706;color:#fcd34d}
    .msg-ok{background:#14532d;border:1px solid #16a34a;color:#86efac}
    .empty-state{text-align:center;color:#64748b;padding:60px 20px;font-size:0.95rem}
    .empty-state i{font-size:2.5rem;margin-bottom:14px;display:block}
    .loader{text-align:center;padding:50px;color:#64748b}
    .loader i{font-size:2rem;margin-bottom:12px;display:block}

    /* Kiadott eredmény kártyák */
    .jegy-1{background:#7f1d1d;color:#fca5a5}
    .jegy-2{background:#7f1d1d;color:#fca5a5}
    .jegy-3{background:#78350f;color:#fcd34d}
    .jegy-4{background:#1a3a1a;color:#86efac}
    .jegy-5{background:#1e3a5f;color:#93c5fd}

    /* ── Teljes képernyős overlay ── */
    #diak-overlay{position:fixed;inset:0;z-index:1000;background:#0b1120;display:none;flex-direction:column;overflow:hidden}

    .diak-nav-btn{padding:4px 12px;border-radius:6px;border:1px solid #374151;background:transparent;color:#64748b;cursor:pointer;font-size:0.82rem;font-weight:600;transition:.15s;white-space:nowrap}
    .diak-nav-btn:hover{border-color:#3b82f6;color:#93c5fd}
    .diak-nav-btn.active{border-color:#3b82f6;background:#1e3a5f;color:#93c5fd}
    .diak-nav-btn.done{border-color:#15803d;color:#4ade80;background:#0a2a1a}

    #diak-overlay-topbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #1f2937;background:#16213e;flex-shrink:0;min-height:52px}
    #diak-szam-cim{font-weight:700;font-size:0.9rem;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px;flex-shrink:0}
    #diak-nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
    #diak-pyodide-status{font-size:0.73rem;color:#64748b;white-space:nowrap;flex-shrink:0}

    #diak-task-desc{padding:10px 16px 8px;border-bottom:1px solid #1f2937;flex-shrink:0;background:#0d1626}
    #diak-task-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
    #diak-task-num{font-size:0.72rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em}
    #diak-task-cim{font-size:0.97rem;font-weight:700;color:#e0e0e0}
    #diak-task-pont{font-size:0.78rem;color:#94a3b8;margin-left:auto;white-space:nowrap}
    #diak-task-leiras{font-size:0.88rem;color:#cbd5e1;line-height:1.65;white-space:pre-wrap;overflow-y:auto;max-height:35vh}
    #diak-beadott-sav{margin-top:8px;padding:6px 12px;background:#0a2a1a;border:1px solid #15803d;border-radius:8px;font-size:0.83rem;color:#4ade80;display:none;align-items:center;gap:8px}

    #diak-two-col{display:flex;flex:1;min-height:0;overflow:hidden}
    #diak-editor-col{flex:1;display:flex;flex-direction:column;border-right:1px solid #1f2937;min-width:0}
    .diak-col-header{padding:6px 12px;border-bottom:1px solid #1f2937;font-size:0.78rem;color:#64748b;display:flex;align-items:center;gap:8px;flex-shrink:0;background:#111827}
    #diak-readonly-badge{font-size:0.7rem;padding:1px 7px;background:#1e3a5f;color:#93c5fd;border-radius:10px}
    #diak-monaco-editor{flex:1;min-height:0}

    #diak-pyodide-col{width:360px;flex-shrink:0;display:flex;flex-direction:column;background:#060d1a}
    #diak-inputs-wrap{padding:6px 10px;border-bottom:1px solid #1f2937;background:#0b1120;flex-shrink:0}
    #diak-inputs{width:100%;padding:5px 8px;background:#060d1a;border:1px solid #374151;border-radius:6px;color:#e0e0e0;font-family:monospace;font-size:0.82rem;resize:none;outline:none}
    #diak-output{flex:1;overflow-y:auto;padding:12px;font-family:monospace;font-size:0.85rem;color:#4ade80;background:#060d1a;margin:0;white-space:pre-wrap;min-height:0;line-height:1.5}

    #diak-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid #1f2937;background:#16213e;flex-shrink:0;gap:10px}
    #diak-bekules-btn{padding:7px 22px;background:#1d4ed8;border:none;border-radius:8px;color:#fff;font-size:0.88rem;font-weight:700;cursor:pointer;transition:background .2s}
    #diak-bekules-btn:hover:not(:disabled){background:#2563eb}
    #diak-bekules-btn.beadva{background:#15803d;cursor:default}
    #diak-prev-btn,#diak-next-btn{padding:6px 18px;background:transparent;border:1px solid #374151;border-radius:8px;color:#94a3b8;cursor:pointer;font-size:0.85rem;transition:.2s}
    #diak-prev-btn:hover,#diak-next-btn:hover{border-color:#6b7280;color:#e0e0e0}
    #diak-next-btn.green{background:#15803d;border-color:#15803d;color:#fff;font-weight:700}

    @media(max-width:700px){
      #diak-pyodide-col{display:none}
      #diak-szam-cim{max-width:140px}
    }
  </style>
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="../portal.html">
    <img src="../kandologo2.png" alt="Kandó">
    Számonkérés
  </a>
  <div class="topbar-right">
    <span id="diak-nev" style="font-size:0.85rem;color:#94a3b8"></span>
    <a href="../portal.html" class="btn btn-ghost btn-sm"><i class="fas fa-arrow-left"></i> Portál</a>
  </div>
</div>

<!-- ── Teljes képernyős vizsga overlay ── -->
<div id="diak-overlay">

  <!-- Fejléc: számonkérés neve, feladat navigáció, Pyodide státusz -->
  <div id="diak-overlay-topbar">
    <div id="diak-szam-cim"></div>
    <div id="diak-nav"></div>
    <span id="diak-pyodide-status"></span>
    <button id="diak-vissza-btn" onclick="closeDiakOverlay()" style="display:none;margin-left:6px;padding:4px 12px;background:transparent;border:1px solid #374151;border-radius:6px;color:#64748b;cursor:pointer;font-size:0.8rem;flex-shrink:0;white-space:nowrap">
      <i class="fas fa-list"></i> Lista
    </button>
    <button onclick="closeDiakOverlay()" style="margin-left:4px;padding:4px 12px;background:transparent;border:1px solid #374151;border-radius:6px;color:#64748b;cursor:pointer;font-size:0.8rem;flex-shrink:0;white-space:nowrap">
      <i class="fas fa-xmark"></i> Bezár
    </button>
  </div>

  <!-- Feladat leírás -->
  <div id="diak-task-desc">
    <div id="diak-task-header">
      <span id="diak-task-num"></span>
      <span id="diak-task-cim"></span>
      <span id="diak-task-pont"></span>
    </div>
    <div id="diak-task-leiras"></div>
    <div id="diak-beadott-sav"></div>
  </div>

  <!-- Kéthasábos terület: Monaco + Pyodide -->
  <div id="diak-two-col">

    <!-- Monaco szerkesztő -->
    <div id="diak-editor-col">
      <div class="diak-col-header">
        <i class="fas fa-code"></i> Kódszerkesztő
        <span id="diak-readonly-badge" style="display:none">csak olvasható</span>
      </div>
      <div id="diak-monaco-editor"></div>
    </div>

    <!-- Pyodide futtatópanel -->
    <div id="diak-pyodide-col">
      <div class="diak-col-header" style="justify-content:space-between">
        <span><i class="fas fa-terminal"></i> Futtatás</span>
        <button id="diak-run-btn" onclick="diakRunCode()" style="padding:3px 14px;background:#15803d;border:none;border-radius:6px;color:#fff;font-size:0.8rem;font-weight:600;cursor:pointer">
          <i class="fas fa-play"></i> Futtatás
        </button>
      </div>
      <div id="diak-inputs-wrap" style="display:none">
        <div style="font-size:0.75rem;color:#64748b;margin-bottom:4px">input() értékek (soronként):</div>
        <textarea id="diak-inputs" rows="2" placeholder="pl: 5&#10;Éva"></textarea>
      </div>
      <pre id="diak-output">(Nyomj Futtatás gombot a kód teszteléséhez)</pre>
    </div>

  </div>

  <!-- Lábléc: navigáció + beküldés -->
  <div id="diak-footer">
    <button id="diak-prev-btn" onclick="diakGoTo(diakState.currentIdx - 1)">
      <i class="fas fa-arrow-left"></i> Előző
    </button>
    <button id="diak-bekules-btn" onclick="diakBekules()">
      <i class="fas fa-paper-plane"></i> Beküldés
    </button>
    <button id="diak-next-btn" onclick="diakNext()">
      Következő <i class="fas fa-arrow-right"></i>
    </button>
  </div>

</div>
<!-- ── overlay vége ── -->

<div class="container">
  <div id="auth-error" class="msg msg-err" style="display:none">
    <i class="fas fa-lock"></i> Bejelentkezés szükséges. <a href="../portal.html" style="color:#fca5a5">Vissza a portálra</a>
  </div>

  <div id="loading-state" class="loader">
    <i class="fas fa-spinner fa-spin"></i>
    Betöltés...
  </div>

  <div id="empty-state" class="empty-state" style="display:none">
    <i class="fas fa-inbox"></i>
    Jelenleg nincs aktív számonkérés a te csoportodnak.
    <div style="margin-top:12px;font-size:0.8rem">Ha a tanárod számonkérést indít, az itt jelenik majd meg.</div>
  </div>

  <!-- Számonkérés választó / összesítő -->
  <div id="main-ui" style="display:none"></div>

  <div id="eredmeny-ui" style="display:none;margin-top:32px"></div>
</div>

<script>
const API = 'https://agazati.up.railway.app';
let currentUser = null;
let feladatokMap = {};
let szamonkeresek = [];
let sajatBeadasok = {};

// ── Auth ──────────────────────────────────────────────────────────────────────
(function(){
  const u = JSON.parse(sessionStorage.getItem('kandoUser') || '{}');
  if (!u.token && !u._tesztMod) {
    document.getElementById('loading-state').style.display='none';
    document.getElementById('auth-error').style.display='block';
    return;
  }
  if (u.szerep === 'vendeg') {
    document.getElementById('loading-state').style.display='none';
    document.getElementById('auth-error').style.display='block';
    return;
  }
  currentUser = u;
  document.getElementById('diak-nev').textContent = u.nev || u.email;
  init();
})();

function getToken() {
  if (currentUser.token) return currentUser.token;
  if (currentUser._tesztMod) {
    const backup = JSON.parse(localStorage.getItem('kandoTeacherBackup') || '{}');
    return backup.token || '';
  }
  return '';
}

function authFetch(url, opts = {}) {
  const tok = getToken();
  const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
  if (tok) headers['Authorization'] = 'Bearer ' + tok;
  return fetch(url, { ...opts, headers });
}

// ── Init ──────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const [feladatokTxt] = await Promise.all([
      fetch('feladatok.txt').then(r => r.text()).catch(() => ''),
      loadAktivSzamonkeresek()
    ]);
    feladatokMap = parseFeladatok(feladatokTxt);

    document.getElementById('loading-state').style.display='none';

    if (szamonkeresek.length) {
      await loadOsszesSajatBeadas();
      if (szamonkeresek.length === 1) {
        // Egyetlen számonkérés → rögtön megnyitjuk
        openDiakOverlay(szamonkeresek[0]);
      } else {
        // Több számonkérés → választó képernyő
        renderKivalaszto();
        document.getElementById('main-ui').style.display = 'block';
      }
    } else {
      document.getElementById('empty-state').style.display='block';
    }

    await loadEredmenyek();
  } catch(e) {
    document.getElementById('loading-state').innerHTML =
      `<div class="msg msg-err"><i class="fas fa-triangle-exclamation"></i> Hiba: ${escH(e.message)}</div>`;
  }
}

async function loadAktivSzamonkeresek() {
  const u = currentUser;
  const params = new URLSearchParams({ email: u.email || '' });
  if (u.osztaly) params.append('osztaly', u.osztaly);
  if (u.csoport) params.append('csoport', u.csoport);
  const res = await authFetch(`${API}/api/szamonkeres/aktiv?${params}`);
  if (!res.ok) { szamonkeresek = []; return; }
  szamonkeresek = await res.json();
}

async function loadOsszesSajatBeadas() {
  await Promise.all(szamonkeresek.map(async sz => {
    try {
      const res = await authFetch(`${API}/api/szamonkeres/${sz.id}/sajat?email=${encodeURIComponent(currentUser.email)}`);
      sajatBeadasok[sz.id] = res.ok ? await res.json() : [];
    } catch { sajatBeadasok[sz.id] = []; }
  }));
}

async function loadEredmenyek() {
  try {
    const res = await authFetch(`${API}/api/szamonkeres/eredmeny`);
    if (!res.ok) return;
    const list = await res.json();
    if (!list.length) return;
    renderEredmenyek(list);
  } catch {}
}

function calcJegy(szaz, ph) {
  if (szaz >= (ph.ot   || 85)) return 5;
  if (szaz >= (ph.negy || 70)) return 4;
  if (szaz >= (ph.harom|| 55)) return 3;
  if (szaz >= (ph.ket  || 40)) return 2;
  return 1;
}

function renderEredmenyek(list) {
  const el = document.getElementById('eredmeny-ui');
  const jegyColors = { 1:'#fca5a5', 2:'#fca5a5', 3:'#fcd34d', 4:'#86efac', 5:'#93c5fd' };
  const jegyBg    = { 1:'#7f1d1d', 2:'#7f1d1d', 3:'#78350f', 4:'#1a3a1a', 5:'#1e3a5f' };

  const rows = list.map(e => {
    const ph = JSON.parse(e.ponthatarak || '{}');
    const jegy = calcJegy(e.szazalek, ph);
    return `
    <div style="background:#16213e;border:1px solid #1f2937;border-radius:12px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <div>
        <div style="font-weight:700;font-size:0.95rem;color:#e0e0e0;margin-bottom:3px">${escH(e.cim)}</div>
        <div style="font-size:0.78rem;color:#64748b">${e.createdAt?.substring(0,10) || ''}</div>
      </div>
      <div style="display:flex;align-items:center;gap:20px">
        <div style="text-align:right">
          <div style="font-size:1.4rem;font-weight:900;color:#e0e0e0">${e.osszPont} <span style="font-size:0.9rem;color:#64748b;font-weight:400">/ ${e.maxPont} pont</span></div>
          <div style="font-size:0.82rem;color:#94a3b8">${e.szazalek}%</div>
        </div>
        <div style="font-size:2rem;font-weight:900;padding:8px 20px;border-radius:10px;text-align:center;min-width:56px;background:${jegyBg[jegy]};color:${jegyColors[jegy]}">${jegy}</div>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <div style="height:1px;background:#1f2937;margin-bottom:24px"></div>
    <div style="font-size:0.8rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px">
      <i class="fas fa-circle-check" style="color:#22c55e"></i> Kiadott eredmények
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">${rows}</div>`;
  el.style.display = 'block';
}

// ── Feladatok.txt parse ───────────────────────────────────────────────────────
function parseFeladatok(txt) {
  const map = {};
  const blocks = txt.replace(/\r\n/g,'\n').split(/(?=^\d+\. feladat$)/m).filter(b => b.trim());
  for (const block of blocks) {
    const lines = block.split('\n');
    const numMatch = lines[0].trim().match(/^(\d+)\. feladat$/);
    if (!numMatch) continue;
    const id = parseInt(numMatch[1]);
    let pont=8, cim='', nehezseg='kozepes'; let i=1;
    while (i < lines.length) {
      const l = lines[i].trim();
      if (l.startsWith('Pont: '))         { pont     = parseInt(l.slice(6));  i++; }
      else if (l.startsWith('Cim: '))     { cim      = l.slice(5).trim();     i++; }
      else if (l.startsWith('Nehezseg: ')){ nehezseg = l.slice(10).trim();    i++; }
      else if (l === '')                  { i++; break; }
      else                                { i++; }
    }
    const szovegLines = [];
    for (; i < lines.length; i++) {
      const lt = lines[i].trim();
      if (lt === 'Pontozas:' || lt === 'Tippek:' || lt === 'Megoldas:') break;
      szovegLines.push(lines[i]);
    }
    map[id] = { num: id, cim: cim || `${id}. feladat`, pont, nehezseg, leiras: szovegLines.join('\n').trim() };
  }
  return map;
}

function getFeladatId(f, i) {
  return f.tipus === 'rendszer' ? `r_${f.feladat_szam}` : `s_${i}`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Overlay állapot
// ─────────────────────────────────────────────────────────────────────────────
const diakState = {
  szamonkeres: null,
  feladatok: [],   // enriched: {feladatId, cim, leiras, pont, beadva, beadas}
  currentIdx: 0,
  drafts: {},      // feladatId → kód szöveg (mentett piszkozat navigálásnál)
};
let diakMonaco = null;
let diakPyodide = null;
let diakPyodideLoading = false;
let diakSubmitting = false;

function openDiakOverlay(sz) {
  const rawFeladatok = JSON.parse(sz.feladatok || '[]');
  const beadasok = sajatBeadasok[sz.id] || [];

  diakState.szamonkeres = sz;
  diakState.currentIdx = 0;
  diakState.drafts = {};
  diakState.feladatok = rawFeladatok.map((f, i) => {
    const feladatId = getFeladatId(f, i);
    const isRendszer = f.tipus === 'rendszer';
    const taskInfo = isRendszer ? feladatokMap[f.feladat_szam] : null;
    return {
      feladatId,
      cim:     f.cim || taskInfo?.cim || `${i+1}. feladat`,
      leiras:  isRendszer ? (taskInfo?.leiras || '') : (f.szoveg || ''),
      pont:    f.pont,
      beadva:  beadasok.some(b => b.feladatId === feladatId),
      beadas:  beadasok.find(b => b.feladatId === feladatId) || null,
    };
  });

  document.getElementById('diak-szam-cim').textContent = sz.cim;

  const navEl = document.getElementById('diak-nav');
  navEl.innerHTML = diakState.feladatok.map((f, i) =>
    `<button class="diak-nav-btn${f.beadva ? ' done' : ''}" id="diak-nb-${i}" onclick="diakGoTo(${i})">${i+1}.</button>`
  ).join('');

  document.getElementById('main-ui').style.display = 'none';
  document.getElementById('diak-overlay').style.display = 'flex';

  // "Lista" gomb csak ha több számonkérés van
  const vissza = document.getElementById('diak-vissza-btn');
  if (vissza) vissza.style.display = szamonkeresek.length > 1 ? 'inline-block' : 'none';

  // Az első be nem adott feladatra ugrunk
  const firstOpen = diakState.feladatok.findIndex(f => !f.beadva);
  diakGoTo(firstOpen >= 0 ? firstOpen : 0);

  initDiakMonaco();
  loadDiakPyodide();
}

function diakGoTo(idx) {
  if (idx < 0 || idx >= diakState.feladatok.length) return;

  // Piszkozat mentése az elhagyott feladathoz (ha még nem adta be)
  const prev = diakState.feladatok[diakState.currentIdx];
  if (diakMonaco && !prev.beadva) {
    diakState.drafts[prev.feladatId] = diakMonaco.getValue();
  }

  diakState.currentIdx = idx;
  const t = diakState.feladatok[idx];
  const kod = t.beadva ? (t.beadas?.kod || '') : (diakState.drafts[t.feladatId] || '');

  // Navigáció gombok
  document.querySelectorAll('.diak-nav-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });

  // Feladat fejléc
  document.getElementById('diak-task-num').textContent = `${idx + 1}. feladat`;
  document.getElementById('diak-task-cim').textContent = t.cim;
  document.getElementById('diak-task-pont').textContent = `${t.pont} pont`;
  document.getElementById('diak-task-leiras').textContent = t.leiras || '(nincs leírás)';

  // Beadott állapot sáv
  const sav = document.getElementById('diak-beadott-sav');
  if (t.beadva) {
    const b = t.beadas;
    const pont = b?.manualisPont != null ? b.manualisPont : b?.autoPont;
    const pontSzov = pont != null ? ` · ${pont} / ${t.pont} pont` : '';
    sav.style.display = 'flex';
    sav.innerHTML = `<i class="fas fa-circle-check"></i> Beadva${pontSzov}`;
  } else {
    sav.style.display = 'none';
  }

  // Monaco tartalom és módja
  if (diakMonaco) {
    diakMonaco.setValue(kod);
    diakMonaco.updateOptions({ readOnly: t.beadva });
  }
  const ro = document.getElementById('diak-readonly-badge');
  if (ro) ro.style.display = t.beadva ? 'inline' : 'none';

  // input() mező láthatósága
  document.getElementById('diak-inputs-wrap').style.display =
    kod.includes('input(') ? 'block' : 'none';

  // Kimenet törlése
  document.getElementById('diak-output').textContent =
    '(Nyomj Futtatás gombot a kód teszteléséhez)';

  // Beküldés gomb
  const bekulesBtn = document.getElementById('diak-bekules-btn');
  bekulesBtn.disabled = t.beadva;
  bekulesBtn.className = t.beadva ? 'beadva' : '';
  bekulesBtn.innerHTML = t.beadva
    ? '<i class="fas fa-circle-check"></i> Beadva'
    : '<i class="fas fa-paper-plane"></i> Beküldés';

  // Navigáció gombok
  const isFirst = idx === 0;
  const isLast  = idx === diakState.feladatok.length - 1;
  document.getElementById('diak-prev-btn').style.visibility = isFirst ? 'hidden' : 'visible';

  const nextBtn = document.getElementById('diak-next-btn');
  if (isLast) {
    const mindenBeadva = diakState.feladatok.every(f => f.beadva);
    nextBtn.textContent = mindenBeadva ? 'Összesítő' : 'Bezárás';
    nextBtn.className = mindenBeadva ? 'green' : '';
  } else {
    nextBtn.innerHTML = 'Következő <i class="fas fa-arrow-right"></i>';
    nextBtn.className = '';
  }
}

function diakNext() {
  const isLast = diakState.currentIdx === diakState.feladatok.length - 1;
  if (isLast) {
    closeDiakOverlay();
  } else {
    diakGoTo(diakState.currentIdx + 1);
  }
}

async function diakBekules() {
  if (diakSubmitting) return;
  const idx = diakState.currentIdx;
  const t = diakState.feladatok[idx];
  if (t.beadva) return;

  const kod = diakMonaco ? diakMonaco.getValue().trim() : '';
  if (!kod) { alert('Írd be a megoldásodat mielőtt beküldöd!'); return; }

  diakSubmitting = true;
  const btn = document.getElementById('diak-bekules-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Küldés...';

  try {
    const sz = diakState.szamonkeres;
    const res = await authFetch(`${API}/api/szamonkeres/${sz.id}/beadas`, {
      method: 'POST',
      body: JSON.stringify({
        tanuloEmail: currentUser.email,
        tanuloNev:   currentUser.nev || currentUser.email,
        osztaly:     currentUser.osztaly || null,
        csoport:     currentUser.csoport || null,
        feladatId:   t.feladatId,
        kod,
        autoPont:    0,
        maxPont:     t.pont,
      })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Hiba a beküldés során');

    // Állapot frissítés
    t.beadva = true;
    t.beadas = {
      id: data.id || 0,
      feladatId: t.feladatId,
      kod,
      autoPont: data.autoPont || 0,
      manualisPont: data.manualisPont ?? null,
      maxPont: t.pont,
      submittedAt: new Date().toISOString(),
    };

    // Nav gomb zöld
    const navBtn = document.getElementById(`diak-nb-${idx}`);
    if (navBtn) navBtn.classList.add('done');

    // Megjelenítés frissítése
    diakGoTo(idx);

    // Auto-lépés a következő be nem adott feladatra
    const next = diakState.feladatok.findIndex((f, i) => i > idx && !f.beadva);
    if (next >= 0) setTimeout(() => diakGoTo(next), 400);

  } catch(e) {
    alert('Hiba: ' + e.message);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-paper-plane"></i> Beküldés';
  }
  diakSubmitting = false;
}

function renderKivalaszto() {
  const el = document.getElementById('main-ui');
  el.innerHTML = `
    <div style="margin-bottom:20px">
      <div style="font-size:1rem;font-weight:700;color:#e0e0e0;margin-bottom:6px"><i class="fas fa-file-pen" style="color:#3b82f6;margin-right:8px"></i>Aktív számonkérések</div>
      <div style="font-size:0.83rem;color:#64748b">Válaszd ki, melyiket szeretnéd megnyitni:</div>
    </div>
    ${szamonkeresek.map(sz => {
      const feladatok = JSON.parse(sz.feladatok || '[]');
      const beadasok = sajatBeadasok[sz.id] || [];
      const beadottDb = feladatok.filter((f, i) => beadasok.some(b => b.feladatId === getFeladatId(f, i))).length;
      const mindenBeadva = beadottDb === feladatok.length && feladatok.length > 0;
      const progress = feladatok.length ? Math.round(beadottDb / feladatok.length * 100) : 0;
      return `
        <div onclick="openDiakOverlay(szamonkeresek.find(s=>s.id===${sz.id}))"
          style="background:#16213e;border:1px solid ${mindenBeadva ? '#15803d' : '#1d4ed8'};border-radius:12px;padding:18px 20px;margin-bottom:12px;cursor:pointer;display:flex;align-items:center;gap:16px;transition:border-color .2s"
          onmouseover="this.style.borderColor='${mindenBeadva ? '#4ade80' : '#3b82f6'}'"
          onmouseout="this.style.borderColor='${mindenBeadva ? '#15803d' : '#1d4ed8'}'">
          <i class="fas ${mindenBeadva ? 'fa-circle-check' : 'fa-file-pen'}" style="font-size:1.6rem;color:${mindenBeadva ? '#4ade80' : '#60a5fa'};flex-shrink:0"></i>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:1rem;color:#e0e0e0;margin-bottom:4px">${escH(sz.cim)}</div>
            <div style="font-size:0.8rem;color:#64748b">${feladatok.length} feladat &nbsp;·&nbsp; ${beadottDb} / ${feladatok.length} beadva</div>
            <div style="margin-top:6px;height:4px;background:#1f2937;border-radius:2px;overflow:hidden">
              <div style="height:100%;width:${progress}%;background:${mindenBeadva ? '#22c55e' : '#3b82f6'};border-radius:2px;transition:width .3s"></div>
            </div>
          </div>
          <i class="fas fa-chevron-right" style="color:#64748b;flex-shrink:0"></i>
        </div>`;
    }).join('')}`;
}

function closeDiakOverlay() {
  document.getElementById('diak-overlay').style.display = 'none';
  if (szamonkeresek.length === 1) {
    // Egyetlen számonkérés: összesítő üzenet
    const el = document.getElementById('main-ui');
    const allDone = diakState.feladatok.every(f => f.beadva);
    el.innerHTML = allDone
      ? `<div style="text-align:center;padding:40px 20px">
           <i class="fas fa-circle-check" style="font-size:3rem;color:#22c55e;display:block;margin-bottom:16px"></i>
           <div style="font-size:1.3rem;font-weight:700;color:#e0e0e0;margin-bottom:8px">Beadások rögzítve</div>
           <div style="font-size:0.9rem;color:#64748b;margin-bottom:24px">A tanár hamarosan értékeli a munkádat.</div>
           <a href="../portal.html" class="btn btn-ghost"><i class="fas fa-arrow-left"></i> Vissza a portálra</a>
         </div>`
      : `<div style="text-align:center;padding:40px 20px">
           <div style="font-size:1rem;color:#fcd34d;margin-bottom:20px"><i class="fas fa-triangle-exclamation"></i> Van még be nem adott feladat</div>
           <button class="btn btn-primary" onclick="openDiakOverlay(szamonkeresek[0])"><i class="fas fa-arrow-right"></i> Folytatás</button>
         </div>`;
    el.style.display = 'block';
  } else {
    // Több számonkérés: vissza a listához
    renderKivalaszto();
    document.getElementById('main-ui').style.display = 'block';
  }
  loadEredmenyek();
}

// ── Pyodide futtatás ──────────────────────────────────────────────────────────
async function diakRunCode() {
  const outputEl = document.getElementById('diak-output');
  const kod = diakMonaco ? diakMonaco.getValue() : '';

  if (!diakPyodide) {
    outputEl.textContent = diakPyodideLoading
      ? 'Python betöltése folyamatban, kérlek várj...'
      : 'Python nem töltődött be.';
    return;
  }

  outputEl.textContent = '▶ Futtatás...\n';

  const rawInputs = document.getElementById('diak-inputs')?.value || '';
  const inputQueue = rawInputs.split('\n').map(s => s.trim()).filter(Boolean);

  try {
    diakPyodide.globals.set('_diak_input_queue', diakPyodide.toPy(inputQueue));

    await diakPyodide.runPythonAsync(`
import sys, builtins
from io import StringIO
_stdout = StringIO()
_stderr = StringIO()
sys.stdout = _stdout
sys.stderr = _stderr
_q = list(_diak_input_queue)
_qi = [0]
def _input(prompt=''):
    sys.stdout.write(str(prompt))
    if _qi[0] < len(_q):
        v = _q[_qi[0]]; _qi[0] += 1
        sys.stdout.write(v + '\\n')
        return v
    return ''
builtins.input = _input
`);

    await diakPyodide.runPythonAsync(kod);

    const stdout = diakPyodide.runPython('_stdout.getvalue()');
    const stderr = diakPyodide.runPython('_stderr.getvalue()');
    outputEl.textContent = stdout || '(nincs kimenet)';
    if (stderr) outputEl.textContent += '\n⚠ Hibák:\n' + stderr;
  } catch(e) {
    outputEl.textContent = '✗ Hiba:\n' + e.message;
  } finally {
    try { diakPyodide.runPython('sys.stdout = sys.__stdout__; sys.stderr = sys.__stderr__'); } catch {}
  }

  // input() mező láthatósága az aktuális kódhoz
  document.getElementById('diak-inputs-wrap').style.display =
    kod.includes('input(') ? 'block' : 'none';
}

// ── Monaco inicializálás ──────────────────────────────────────────────────────
function initDiakMonaco() {
  if (diakMonaco) {
    // Már inicializálva van, csak frissítjük a tartalmat
    const t = diakState.feladatok[diakState.currentIdx];
    const kod = t.beadva ? (t.beadas?.kod || '') : (diakState.drafts[t.feladatId] || '');
    diakMonaco.setValue(kod);
    diakMonaco.updateOptions({ readOnly: t.beadva });
    return;
  }
  if (typeof require === 'undefined') return;
  require(['vs/editor/editor.main'], () => {
    const container = document.getElementById('diak-monaco-editor');
    if (!container || !diakState.feladatok.length) return;
    const t = diakState.feladatok[diakState.currentIdx];
    const kod = t.beadva ? (t.beadas?.kod || '') : (diakState.drafts[t.feladatId] || '');
    diakMonaco = monaco.editor.create(container, {
      value: kod,
      language: 'python',
      theme: 'vs-dark',
      readOnly: t.beadva,
      minimap: { enabled: false },
      fontSize: 14,
      lineNumbers: 'on',
      scrollBeyondLastLine: false,
      automaticLayout: true,
    });
    // input() mező frissítése gépelés közben
    diakMonaco.onDidChangeModelContent(() => {
      const v = diakMonaco.getValue();
      document.getElementById('diak-inputs-wrap').style.display =
        v.includes('input(') ? 'block' : 'none';
    });
  });
}

// ── Pyodide betöltés ──────────────────────────────────────────────────────────
async function loadDiakPyodide() {
  if (diakPyodide || diakPyodideLoading) return;
  diakPyodideLoading = true;
  const statusEl = document.getElementById('diak-pyodide-status');
  if (statusEl) statusEl.textContent = 'Python betöltése...';
  try {
    if (typeof loadPyodide === 'undefined') {
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';
        s.onload = resolve; s.onerror = reject;
        document.head.appendChild(s);
      });
    }
    diakPyodide = await loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/' });
    if (statusEl) statusEl.textContent = 'Python kész';
  } catch(e) {
    if (statusEl) statusEl.textContent = 'Python betöltési hiba';
    diakPyodideLoading = false;
  }
}

function escH(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

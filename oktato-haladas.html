<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kandó – Tanulói haladás</title>
<link rel="icon" href="kando_favion_dark.png"  type="image/png" media="(prefers-color-scheme: light)">
<link rel="icon" href="kando_favion_light.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',sans-serif; background:#0d1117; color:#e0e0e0; min-height:100vh; }

/* ── Topbar ── */
.topbar {
    background:#161b22; border-bottom:1px solid #21262d;
    padding:12px 24px; display:flex; align-items:center; gap:16px;
    position:sticky; top:0; z-index:100;
}
.topbar-logo { font-size:1.1rem; font-weight:700; color:#58a6ff; text-decoration:none; display:flex; align-items:center; gap:8px; }
.topbar-title { font-size:1rem; color:#8b949e; flex:1; }
.topbar-title strong { color:#e0e0e0; }
.topbar-back {
    background:none; border:1px solid #30363d; color:#8b949e;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:0.85rem;
    text-decoration:none; display:flex; align-items:center; gap:6px;
    transition:border-color .2s,color .2s;
}
.topbar-back:hover { border-color:#58a6ff; color:#58a6ff; }

/* ── Filter bar ── */
.filterbar {
    background:#161b22; border-bottom:1px solid #21262d;
    padding:10px 20px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
.filterbar label { font-size:0.8rem; color:#8b949e; white-space:nowrap; }
.filterbar select {
    background:#0d1117; border:1px solid #30363d; color:#e0e0e0;
    padding:5px 10px; border-radius:6px; font-size:0.83rem; cursor:pointer;
}
.filterbar select:focus { outline:none; border-color:#58a6ff; }
.filter-sep { width:1px; height:20px; background:#30363d; margin:0 2px; }
.stat-pill {
    background:#21262d; border:1px solid #30363d; border-radius:20px;
    padding:3px 10px; font-size:0.76rem; color:#8b949e;
    display:flex; align-items:center; gap:5px; white-space:nowrap;
}
.stat-pill strong { color:#e0e0e0; }
.stat-pill.danger strong { color:#f85149; }
.stat-pill.warn   strong { color:#f0883e; }
.stat-pill.ok     strong { color:#3fb950; }

/* ── Fő layout ── */
.main-layout {
    display:grid; grid-template-columns:1fr 380px;
    height:calc(100vh - 110px); overflow:hidden;
}

/* ── Bal panel ── */
.left-panel { overflow-y:auto; display:flex; flex-direction:column; }

/* ── Csoport összesítő ── */
.group-overview {
    background:#161b22; border-bottom:1px solid #21262d;
    padding:12px 16px;
}
.group-overview-title {
    font-size:0.72rem; font-weight:700; color:#8b949e;
    text-transform:uppercase; letter-spacing:.05em;
    margin-bottom:10px; display:flex; align-items:center; gap:7px;
}
.group-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); gap:8px;
}
.group-card {
    background:#0d1117; border:1px solid #21262d; border-radius:8px;
    padding:8px 12px; cursor:pointer; transition:border-color .15s;
}
.group-card:hover { border-color:#30363d; }
.group-card.active-group { border-color:#58a6ff; background:#1a2332; }
.gc-label { font-size:0.8rem; font-weight:700; color:#e0e0e0; margin-bottom:6px; }
.gc-meta { font-size:0.72rem; color:#8b949e; margin-bottom:6px; display:flex; gap:8px; flex-wrap:wrap; }
.gc-bar-row { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
.gc-bar-lbl { font-size:0.68rem; color:#8b949e; width:52px; flex-shrink:0; }
.gc-bar-bg { flex:1; height:5px; background:#21262d; border-radius:3px; overflow:hidden; }
.gc-bar-fill { height:100%; border-radius:3px; transition:width .3s; }
.gc-bar-val { font-size:0.68rem; color:#8b949e; min-width:28px; text-align:right; }

/* ── Kártyák ── */
.cards-area { padding:12px 16px; flex:1; }
.cards-grid {
    display:grid; grid-template-columns:repeat(auto-fill, minmax(155px,1fr)); gap:8px;
}
.student-card {
    background:#161b22; border:1px solid #21262d; border-radius:8px;
    padding:10px 11px; cursor:pointer; transition:border-color .15s, box-shadow .15s;
    position:relative;
}
.student-card:hover { border-color:#58a6ff; box-shadow:0 2px 8px rgba(88,166,255,.1); }
.student-card.active-card { border-color:#58a6ff; background:#1a2332; }
.student-card.gyenge { border-color:#f85149 !important; }
.student-card.gyenge:hover { box-shadow:0 2px 8px rgba(248,81,73,.15); }

.card-name {
    font-weight:600; font-size:0.85rem; color:#e0e0e0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:3px;
}
.card-sub { font-size:0.7rem; color:#8b949e; margin-bottom:8px; }
.card-dots { display:flex; gap:4px; align-items:center; }
.tdot {
    width:10px; height:10px; border-radius:50%;
    background:#21262d; border:1.5px solid #30363d;
}
.tdot.done            { background:#3fb950; border-color:#3fb950; }
.tdot.done.css-dot    { background:#58a6ff; border-color:#58a6ff; }
.tdot.done.boot-dot   { background:#a371f7; border-color:#a371f7; }
.tdot.done.emmet-dot  { background:#f0883e; border-color:#f0883e; }
.tdot.done.js-dot     { background:#d29922; border-color:#d29922; }
.tdot-count { font-size:0.68rem; color:#8b949e; margin-left:2px; }

.card-footer {
    display:flex; align-items:center; gap:5px; margin-top:7px;
    padding-top:6px; border-top:1px solid #21262d;
}
.act-dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.act-dot.green  { background:#3fb950; }
.act-dot.yellow { background:#d29922; }
.act-dot.red    { background:#f85149; }
.act-dot.gray   { background:#484f58; }
.act-text { font-size:0.68rem; color:#8b949e; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lemarad-badge {
    position:absolute; top:7px; right:7px;
    background:#f85149; color:#fff; font-size:0.58rem; font-weight:700;
    padding:1px 5px; border-radius:8px; line-height:1.4;
}

/* ── Részletek panel ── */
.detail-panel {
    background:#161b22; border-left:1px solid #21262d;
    overflow-y:auto; display:flex; flex-direction:column;
}
.detail-empty {
    flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    color:#484f58; gap:12px; padding:40px; text-align:center;
}
.detail-empty i { font-size:2.5rem; }
.detail-empty p { font-size:0.85rem; line-height:1.5; }
.detail-header {
    padding:16px 20px 14px; border-bottom:1px solid #21262d;
    background:#0d1117; position:sticky; top:0; z-index:10;
}
.detail-name { font-size:1.05rem; font-weight:700; color:#e0e0e0; }
.detail-meta { font-size:0.78rem; color:#8b949e; margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; }
.detail-body { padding:14px 20px; display:flex; flex-direction:column; gap:18px; }
.detail-section-title {
    font-size:0.73rem; font-weight:700; color:#8b949e;
    text-transform:uppercase; letter-spacing:.05em; margin-bottom:8px;
    display:flex; align-items:center; gap:7px;
}
.tananyag-list { display:flex; flex-direction:column; gap:5px; }
.tananyag-row {
    display:flex; align-items:center; gap:10px;
    padding:6px 10px; background:#0d1117; border-radius:6px; font-size:0.82rem;
}
.tananyag-icon { width:20px; text-align:center; font-size:0.88rem; }
.tananyag-label { flex:1; color:#e0e0e0; }
.tananyag-date { color:#8b949e; font-size:0.73rem; }
.tananyag-check.done    { color:#3fb950; }
.tananyag-check.missing { color:#484f58; }
.practice-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pstat { background:#0d1117; border-radius:6px; padding:10px 12px; text-align:center; }
.pstat-val { font-size:1.25rem; font-weight:700; color:#58a6ff; }
.pstat-val.green  { color:#3fb950; }
.pstat-val.orange { color:#f0883e; }
.pstat-val.yellow { color:#d29922; }
.pstat-lbl { font-size:0.7rem; color:#8b949e; margin-top:2px; }
.szamonkeres-list { display:flex; flex-direction:column; gap:6px; }
.szamonkeres-row { background:#0d1117; border-radius:6px; padding:10px 12px; font-size:0.82rem; }
.szamonkeres-cim { color:#e0e0e0; font-weight:600; margin-bottom:4px; }
.szamonkeres-meta { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.szamonkeres-pont { color:#58a6ff; font-weight:700; }
.szamonkeres-szaz { padding:2px 8px; border-radius:10px; font-size:0.73rem; font-weight:700; }
.szamonkeres-szaz.ot    { background:#1a3a2a; color:#3fb950; }
.szamonkeres-szaz.negy  { background:#1a2e40; color:#58a6ff; }
.szamonkeres-szaz.harom { background:#2a2a1a; color:#d29922; }
.szamonkeres-szaz.ketto { background:#2a1a1a; color:#f0883e; }
.szamonkeres-szaz.egy   { background:#3a1a1a; color:#f85149; }
.szamonkeres-datum { color:#8b949e; font-size:0.73rem; }
.no-data { color:#484f58; font-size:0.82rem; padding:8px 0; text-align:center; }

/* ── Loading ── */
.loading-msg { display:flex; align-items:center; justify-content:center; gap:10px; color:#8b949e; padding:60px; font-size:0.9rem; }
.spin { animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Login ── */
#login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.login-box {
    background:#161b22; border:1px solid #30363d; border-radius:12px;
    padding:40px; width:100%; max-width:380px; text-align:center;
}
.login-box h2 { color:#e0e0e0; font-size:1.3rem; margin-bottom:6px; }
.login-box p  { color:#8b949e; font-size:0.85rem; margin-bottom:28px; }
.login-box input {
    width:100%; background:#0d1117; border:1px solid #30363d; color:#e0e0e0;
    padding:10px 14px; border-radius:8px; font-size:0.95rem; margin-bottom:12px; display:block;
}
.login-box input:focus { outline:none; border-color:#58a6ff; }
.login-box button {
    width:100%; background:#238636; border:none; color:#fff;
    padding:11px; border-radius:8px; font-size:0.95rem; font-weight:600;
    cursor:pointer; transition:background .2s;
}
.login-box button:hover { background:#2ea043; }
.login-err { color:#f85149; font-size:0.82rem; margin-top:10px; min-height:20px; }
</style>
</head>
<body>

<div id="login-screen">
    <div class="login-box">
        <i class="fas fa-chalkboard-teacher" style="font-size:2rem;color:#58a6ff;margin-bottom:14px"></i>
        <h2>Tanulói haladás</h2>
        <p>Ez a felület csak oktatóknak elérhető.</p>
        <input type="text"     id="l-user" placeholder="Felhasználónév" autocomplete="username">
        <input type="password" id="l-pass" placeholder="Jelszó"         autocomplete="current-password">
        <button onclick="doLogin()"><i class="fas fa-sign-in-alt" style="margin-right:6px"></i>Bejelentkezés</button>
        <div class="login-err" id="l-err"></div>
    </div>
</div>

<div id="main-page" style="display:none">

    <div class="topbar">
        <a class="topbar-logo" href="oktato-portal.html">
            <i class="fas fa-graduation-cap"></i> Kandó Teszt
        </a>
        <div class="topbar-title"><strong>Tanulói haladás</strong></div>
        <a class="topbar-back" href="profil.html" style="margin-right:4px">
            <i class="fas fa-user-circle"></i> Profilom
        </a>
        <a class="topbar-back" href="oktato-portal.html">
            <i class="fas fa-arrow-left"></i> Vissza
        </a>
    </div>

    <div class="filterbar">
        <label><i class="fas fa-filter" style="margin-right:4px"></i>Évfolyam:</label>
        <select id="evfolyam-select" onchange="applyFilters()"><option value="">Összes</option></select>
        <label>Osztály:</label>
        <select id="osztaly-select"  onchange="applyFilters()"><option value="">Összes</option></select>
        <label>Csoport:</label>
        <select id="csoport-select"  onchange="applyFilters()"><option value="">Összes</option></select>
        <div class="filter-sep"></div>
        <div class="stat-pill"><i class="fas fa-users"></i> Tanuló: <strong id="cnt-osszes">–</strong></div>
        <div class="stat-pill ok"><i class="fas fa-circle" style="font-size:.55rem;color:#3fb950"></i> Aktív 14 nap: <strong id="cnt-aktiv">–</strong></div>
        <div class="stat-pill warn"><i class="fas fa-book-open"></i> Teljes tananyag: <strong id="cnt-tananyag">–</strong></div>
        <div class="stat-pill danger"><i class="fas fa-exclamation-triangle"></i> Lemarad: <strong id="cnt-gyenge">–</strong></div>
    </div>

    <div class="main-layout">

        <div class="left-panel" id="left-panel">
            <div class="loading-msg"><i class="fas fa-circle-notch spin"></i> Betöltés...</div>
        </div>

        <div class="detail-panel" id="detail-panel">
            <div class="detail-empty">
                <i class="fas fa-hand-pointer"></i>
                <p>Kattints egy tanuló kártyájára a részletes adatok megtekintéséhez.</p>
            </div>
        </div>

    </div>
</div>

<script>
const API = 'https://agazati.up.railway.app';
let authToken = '';
let allData    = [];
let selectedEmail = null;
let activeGroupKey = null;

// ── Auth ─────────────────────────────────────────────────────────────────────

async function doLogin() {
    const user  = document.getElementById('l-user').value.trim();
    const pass  = document.getElementById('l-pass').value;
    const errEl = document.getElementById('l-err');
    errEl.textContent = '';
    if (!user || !pass) { errEl.textContent = 'Töltsd ki mindkét mezőt!'; return; }
    try {
        const res = await fetch(`${API}/api/auth/login`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ username:user, password:pass })
        });
        if (!res.ok) { errEl.textContent = 'Hibás felhasználónév vagy jelszó!'; return; }
        const data = await res.json();
        if (data.role !== 'oktato') { errEl.textContent = 'Csak oktatók érhetik el ezt a felületet!'; return; }
        authToken = data.token;
        showMainPage();
    } catch(e) { errEl.textContent = 'Kapcsolódási hiba!'; }
}

document.getElementById('l-pass').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

(function autoLogin() {
    try {
        const u = JSON.parse(sessionStorage.getItem('kandoUser')||'{}');
        if (u.szerep === 'oktato' && u.token) {
            authToken = u.token;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-page').style.display = 'block';
            loadAll();
        }
    } catch(e) {}
})();

function showMainPage() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-page').style.display = 'block';
    loadAll();
}

async function authFetch(url) {
    return fetch(url, { headers:{ 'Authorization':'Bearer '+authToken } });
}

// ── Adatbetöltés ─────────────────────────────────────────────────────────────

async function loadAll() {
    try {
        const res = await authFetch(`${API}/api/haladas`);
        if (!res.ok) throw new Error();
        allData = await res.json();
        buildFilterOptions();
        applyFilters();
    } catch(e) {
        document.getElementById('left-panel').innerHTML =
            '<div class="loading-msg"><i class="fas fa-exclamation-triangle" style="color:#f85149"></i> Betöltési hiba!</div>';
    }
}

function buildFilterOptions() {
    const ef = [...new Set(allData.map(s=>s.evfolyam).filter(Boolean))].sort();
    const oz = [...new Set(allData.map(s=>s.osztaly).filter(Boolean))].sort();
    const cs = [...new Set(allData.map(s=>s.csoport).filter(Boolean))].sort((a,b)=>{
        if(a==='info') return 1; if(b==='info') return -1;
        return String(a).localeCompare(String(b));
    });

    const add = (selId, arr, fn) => {
        const sel = document.getElementById(selId);
        arr.forEach(v => { const o=document.createElement('option'); o.value=v; o.textContent=fn(v); sel.appendChild(o); });
    };
    add('evfolyam-select', ef, v => v+'. évfolyam');
    add('osztaly-select',  oz, v => v+'. osztály');
    add('csoport-select',  cs, v => v==='info' ? 'info csoport' : v+'. csoport');

    if (ef.includes('10')) document.getElementById('evfolyam-select').value = '10';
}

function applyFilters() {
    const ef = document.getElementById('evfolyam-select').value;
    const oz = document.getElementById('osztaly-select').value;
    const cs = document.getElementById('csoport-select').value;

    const filtered = allData.filter(s =>
        (!ef || String(s.evfolyam)===ef) &&
        (!oz || s.osztaly===oz) &&
        (!cs || String(s.csoport)===cs)
    );

    activeGroupKey = null;
    selectedEmail  = null;
    showDetailEmpty();
    renderLeft(filtered);
    updatePills(filtered);
}

// ── Segédfüggvények ───────────────────────────────────────────────────────────

function daysSince(d) {
    if (!d) return Infinity;
    return Math.floor((new Date()-new Date(d))/86400000);
}
function formatDate(d) {
    if (!d) return null;
    return new Date(d).toLocaleDateString('hu-HU',{year:'numeric',month:'short',day:'numeric'});
}
function actLabel(d) {
    const n = daysSince(d);
    if (n===Infinity) return {cls:'gray',  short:'Sosem',    long:'Sosem volt aktív'};
    if (n===0)        return {cls:'green', short:'Ma',       long:'Ma volt aktív'};
    if (n===1)        return {cls:'green', short:'Tegnap',   long:'Tegnap volt aktív'};
    if (n<=7)         return {cls:'green', short:`${n} napja`,long:`${n} napja aktív`};
    if (n<=14)        return {cls:'yellow',short:`${n} napja`,long:`${n} napja aktív`};
    return                   {cls:'red',   short:`${n} napja`,long:`${n} napja nem volt aktív`};
}
function isGyenge(s) {
    const n = daysSince(s.lastActive);
    const t = [s.tananyagHtml,s.tananyagCss,s.tananyagBootstrap,s.tananyagEmmet,s.tananyagJavascript].filter(Boolean).length;
    const p = (s.pythonSessions||0)+(s.webSessions||0);
    return n===Infinity || (n>14&&t<2) || (n>7&&t===0&&p<3);
}
function gradeColor(p){ return p>=85?'ot':p>=70?'negy':p>=55?'harom':p>=40?'ketto':'egy'; }
function gradeLabel(p){ return p>=85?'5':p>=70?'4':p>=55?'3':p>=40?'2':'1'; }

// ── Bal panel renderelése ─────────────────────────────────────────────────────

function renderLeft(students) {
    const panel = document.getElementById('left-panel');
    if (!students.length) {
        panel.innerHTML = '<div class="loading-msg"><i class="fas fa-user-slash"></i> Nincs tanuló a szűrési feltételeknek megfelelően.</div>';
        return;
    }

    // Csoportok meghatározása
    const csoportMap = {};
    students.forEach(s => {
        const key = [s.evfolyam, s.osztaly, s.csoport].filter(Boolean).join('_') || 'egyeb';
        if (!csoportMap[key]) csoportMap[key] = { ef:s.evfolyam, oz:s.osztaly, cs:s.csoport, students:[] };
        csoportMap[key].students.push(s);
    });

    // Csoport összesítő HTML
    const groupHtml = Object.entries(csoportMap).map(([key, g]) => {
        const total   = g.students.length;
        const aktiv   = g.students.filter(s => daysSince(s.lastActive)<=14).length;
        const tanAtl  = Math.round(g.students.reduce((a,s)=>a+[s.tananyagHtml,s.tananyagCss,s.tananyagBootstrap,s.tananyagEmmet,s.tananyagJavascript].filter(Boolean).length,0)/total*10)/10;
        const gyenge  = g.students.filter(isGyenge).length;
        const aktivPct = Math.round(aktiv/total*100);
        const tanPct   = Math.round(tanAtl/5*100);
        const label    = [g.ef ? g.ef+'.' : '', g.oz ? g.oz : '', g.cs ? (g.cs==='info'?'info':g.cs+'. cs.') : ''].filter(Boolean).join(' ');

        const aktivColor = aktivPct>=70?'#3fb950':aktivPct>=40?'#d29922':'#f85149';
        const tanColor   = tanPct>=60?'#58a6ff':tanPct>=30?'#a371f7':'#484f58';

        return `<div class="group-card" data-key="${key}" onclick="filterByGroup('${key}')">
            <div class="gc-label">${label} <span style="font-size:.68rem;font-weight:400;color:#8b949e">(${total} fő)</span></div>
            <div class="gc-meta">
                <span style="color:${gyenge>0?'#f85149':'#3fb950'}">${gyenge>0?`<i class="fas fa-exclamation-circle" style="margin-right:2px"></i>${gyenge} lemarad`:'<i class="fas fa-check-circle" style="margin-right:2px"></i>Mindenki halad'}</span>
            </div>
            <div class="gc-bar-row">
                <span class="gc-bar-lbl">Aktív</span>
                <div class="gc-bar-bg"><div class="gc-bar-fill" style="width:${aktivPct}%;background:${aktivColor}"></div></div>
                <span class="gc-bar-val">${aktivPct}%</span>
            </div>
            <div class="gc-bar-row">
                <span class="gc-bar-lbl">Tananyag</span>
                <div class="gc-bar-bg"><div class="gc-bar-fill" style="width:${tanPct}%;background:${tanColor}"></div></div>
                <span class="gc-bar-val">${tanAtl}/5</span>
            </div>
        </div>`;
    }).join('');

    // Kártyák HTML
    const cardsHtml = students.map(s => makeCard(s)).join('');

    panel.innerHTML = `
        <div class="group-overview">
            <div class="group-overview-title">
                <i class="fas fa-chart-bar" style="color:#58a6ff"></i>
                Csoport áttekintés — kattints a szűréshez
            </div>
            <div class="group-grid" id="group-grid">${groupHtml}</div>
        </div>
        <div class="cards-area">
            <div class="cards-grid" id="cards-grid">${cardsHtml}</div>
        </div>`;

    // Kártyák klikk eseményei
    document.querySelectorAll('.student-card').forEach(card => {
        card.addEventListener('click', () => selectCard(card.dataset.email, card));
    });
}

function makeCard(s) {
    const gyenge = isGyenge(s);
    const act    = actLabel(s.lastActive);
    const tanDefs = [
        {key:'tananyagHtml',cls:''},
        {key:'tananyagCss', cls:'css-dot'},
        {key:'tananyagBootstrap',cls:'boot-dot'},
        {key:'tananyagEmmet',cls:'emmet-dot'},
        {key:'tananyagJavascript',cls:'js-dot'},
    ];
    const tanDb = tanDefs.filter(t=>s[t.key]).length;
    const dots  = tanDefs.map(t=>`<div class="tdot${s[t.key]?' done '+t.cls:''}" title="${['HTML','CSS','Bootstrap','Emmet','JS'][tanDefs.indexOf(t)]}"></div>`).join('');
    const csLabel = s.csoport==='info'?'info cs.':(s.csoport?s.csoport+'. cs.':'');
    const evozLabel = [s.evfolyam,s.osztaly].filter(Boolean).join('.');

    return `<div class="student-card${gyenge?' gyenge':''}" data-email="${s.email}">
        ${gyenge?'<span class="lemarad-badge">Lemarad</span>':''}
        <div class="card-name" title="${s.nev||s.email}">${s.nev||s.email}</div>
        <div class="card-sub">${evozLabel}${evozLabel&&csLabel?' / ':''}${csLabel}</div>
        <div class="card-dots">${dots}<span class="tdot-count">${tanDb}/5</span></div>
        <div class="card-footer">
            <div class="act-dot ${act.cls}"></div>
            <span class="act-text">${act.short}</span>
        </div>
    </div>`;
}

function filterByGroup(key) {
    activeGroupKey = activeGroupKey === key ? null : key;
    document.querySelectorAll('.group-card').forEach(gc => {
        gc.classList.toggle('active-group', gc.dataset.key === activeGroupKey);
    });

    const ef = document.getElementById('evfolyam-select').value;
    const oz = document.getElementById('osztaly-select').value;
    const cs = document.getElementById('csoport-select').value;

    let filtered = allData.filter(s =>
        (!ef || String(s.evfolyam)===ef) &&
        (!oz || s.osztaly===oz) &&
        (!cs || String(s.csoport)===cs)
    );

    if (activeGroupKey) {
        const [ef2,oz2,cs2] = activeGroupKey.split('_');
        filtered = filtered.filter(s =>
            (!ef2||s.evfolyam===ef2) &&
            (!oz2||s.osztaly===oz2) &&
            (!cs2||s.csoport===cs2)
        );
    }

    const grid = document.getElementById('cards-grid');
    if (!grid) return;
    grid.innerHTML = filtered.map(s=>makeCard(s)).join('');
    document.querySelectorAll('.student-card').forEach(card => {
        card.addEventListener('click', () => selectCard(card.dataset.email, card));
    });
    updatePills(filtered);
}

function selectCard(email, cardEl) {
    document.querySelectorAll('.student-card').forEach(c=>c.classList.remove('active-card'));
    cardEl.classList.add('active-card');
    selectedEmail = email;
    loadDetail(email);
}

// ── Részletek ─────────────────────────────────────────────────────────────────

async function loadDetail(email) {
    const panel = document.getElementById('detail-panel');
    panel.innerHTML = '<div class="loading-msg"><i class="fas fa-circle-notch spin"></i> Betöltés...</div>';
    try {
        const res = await authFetch(`${API}/api/haladas/tanulo/${encodeURIComponent(email)}`);
        if (!res.ok) throw new Error();
        renderDetail(await res.json());
    } catch(e) {
        panel.innerHTML = '<div class="loading-msg"><i class="fas fa-exclamation-triangle" style="color:#f85149"></i> Nem sikerült betölteni.</div>';
    }
}

function renderDetail(s) {
    const panel  = document.getElementById('detail-panel');
    const act    = actLabel(s.lastActive);
    const actClr = act.cls==='green'?'#3fb950':act.cls==='yellow'?'#d29922':act.cls==='red'?'#f85149':'#484f58';

    const tananyagRows = [
        {key:'tananyagHtml',       label:'HTML alapok',     icon:'fab fa-html5',     color:'#e34c26'},
        {key:'tananyagCss',        label:'CSS stílusok',    icon:'fab fa-css3-alt',  color:'#264de4'},
        {key:'tananyagBootstrap',  label:'Bootstrap',       icon:'fab fa-bootstrap', color:'#a371f7'},
        {key:'tananyagEmmet',      label:'Emmet gyorsírás', icon:'fas fa-bolt',      color:'#f0883e'},
        {key:'tananyagJavascript', label:'JavaScript',      icon:'fab fa-js',        color:'#d29922'},
    ].map(t=>`
        <div class="tananyag-row">
            <div class="tananyag-icon"><i class="${t.icon}" style="color:${t.color}"></i></div>
            <div class="tananyag-label">${t.label}</div>
            ${s[t.key]
                ? `<div class="tananyag-date">${formatDate(s[t.key])}</div>
                   <div class="tananyag-check done"><i class="fas fa-check-circle"></i></div>`
                : `<div class="tananyag-check missing"><i class="fas fa-circle" style="opacity:.3"></i></div>`}
        </div>`).join('');

    const pyClr = s.pythonAvgPct>=70?'green':s.pythonAvgPct>=50?'orange':'yellow';
    const wbClr = s.webAvgPct>=70?'green':s.webAvgPct>=50?'orange':'yellow';

    const szamonkHtml = s.szamonkeres?.length
        ? s.szamonkeres.map(sz=>`
            <div class="szamonkeres-row">
                <div class="szamonkeres-cim">${sz.cim}</div>
                <div class="szamonkeres-meta">
                    <span class="szamonkeres-pont">${sz.osszPont} / ${sz.maxPont} pont</span>
                    <span class="szamonkeres-szaz ${gradeColor(sz.szazalek)}">${gradeLabel(sz.szazalek)} (${sz.szazalek}%)</span>
                    <span class="szamonkeres-datum">${formatDate(sz.submittedAt)}</span>
                </div>
            </div>`).join('')
        : '<div class="no-data"><i class="fas fa-inbox" style="margin-right:6px"></i>Még nincs beadott számonkérés</div>';

    const csLabel  = s.csoport==='info'?'info csoport':(s.csoport?s.csoport+'. csoport':'ismeretlen csoport');
    const evozLabel= [s.evfolyam,s.osztaly].filter(Boolean).join('.')||'?';

    panel.innerHTML = `
        <div class="detail-header">
            <div class="detail-name">${s.nev||s.email}</div>
            <div class="detail-meta">
                <span><i class="fas fa-school" style="margin-right:4px;color:#8b949e"></i>${evozLabel} · ${csLabel}</span>
                <span><i class="fas fa-circle" style="font-size:.55rem;color:${actClr};margin-right:4px"></i>${act.long}</span>
            </div>
        </div>
        <div class="detail-body">
            <div>
                <div class="detail-section-title"><i class="fas fa-book-open" style="color:#58a6ff"></i> Tananyag előrehaladás</div>
                <div class="tananyag-list">${tananyagRows}</div>
            </div>
            <div>
                <div class="detail-section-title"><i class="fab fa-python" style="color:#3b82f6"></i> Python ágazati gyakorló</div>
                ${s.pythonSessions>0 ? `
                <div class="practice-grid">
                    <div class="pstat"><div class="pstat-val">${s.pythonSessions}</div><div class="pstat-lbl">feladat megoldva</div></div>
                    <div class="pstat"><div class="pstat-val ${pyClr}">${Math.round(s.pythonAvgPct)}%</div><div class="pstat-lbl">átlagos eredmény</div></div>
                    <div class="pstat"><div class="pstat-val green">${Math.round(s.pythonBestPct)}%</div><div class="pstat-lbl">legjobb eredmény</div></div>
                    <div class="pstat"><div class="pstat-val" style="font-size:.82rem;color:#8b949e">${formatDate(s.pythonLastDate)||'–'}</div><div class="pstat-lbl">utolsó aktivitás</div></div>
                </div>` : `<div class="no-data"><i class="fas fa-inbox" style="margin-right:6px"></i>Még nem gyakorolt</div>`}
            </div>
            <div>
                <div class="detail-section-title"><i class="fas fa-code" style="color:#a371f7"></i> WEB gyakorló</div>
                ${s.webSessions>0 ? `
                <div class="practice-grid">
                    <div class="pstat"><div class="pstat-val">${s.webSessions}</div><div class="pstat-lbl">feladat megoldva</div></div>
                    <div class="pstat"><div class="pstat-val ${wbClr}">${Math.round(s.webAvgPct)}%</div><div class="pstat-lbl">átlagos eredmény</div></div>
                    <div class="pstat"><div class="pstat-val green">${Math.round(s.webBestPct)}%</div><div class="pstat-lbl">legjobb eredmény</div></div>
                    <div class="pstat"><div class="pstat-val" style="font-size:.82rem;color:#8b949e">${formatDate(s.webLastDate)||'–'}</div><div class="pstat-lbl">utolsó aktivitás</div></div>
                </div>` : `<div class="no-data"><i class="fas fa-inbox" style="margin-right:6px"></i>Még nem gyakorolt</div>`}
            </div>
            <div>
                <div class="detail-section-title"><i class="fas fa-file-alt" style="color:#3fb950"></i> Számonkérések eredménye</div>
                <div class="szamonkeres-list">${szamonkHtml}</div>
            </div>
        </div>`;
}

function showDetailEmpty() {
    document.getElementById('detail-panel').innerHTML = `
        <div class="detail-empty">
            <i class="fas fa-hand-pointer"></i>
            <p>Kattints egy tanuló kártyájára a részletes adatok megtekintéséhez.</p>
        </div>`;
}

function updatePills(students) {
    const n  = students.length;
    const ak = students.filter(s=>daysSince(s.lastActive)<=14).length;
    const ta = students.filter(s=>s.tananyagHtml&&s.tananyagCss&&s.tananyagBootstrap&&s.tananyagEmmet&&s.tananyagJavascript).length;
    const gy = students.filter(isGyenge).length;
    document.getElementById('cnt-osszes').textContent   = n;
    document.getElementById('cnt-aktiv').textContent    = `${ak} / ${n}`;
    document.getElementById('cnt-tananyag').textContent = `${ta} / ${n}`;
    document.getElementById('cnt-gyenge').textContent   = gy;
}
</script>

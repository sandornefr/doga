<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profilom – Digitális Tanulási és Számonkérési Rendszer</title>
<link rel="icon" href="kando_favion_dark.png"  type="image/png" media="(prefers-color-scheme: light)">
<link rel="icon" href="kando_favion_light.png" type="image/png" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1117;color:#e0e0e0;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
*{scrollbar-width:thin;scrollbar-color:#30363d transparent;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#484f58;}

/* ── Topbar ── */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 20px;background:#161b22;border-bottom:1px solid #21262d;position:sticky;top:0;z-index:100;}
.topbar-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.topbar-logo img{height:32px;}
.topbar-logo-text{color:#e0e0e0;font-size:0.95rem;font-weight:700;}
.topbar-spacer{flex:1;}
.topbar-btn{background:none;border:1px solid #30363d;color:#8b949e;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:0.82rem;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:border-color .15s,color .15s;}
.topbar-btn:hover{border-color:#58a6ff;color:#58a6ff;}
.topbar-btn.danger{border-color:#30363d;color:#f85149;}
.topbar-btn.danger:hover{border-color:#f85149;background:rgba(248,81,73,.08);}

/* ── Layout ── */
.page{max-width:820px;margin:32px auto;padding:0 16px 60px;}
.section{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:22px 24px;margin-bottom:18px;}
.section-title{font-size:0.8rem;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.section-title i{font-size:0.85rem;}

/* ── Hero kártya ── */
.hero{display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.hero-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#1f6feb,#a371f7);display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;color:#fff;flex-shrink:0;}
.hero-avatar-wrap{position:relative;flex-shrink:0;width:64px;}
.hero-avatar-img{width:64px;height:64px;border-radius:50%;border:2px solid #30363d;background:#161b22 center/cover no-repeat;}
.hero-info h2{font-size:1.2rem;font-weight:700;color:#e0e0e0;margin-bottom:4px;}
.hero-info .hero-email{font-size:0.8rem;color:#8b949e;margin-bottom:6px;}
.hero-info .hero-meta{display:flex;flex-wrap:wrap;gap:8px;}
.hero-tag{background:#21262d;border:1px solid #30363d;border-radius:20px;padding:2px 10px;font-size:0.75rem;color:#c9d1d9;}
.hero-tag.role-tanulo{border-color:#3b82f6;color:#93c5fd;}
.hero-tag.role-oktato{border-color:#a371f7;color:#c4b5fd;}

/* ── Visszaszámló ── */
.countdown-bar{background:linear-gradient(90deg,rgba(31,111,235,.15),rgba(163,113,247,.1));border:1px solid #1f6feb44;border-radius:8px;padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:0.88rem;}
.countdown-days{font-size:1.4rem;font-weight:800;color:#58a6ff;}
.countdown-text{color:#c9d1d9;}
.countdown-sub{font-size:0.72rem;color:#8b949e;}

/* ── Aktív napok ── */
.aktivnap-row{display:flex;align-items:center;gap:14px;}
.aktivnap-fire{font-size:2rem;}
.aktivnap-num{font-size:2rem;font-weight:800;color:#f97316;}
.aktivnap-label{font-size:0.78rem;color:#8b949e;}
.aktivnap-badge{padding:3px 12px;border-radius:20px;font-size:0.75rem;font-weight:700;}

/* ── Haladás ── */
.progress-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media(max-width:540px){.progress-grid{grid-template-columns:1fr;}}
.prog-card{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:14px 16px;}
.prog-card-title{font-size:0.72rem;font-weight:700;color:#8b949e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.prog-level{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.prog-level-icon{font-size:1.5rem;}
.prog-level-name{font-size:0.88rem;font-weight:700;color:#e0e0e0;}
.prog-level-sub{font-size:0.72rem;color:#8b949e;}
.prog-bar-bg{background:#21262d;border-radius:4px;height:6px;overflow:hidden;margin-bottom:6px;}
.prog-bar-fill{height:100%;border-radius:4px;transition:width .5s;}
.prog-bar-fill.web{background:linear-gradient(90deg,#f97316,#fbbf24);}
.prog-bar-fill.python{background:linear-gradient(90deg,#3b82f6,#a371f7);}
.prog-stats{font-size:0.72rem;color:#8b949e;}
.prog-rank{margin-top:8px;font-size:0.72rem;color:#8b949e;display:flex;flex-direction:column;gap:2px;}
.prog-rank-row{display:flex;align-items:center;gap:5px;}

/* ── Kitűzők ── */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ach-item{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:10px 10px 8px;text-align:center;transition:border-color .15s;}
.ach-item.unlocked{border-color:#30363d;}
.ach-item.unlocked:hover{border-color:#58a6ff;}
.ach-item.locked{opacity:.45;filter:grayscale(.7);}
.ach-item.locked.close{opacity:.75;filter:grayscale(.3);border-color:#f97316aa;}
.ach-icon{font-size:1.6rem;display:block;margin-bottom:4px;}
.ach-name{font-size:0.68rem;color:#c9d1d9;line-height:1.3;}
.ach-item.unlocked .ach-name{color:#e0e0e0;font-weight:600;}
.ach-soon{font-size:0.6rem;color:#f97316;font-weight:700;margin-top:4px;letter-spacing:.02em;}
.ach-prog-bg{background:#21262d;border-radius:3px;height:4px;margin-top:5px;overflow:hidden;}
.ach-prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#f97316,#fbbf24);transition:width .4s;}

/* ── Heatmap ── */
.heatmap-wrap{overflow-x:auto;}
.heatmap-months{display:flex;gap:0;margin-bottom:4px;font-size:0.65rem;color:#484f58;}
.heatmap-month-label{flex:none;}
.heatmap-grid{display:flex;gap:3px;}
.heatmap-week{display:flex;flex-direction:column;gap:3px;}
.heatmap-day{width:11px;height:11px;border-radius:2px;background:#161b22;border:1px solid #21262d;}
.heatmap-day.d1{background:#0e4429;border-color:#0e4429;}
.heatmap-day.d2{background:#006d32;border-color:#006d32;}
.heatmap-day.d3{background:#26a641;border-color:#26a641;}
.heatmap-day.d4{background:#39d353;border-color:#39d353;}
.heatmap-legend{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:0.65rem;color:#484f58;justify-content:flex-end;}
.heatmap-legend .heatmap-day{width:10px;height:10px;flex-shrink:0;}

/* ── Legjobb eredmények ── */
.best-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;}
.best-card{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:12px 14px;}
.best-card-label{font-size:0.68rem;color:#8b949e;margin-bottom:4px;}
.best-card-val{font-size:1.3rem;font-weight:800;color:#58a6ff;}
.best-card-sub{font-size:0.7rem;color:#484f58;margin-top:2px;}

/* ── Töltött idő ── */
.time-grid{display:flex;flex-wrap:wrap;gap:10px;}
.time-item{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:10px 14px;font-size:0.78rem;}
.time-item strong{color:#e0e0e0;}
.time-item span{color:#8b949e;}

/* ── Jelszóváltás ── */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:0.78rem;color:#8b949e;margin-bottom:6px;}
.form-input{width:100%;background:#0d1117;border:1px solid #30363d;color:#e0e0e0;padding:8px 12px;border-radius:6px;font-size:0.88rem;}
.form-input:focus{outline:none;border-color:#58a6ff;}
.form-btn{background:#1f6feb;color:#fff;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;}
.form-btn:hover{background:#388bfd;}
.form-btn:disabled{opacity:.5;cursor:not-allowed;}
.form-msg{font-size:0.8rem;margin-top:8px;display:none;}
.form-msg.ok{color:#3fb950;}
.form-msg.err{color:#f85149;}

/* ── Veszélyzóna ── */
.danger-zone{border-color:#f8514933 !important;}
.danger-zone .section-title{color:#f85149;}
.danger-desc{font-size:0.82rem;color:#8b949e;margin-bottom:14px;line-height:1.5;}
.danger-btn{background:transparent;border:1px solid #f85149;color:#f85149;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;}
.danger-btn:hover{background:#f8514915;}

/* ── Spinner / Loading ── */
.page-loading{display:flex;align-items:center;justify-content:center;min-height:60vh;flex-direction:column;gap:14px;color:#484f58;}
.page-loading i{font-size:2rem;}
.spin{animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Törlés modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:999;}
.modal-overlay.open{display:flex;}
.modal-box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:28px 30px;width:100%;max-width:380px;}
.modal-box h3{font-size:1rem;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.modal-box p{font-size:0.85rem;color:#8b949e;margin-bottom:16px;line-height:1.5;}
.modal-btns{display:flex;gap:10px;margin-top:16px;}
.modal-cancel{background:none;border:1px solid #30363d;color:#8b949e;padding:7px 18px;border-radius:6px;cursor:pointer;font-size:0.85rem;}
.modal-cancel:hover{border-color:#e0e0e0;color:#e0e0e0;}
.modal-danger-confirm{background:#f85149;color:#fff;border:none;padding:7px 18px;border-radius:6px;cursor:pointer;font-size:0.85rem;font-weight:600;}
.modal-danger-confirm:hover{background:#ff6b6b;}
.modal-danger-confirm:disabled{opacity:.5;cursor:not-allowed;}
.modal-err{color:#f85149;font-size:0.8rem;margin-top:6px;display:none;}
</style>
</head>

<script>
const API = 'https://agazati.up.railway.app';

function getUser() { return JSON.parse(sessionStorage.getItem('kandoUser') || '{}'); }

function logout() {
    sessionStorage.removeItem('kandoUser');
    localStorage.removeItem('kandoTeacherBackup');
    window.location.replace('login.html');
}

function getAuthHeader(u) {
    let token = u.token;
    if (!token && u._tesztMod) {
        const tb = JSON.parse(localStorage.getItem('kandoTeacherBackup') || '{}');
        token = tb.token || '';
    }
    return token ? { 'Authorization': 'Bearer ' + token } : {};
}

async function apiFetch(url, opts = {}) {
    const u = getUser();
    return fetch(url, { ...opts, headers: { 'Content-Type':'application/json', ...getAuthHeader(u), ...(opts.headers||{}) }, signal: opts.signal || AbortSignal.timeout(30000) });
}

// ── Szint számítás ────────────────────────────────────────────────────────
const PYTHON_LEVELS = [
    { min:90, icon:'🐍', name:'Python-Bűvölő Félisten', color:'#a371f7' },
    { min:80, icon:'🏫', name:'Kandó Büszkesége',       color:'#fbbf24' },
    { min:65, icon:'💎', name:'Kódolók Gyöngye',        color:'#38bdf8' },
    { min:45, icon:'⚔️', name:'Kód Gladiátor',          color:'#fb923c' },
    { min:25, icon:'📋', name:'Copy-Paste Mester',      color:'#94a3b8' },
    { min:0,  icon:'🎨', name:'"Syntax Error" Művész',  color:'#64748b' },
];
const WEB_LEVELS = [
    { min:90, icon:'🌐', name:'Webfejlesztő Félisten',    color:'#a371f7' },
    { min:80, icon:'🏫', name:'Kandó Büszkesége',         color:'#fbbf24' },
    { min:65, icon:'⚙️', name:'Webmester',                color:'#38bdf8' },
    { min:45, icon:'🛡️', name:'Böngésző-Bűvölő Harcos',  color:'#fb923c' },
    { min:25, icon:'🖌️', name:'Webezgető Művész',         color:'#94a3b8' },
    { min:0,  icon:'🔨', name:'Junior Kódfaragó',         color:'#64748b' },
];
function calcLevel(avg, levels) { return levels.find(l => avg >= l.min) || levels[levels.length-1]; }

const STREAK_TITLES = [
    { min:30, icon:'fa-fire-flame-curved', color:'#ff4500', name:'Élő Legenda' },
    { min:14, icon:'fa-fire',              color:'#f97316', name:'Kitartó Harcos' },
    { min: 7, icon:'fa-fire',              color:'#fbbf24', name:'Heti Hős' },
    { min: 3, icon:'fa-fire',              color:'#86efac', name:'Ügyes Kezdő' },
];

// maxConsec: leghosszabb egymást követő aktív nap sorozat valaha
function calcMaxConsecutive(activeDates) {
    if (!activeDates.length) return 0;
    const unique = [...new Set(activeDates.map(d => d.substring(0,10)))].sort();
    let best = 1, cur = 1;
    for (let i = 1; i < unique.length; i++) {
        const prev = new Date(unique[i-1]), curr = new Date(unique[i]);
        const diff = (curr - prev) / 86400000;
        cur = diff === 1 ? cur + 1 : 1;
        if (cur > best) best = cur;
    }
    return best;
}

const ACHIEVEMENTS = [
    { id:'first_web',      icon:'🌐', name:'Első lépés – WEB',           check:(p)=> p.web.sessions >= 1 },
    { id:'first_py',       icon:'🐍', name:'Első lépés – Python',        check:(p)=> p.python.sessions >= 1 },
    { id:'persist_web',    icon:'🔥', name:'Kitartó – WEB',              check:(p)=> p.web.sessions >= 5 },
    { id:'persist_py',     icon:'🔥', name:'Kitartó – Python',           check:(p)=> p.python.sessions >= 5 },
    { id:'adv_web',        icon:'⚡', name:'Haladó – WEB',               check:(p)=> p.web.sessions >= 10 },
    { id:'adv_py',         icon:'⚡', name:'Haladó – Python',            check:(p)=> p.python.sessions >= 10 },
    { id:'perfect_web',    icon:'💯', name:'Tökéletes WEB',              check:(p)=> p.web.bestPercent >= 99.9 },
    { id:'perfect_py',     icon:'💯', name:'Tökéletes Python',           check:(p)=> p.python.bestPercent >= 99.9 },
    { id:'dilig_web',      icon:'🌟', name:'Szorgalmas – WEB',           check:(p)=> p.web.sessions >= 20 },
    { id:'dilig_py',       icon:'🌟', name:'Szorgalmas – Python',        check:(p)=> p.python.sessions >= 20 },
    { id:'webmaster',      icon:'👑', name:'Webmester',                  check:(p)=> p.web.avgPercent >= 85 },
    { id:'pymaster',       icon:'🏆', name:'Python Mester',              check:(p)=> p.python.avgPercent >= 85 },
    { id:'both_ready',     icon:'🎓', name:'Teljes felkészültség',       check:(p)=> p.web.avgPercent >= 75 && p.python.avgPercent >= 75 },
    { id:'ejszakai_bagoly',icon:'🦉', name:'Éjszakai Bagoly',            check:(p,items)=> items.some(i=>{ if(!i.datum) return false; const d=new Date(i.datum.replace(' ','T')+'Z'); const h=parseInt(d.toLocaleString('en-US',{hour:'numeric',hour12:false,timeZone:'Europe/Budapest'})); return h>=20||h<5; }) },
    { id:'early_bird',     icon:'🌅', name:'Early Bird',                  check:(p,items)=> items.some(i=>{ if(!i.datum) return false; const d=new Date(i.datum.replace(' ','T')+'Z'); const h=parseInt(d.toLocaleString('en-US',{hour:'numeric',hour12:false,timeZone:'Europe/Budapest'})); return h>=6&&h<8; }) },
    { id:'hevege_hos',     icon:'🏖️', name:'Hétvégi Hős',               check:(p,items)=> items.some(i=>{ if(!i.datum||i.datum.length<10) return false; const dn=new Date(i.datum.replace(' ','T')+'Z').toLocaleDateString('en-US',{weekday:'long',timeZone:'Europe/Budapest'}); return dn==='Saturday'||dn==='Sunday'; }) },
    { id:'tiz_aktiv_nap',  icon:'📅', name:'10 aktív nap',               check:(p,_,streak)=> streak >= 10 },
    { id:'huszon_aktiv',   icon:'🗓️', name:'20 aktív nap',               check:(p,_,streak)=> streak >= 20 },
    // Egymást követő napok
    { id:'consec_3',  icon:'🌱', name:'3 egymást követő nap',   check:(p,_,s,mc)=> mc >= 3  },
    { id:'consec_5',  icon:'🌿', name:'5 egymást követő nap',   check:(p,_,s,mc)=> mc >= 5  },
    { id:'consec_7',  icon:'🔆', name:'Heti Sorozat (7 nap)',   check:(p,_,s,mc)=> mc >= 7  },
    { id:'consec_10', icon:'💪', name:'10 napos sorozat',       check:(p,_,s,mc)=> mc >= 10 },
    { id:'consec_14', icon:'🏅', name:'Két Hetes Maraton',      check:(p,_,s,mc)=> mc >= 14 },
    // Tananyag completion
    { id:'web_kotelezo_pack',  icon:'🌐', name:'WEB kötelező csomag',     check:(p,items,s,mc,u)=> !!u.tananyagHtml && !!u.tananyagCss && !!u.tananyagBootstrap },
    { id:'py_kotelezo_pack',   icon:'🐍', name:'Python kötelező csomag',  check:(p,items,s,mc,u)=> !!u.pythonKezdo && !!u.pythonHalado },
    { id:'vizsgakesz',         icon:'🎓', name:'Vizsga-kész!',            check:(p,items,s,mc,u)=> !!u.tananyagHtml && !!u.tananyagCss && !!u.tananyagBootstrap && !!u.pythonKezdo && !!u.pythonHalado && (p.web.sessions>0||p.python.sessions>0) },
];

// ── Segédfüggvény: UTC string → Budapest dátum (YYYY-MM-DD) ──────────────
function utcDate(ts) {
    if (!ts) return '';
    return new Date(ts.replace(' ','T')+'Z').toLocaleDateString('sv-SE', { timeZone:'Europe/Budapest' });
}

// ── Heatmap ───────────────────────────────────────────────────────────────
function buildHeatmap(activeDates) {
    const dayMap = {};
    activeDates.forEach(d => { dayMap[d] = (dayMap[d]||0) + 1; });

    const today = new Date();
    const start = new Date('2026-03-01');
    // Hétfőre igazítjuk
    const dow = start.getDay();
    start.setDate(start.getDate() - (dow === 0 ? 6 : dow - 1));

    const HU_MONTHS = ['Jan','Feb','Már','Ápr','Máj','Jún','Júl','Aug','Sze','Okt','Nov','Dec'];
    const weeks = [];
    let cur = new Date(start);
    let monthLabels = [];
    let prevMonth = -1;
    let totalCells = 0;

    while (cur <= today) {
        const week = [];
        for (let d = 0; d < 7; d++) {
            if (cur > today) { week.push(null); cur.setDate(cur.getDate()+1); continue; }
            const ds = cur.toLocaleDateString('sv-SE', { timeZone:'Europe/Budapest' });
            const cnt = dayMap[ds] || 0;
            week.push({ ds, cnt });
            if (cur.getMonth() !== prevMonth) {
                monthLabels.push({ weekIdx: weeks.length + (d >= 3 ? 1 : 0), label: HU_MONTHS[cur.getMonth()] });
                prevMonth = cur.getMonth();
            }
            cur.setDate(cur.getDate()+1);
            totalCells++;
        }
        weeks.push(week);
    }

    // month label row – abszolút pozícionálás, hogy ne folyjon egymásra
    let monthHtml = '<div class="heatmap-months" style="position:relative;height:14px;">';
    monthLabels.forEach((ml) => {
        if (ml.label === 'Feb' || ml.label === 'Jan') return; // igazítási töltőhetek, ne jelenjen meg
        const leftPx = ml.weekIdx * 14;
        monthHtml += `<span style="position:absolute;left:${leftPx}px;">${ml.label}</span>`;
    });
    monthHtml += '</div>';

    let gridHtml = '<div class="heatmap-grid">';
    weeks.forEach(week => {
        gridHtml += '<div class="heatmap-week">';
        week.forEach(day => {
            if (!day) { gridHtml += '<div class="heatmap-day"></div>'; return; }
            const cls = day.cnt === 0 ? '' : day.cnt === 1 ? 'd1' : day.cnt <= 3 ? 'd2' : day.cnt <= 6 ? 'd3' : 'd4';
            const title = day.cnt > 0 ? `${day.ds}: ${day.cnt} tevékenység` : day.ds;
            gridHtml += `<div class="heatmap-day ${cls}" title="${title}"></div>`;
        });
        gridHtml += '</div>';
    });
    gridHtml += '</div>';

    return `<div class="heatmap-wrap">
        ${monthHtml}
        ${gridHtml}
        <div class="heatmap-legend">
            <span>Kevesebb</span>
            <div class="heatmap-day"></div>
            <div class="heatmap-day d1"></div>
            <div class="heatmap-day d2"></div>
            <div class="heatmap-day d3"></div>
            <div class="heatmap-day d4"></div>
            <span>Több</span>
        </div>
    </div>`;
}

// ── Főoldal render ────────────────────────────────────────────────────────
async function loadProfile() {
    const u = getUser();
    if (!u.email) { window.location.replace('login.html'); return; }

    const page = document.getElementById('page');
    const isOktato = u.szerep === 'oktato';

    // Oktató megtekintheti bármelyik tanuló profilját: profil.html?email=...
    const params = new URLSearchParams(window.location.search);
    const targetEmail = params.get('email');
    const isEmbed = params.get('embed') === 'true';
    if (isEmbed) document.querySelector('.topbar')?.remove();
    if (isOktato && targetEmail) {
        if (!isEmbed) {
            const backBtn = document.querySelector('.topbar-btn[href="portal.html"], .topbar a.topbar-btn');
            if (backBtn) { backBtn.href = 'oktato-haladas.html'; backBtn.innerHTML = '<i class="fas fa-arrow-left"></i> Tanulói haladás'; }
        }
        const fakeU = { email: targetEmail, nev: targetEmail, szerep: 'tanulo', token: u.token, _oktatoNez: true };
        // Név lekérése a haladás adatból
        const nRes = await apiFetch(`${API}/api/haladas/tanulo/${encodeURIComponent(targetEmail)}`).catch(()=>null);
        if (nRes?.ok) { const d = await nRes.json(); fakeU.nev = d.nev || targetEmail; fakeU.osztaly = d.osztaly; fakeU.csoport = d.csoport; fakeU.evfolyam = d.evfolyam; }
        await loadTanuloProfile(fakeU, page);
        return;
    }

    const isTanulo = u.szerep === 'tanulo' || u._tesztMod;
    if (isTanulo) await loadTanuloProfile(u, page);
    else if (isOktato) await loadOktatoProfile(u, page);
    else { page.innerHTML = `<div class="page-loading"><i class="fas fa-lock"></i><span>Nem elérhető</span></div>`; }
}

function renderProgCard(data, label, targy, levels, rankInfo) {
    const lv = calcLevel(data.avgPercent, levels);
    const barPct = data.sessions > 0 ? Math.min(100, Math.round(data.avgPercent)) : 0;
    const icon = targy === 'python' ? 'fab fa-python' : 'fas fa-code';
    const color = targy === 'python' ? '#3b82f6' : '#f97316';
    const rankRows = [
        { r:rankInfo?.csoport,  icon:'fa-users' },
        { r:rankInfo?.osztaly,  icon:'fa-chalkboard-user' },
        { r:rankInfo?.evfolyam, icon:'fa-graduation-cap' },

// ── Jelszóváltás ──────────────────────────────────────────────────────────
async function changePassword() {
    const u = getUser();
    const old = document.getElementById('pw-old')?.value || '';
    const nw  = document.getElementById('pw-new')?.value || '';
    const nw2 = document.getElementById('pw-new2')?.value || '';
    const btn = document.getElementById('pw-btn');
    const okEl = document.getElementById('pw-ok');
    const errEl= document.getElementById('pw-err');
    okEl.style.display = 'none';
    errEl.style.display = 'none';
    if (!old || !nw || !nw2) { errEl.textContent='Minden mező kitöltése kötelező!'; errEl.style.display='block'; return; }
    if (nw !== nw2) { errEl.textContent='A két jelszó nem egyezik!'; errEl.style.display='block'; return; }
    if (nw.length < 6) { errEl.textContent='A jelszó legalább 6 karakter legyen!'; errEl.style.display='block'; return; }
    btn.disabled = true;
    try {
        const res = await apiFetch(`${API}/api/auth/change-own-password`, {
            method:'POST',
            body: JSON.stringify({ email: u.email, oldPassword: old, newPassword: nw })
        });
        if (res.ok) {
            okEl.style.display='block';
            document.getElementById('pw-old').value='';
            document.getElementById('pw-new').value='';
            document.getElementById('pw-new2').value='';
        } else {
            const d = await res.json().catch(()=>({}));
            errEl.textContent = d.error || 'Hibás jelenlegi jelszó.';
            errEl.style.display='block';
        }
    } catch { errEl.textContent='Kapcsolati hiba.'; errEl.style.display='block'; }
    btn.disabled = false;
}

// ── Törlés ────────────────────────────────────────────────────────────────
function openDeleteModal()  { document.getElementById('delete-modal').classList.add('open'); }
function closeDeleteModal() { document.getElementById('delete-modal').classList.remove('open'); document.getElementById('delete-err').style.display='none'; document.getElementById('delete-pw').value=''; }

async function confirmDelete() {
    const u = getUser();
    const pw  = document.getElementById('delete-pw').value;
    const btn = document.getElementById('delete-confirm-btn');
    const err = document.getElementById('delete-err');
    err.style.display='none';
    if (!pw) { err.textContent='Add meg a jelszavadat!'; err.style.display='block'; return; }
    btn.disabled = true;
    try {
        const res = await fetch(`${API}/api/auth/delete-account`, {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ email: u.email, password: pw })
        });
        if (res.ok) {
            sessionStorage.removeItem('kandoUser');
            localStorage.clear();
            window.location.replace('login.html');
        } else {
            const d = await res.json().catch(()=>({}));
            err.textContent = d.error || 'Hibás jelszó.';
            err.style.display='block';
        }
    } catch { err.textContent='Kapcsolati hiba.'; err.style.display='block'; }
    btn.disabled = false;
}

function initialsAvatarUri(name, email) {
    const words = (name || email || '?').trim().split(/\s+/).filter(Boolean);
    const ini = words.length >= 2
        ? (words[0][0] + words[words.length-1][0]).toUpperCase()
        : (words[0] || '?').substring(0, 2).toUpperCase();
    let h = 0;
    const str = email || name || '';
    for (let i = 0; i < str.length; i++) h = (Math.imul(h, 31) + str.charCodeAt(i)) | 0;
    const grads = [
        ['#1e3a8a','#3b82f6'],['#5b21b6','#a78bfa'],['#064e3b','#34d399'],
        ['#7f1d1d','#f87171'],['#78350f','#fbbf24'],['#831843','#f472b6'],
        ['#134e4a','#2dd4bf'],['#1e1b4b','#818cf8'],['#0c4a6e','#38bdf8'],
        ['#3b0764','#c084fc'],['#14532d','#86efac'],['#7c2d12','#fb923c'],
    ];
    const [c1, c2] = grads[Math.abs(h) % grads.length];
    const fs = ini.length > 1 ? 34 : 40;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs><circle cx="48" cy="48" r="48" fill="url(#g)"/><text x="48" y="${48 + fs*0.36}" text-anchor="middle" font-size="${fs}" font-weight="700" font-family="system-ui,sans-serif" fill="white" letter-spacing="2">${ini}</text></svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

function avatarDataUri(seed) {
    let s = 5381;
    for (let i = 0; i < seed.length; i++) s = (Math.imul(s, 33) ^ seed.charCodeAt(i)) | 0;
    s = s || 1;
    function r(n) { s^=s<<13; s^=s>>17; s^=s<<5; return Math.abs(s)%n; }

    const BG   = ['#0f172a','#1e1b4b','#0c1a3a','#12102a','#0a1f2e','#101820','#1a0d1a','#141414'][r(8)];
    const HEAD = ['#FFD700','#FFC107','#FFDB4D','#F5C518','#FFE033'][r(5)];
    const HAIR = ['#1a1008','#3d1f0d','#7a3b1e','#c47a1e','#e8c87a','#bb2020','#606060','#efefef','#1a3a8a','#0a5c30'][r(10)];
    const HAT  = ['#c0392b','#1a3a8a','#155c2a','#2c2c2c','#6c3483','#b5700a'][r(6)];
    const LIPS = ['#c0392b','#e74c3c','#922b21'][r(3)];
    const ht = r(7);  // 0=bald,1=short,2=tall,3=swept,4=curly,5=mohawk,6=hat
    const et = r(4);  // 0=normal,1=happy,2=big,3=sleepy
    const mt = r(5);  // 0=bigsmile,1=smile,2=straight,3=smirk,4=teeth
    const bt = r(3);  // 0=none,1=flat,2=arch
    const gl = r(7)===0;
    const rc = r(5)===0;
    const HB = '#9A7D0A';
    // head geometry – bigger, centred lower so hair has room above
    const HY = 58, HR = 30;
    let p = [];

    p.push(`<circle cx="48" cy="48" r="48" fill="${BG}"/>`);

    // long hair behind head
    if (ht===0 && r(3)===0) { // occasional long-hair bald variant
        p.push(`<rect x="14" y="34" width="12" height="46" rx="6" fill="${HAIR}"/>`);
        p.push(`<rect x="70" y="34" width="12" height="46" rx="6" fill="${HAIR}"/>`);
    }

    // HEAD
    p.push(`<circle cx="48" cy="${HY}" r="${HR}" fill="${HEAD}" stroke="${HB}" stroke-width="1.5"/>`);
    // stud – cylinder on top
    const SY = HY - HR; // top of head = 28
    p.push(`<rect x="41" y="${SY-9}" width="14" height="11" fill="${HEAD}"/>`);
    p.push(`<ellipse cx="48" cy="${SY-9}" rx="7" ry="4" fill="${HEAD}" stroke="${HB}" stroke-width="1.5"/>`);
    p.push(`<ellipse cx="48" cy="${SY}" rx="7" ry="3.5" fill="${HEAD}"/>`); // cover seam

    // HAIR
    if (ht===1) { // short neat – rounded cap
        p.push(`<path d="M22 ${SY+2} Q24 ${SY-18} 48 ${SY-20} Q72 ${SY-18} 74 ${SY+2} Q60 ${SY+6} 48 ${SY+5} Q36 ${SY+6} 22 ${SY+2}Z" fill="${HAIR}"/>`);
    } else if (ht===2) { // tall block
        p.push(`<rect x="33" y="2" width="30" height="${SY+4}" rx="8" fill="${HAIR}"/>`);
    } else if (ht===3) { // side-swept
        p.push(`<path d="M24 ${SY+4} Q26 ${SY-16} 52 ${SY-18} Q66 ${SY-16} 72 ${SY+2} Q56 ${SY+4} 24 ${SY+4}Z" fill="${HAIR}"/>`);
    } else if (ht===4) { // curly/afro
        for (const [cx,cy,rx,ry] of [[48,SY-16,20,14],[34,SY-10,12,10],[62,SY-10,12,10],[48,SY-4,22,8]])
            p.push(`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${HAIR}"/>`);
    } else if (ht===5) { // mohawk
        p.push(`<path d="M44 ${SY+2} Q46 0 48 0 Q50 0 52 ${SY+2} Q50 ${SY+4} 48 ${SY+3} Q46 ${SY+4} 44 ${SY+2}Z" fill="${HAIR}"/>`);
    } else if (ht===6) { // hat
        p.push(`<rect x="28" y="6" width="40" height="${SY+4}" rx="10" fill="${HAT}"/>`);
        p.push(`<rect x="18" y="${SY+2}" width="60" height="8" rx="4" fill="${HAT}"/>`);
    }

    // face feature y positions relative to head centre
    const EY = HY - 5, MY = HY + 10, BY = HY - 14;

    // EYEBROWS
    if (bt===1) {
        p.push(`<line x1="37" y1="${BY}" x2="44" y2="${BY}" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round"/>`);
        p.push(`<line x1="52" y1="${BY}" x2="59" y2="${BY}" stroke="#2a2a2a" stroke-width="2.5" stroke-linecap="round"/>`);
    } else if (bt===2) {
        p.push(`<path d="M37 ${BY+1} Q40.5 ${BY-3} 44 ${BY+1}" stroke="#2a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>`);
        p.push(`<path d="M52 ${BY+1} Q55.5 ${BY-3} 59 ${BY+1}" stroke="#2a2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>`);
    }

    // EYES
    if (et===0) { // normal dots with glare
        p.push(`<circle cx="41" cy="${EY}" r="4" fill="#1a1a1a"/><circle cx="55" cy="${EY}" r="4" fill="#1a1a1a"/>`);
        p.push(`<circle cx="42.5" cy="${EY-1.5}" r="1.4" fill="white"/><circle cx="56.5" cy="${EY-1.5}" r="1.4" fill="white"/>`);
    } else if (et===1) { // happy squint arcs
        p.push(`<path d="M38 ${EY+1} Q41 ${EY-4} 44 ${EY+1}" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>`);
        p.push(`<path d="M52 ${EY+1} Q55 ${EY-4} 58 ${EY+1}" stroke="#1a1a1a" stroke-width="3" fill="none" stroke-linecap="round"/>`);
    } else if (et===2) { // big surprised
        p.push(`<circle cx="41" cy="${EY}" r="5.5" fill="#1a1a1a"/><circle cx="55" cy="${EY}" r="5.5" fill="#1a1a1a"/>`);
        p.push(`<circle cx="43" cy="${EY-2}" r="2" fill="white"/><circle cx="57" cy="${EY-2}" r="2" fill="white"/>`);
    } else { // sleepy half-lid
        p.push(`<circle cx="41" cy="${EY}" r="4" fill="#1a1a1a"/><circle cx="55" cy="${EY}" r="4" fill="#1a1a1a"/>`);
        p.push(`<rect x="37" y="${EY-4}" width="8" height="5" rx="1" fill="${HEAD}"/>`);
        p.push(`<rect x="51" y="${EY-4}" width="8" height="5" rx="1" fill="${HEAD}"/>`);
        p.push(`<circle cx="42.5" cy="${EY-1}" r="1.2" fill="white"/><circle cx="56.5" cy="${EY-1}" r="1.2" fill="white"/>`);
    }

    // GLASSES (over eyes)
    if (gl) {
        p.push(`<rect x="33" y="${EY-5}" width="15" height="12" rx="5" fill="none" stroke="#2a2a2a" stroke-width="2"/>`);
        p.push(`<rect x="50" y="${EY-5}" width="15" height="12" rx="5" fill="none" stroke="#2a2a2a" stroke-width="2"/>`);
        p.push(`<line x1="48" y1="${EY}" x2="50" y2="${EY}" stroke="#2a2a2a" stroke-width="2"/>`);
        p.push(`<line x1="33" y1="${EY}" x2="28" y2="${EY+1}" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>`);
        p.push(`<line x1="65" y1="${EY}" x2="70" y2="${EY+1}" stroke="#2a2a2a" stroke-width="2" stroke-linecap="round"/>`);
    }

    // MOUTH
    if (mt===0) { // big open smile
        p.push(`<path d="M36 ${MY} Q48 ${MY+13} 60 ${MY}" stroke="#1a1a1a" stroke-width="2" fill="${LIPS}" stroke-linecap="round" stroke-linejoin="round"/>`);
    } else if (mt===1) { // friendly smile
        p.push(`<path d="M40 ${MY} Q48 ${MY+7} 56 ${MY}" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`);
    } else if (mt===2) { // straight
        p.push(`<line x1="40" y1="${MY+2}" x2="56" y2="${MY+2}" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>`);
    } else if (mt===3) { // smirk
        p.push(`<path d="M40 ${MY+2} Q45 ${MY-1} 56 ${MY+1}" stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>`);
    } else { // teeth smile
        p.push(`<path d="M36 ${MY} Q48 ${MY+13} 60 ${MY} L60 ${MY+5} Q48 ${MY+17} 36 ${MY+5}Z" fill="${LIPS}"/>`);
        p.push(`<rect x="40" y="${MY}" width="16" height="6" rx="1" fill="white"/>`);
        p.push(`<line x1="48" y1="${MY}" x2="48" y2="${MY+6}" stroke="${LIPS}" stroke-width="1.5"/>`);
    }

    // ROSY CHEEKS
    if (rc) {
        p.push(`<circle cx="32" cy="${EY+6}" r="5.5" fill="rgba(255,110,110,0.3)"/>`);
        p.push(`<circle cx="64" cy="${EY+6}" r="5.5" fill="rgba(255,110,110,0.3)"/>`);
    }

    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">${p.join('')}</svg>`;
    return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

loadProfile();

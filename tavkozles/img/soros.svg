<svg xmlns="http://www.w3.org/2000/svg" width="520" height="150" viewBox="0 0 520 150">
  <rect width="520" height="150" fill="#0d1117" rx="8"/>
  <!-- Felső vezetek -->
  <line x1="50" y1="40" x2="520" y2="40" stroke="#58a6ff" stroke-width="2"/>
  <!-- Alsó vezetek -->
  <line x1="50" y1="110" x2="520" y2="110" stroke="#58a6ff" stroke-width="2"/>
  <!-- Bal oldal bezárása -->
  <line x1="50" y1="40" x2="50" y2="65" stroke="#58a6ff" stroke-width="2"/>
  <line x1="50" y1="85" x2="50" y2="110" stroke="#58a6ff" stroke-width="2"/>
  <!-- Akkumulátor szimbólum -->
  <line x1="34" y1="65" x2="66" y2="65" stroke="#22c55e" stroke-width="3"/>
  <line x1="38" y1="72" x2="62" y2="72" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="34" y1="78" x2="66" y2="78" stroke="#8b949e" stroke-width="3"/>
  <line x1="38" y1="85" x2="62" y2="85" stroke="#8b949e" stroke-width="1.5"/>
  <text x="70" y="70" fill="#22c55e" font-size="11" font-family="monospace">+</text>
  <text x="70" y="83" fill="#ef4444" font-size="11" font-family="monospace">–</text>
  <!-- R1 -->
  <line x1="50" y1="40" x2="130" y2="40" stroke="#58a6ff" stroke-width="2"/>
  <rect x="130" y="27" width="80" height="26" rx="4" fill="#1c2128" stroke="#fbbf24" stroke-width="2"/>
  <text x="170" y="44" fill="#fbbf24" font-size="14" font-family="monospace" text-anchor="middle">R₁</text>
  <line x1="210" y1="40" x2="270" y2="40" stroke="#58a6ff" stroke-width="2"/>
  <!-- R2 -->
  <rect x="270" y="27" width="80" height="26" rx="4" fill="#1c2128" stroke="#fbbf24" stroke-width="2"/>
  <text x="310" y="44" fill="#fbbf24" font-size="14" font-family="monospace" text-anchor="middle">R₂</text>
  <line x1="350" y1="40" x2="410" y2="40" stroke="#58a6ff" stroke-width="2"/>
  <!-- R3 -->
  <rect x="410" y="27" width="80" height="26" rx="4" fill="#1c2128" stroke="#fbbf24" stroke-width="2"/>
  <text x="450" y="44" fill="#fbbf24" font-size="14" font-family="monospace" text-anchor="middle">R₃</text>
  <line x1="490" y1="40" x2="520" y2="40" stroke="#58a6ff" stroke-width="2"/>
  <line x1="520" y1="40" x2="520" y2="110" stroke="#58a6ff" stroke-width="2"/>
  <!-- Áram nyíl -->
  <text x="200" y="132" fill="#8b949e" font-size="11" font-family="monospace" text-anchor="middle">→ I →</text>
  <!-- Felirat -->
  <text x="8" y="14" fill="#8b949e" font-size="10" font-family="sans-serif">Soros kapcsolás</text>
</svg>

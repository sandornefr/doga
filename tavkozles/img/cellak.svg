<svg xmlns="http://www.w3.org/2000/svg" width="400" height="340" viewBox="0 0 400 340">
  <rect width="400" height="340" fill="#0d1117" rx="8"/>
  <!-- Hexagonok (lapos oldal felfelé) – 7 cella -->
  <!-- Középső cella -->
  <polygon points="200,110 240,88 240,44 200,22 160,44 160,88" fill="#1c2128" stroke="#1f6feb" stroke-width="2"/>
  <circle cx="200" cy="66" r="5" fill="#fbbf24"/>
  <text x="200" y="70" fill="#fbbf24" font-size="9" font-family="monospace" text-anchor="middle">BS</text>
  <text x="200" y="86" fill="#8b949e" font-size="8" font-family="monospace" text-anchor="middle">A</text>
  <!-- Bal felső -->
  <polygon points="120,110 160,88 160,44 120,22 80,44 80,88" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="120" cy="66" r="4" fill="#8b949e"/>
  <text x="120" y="86" fill="#8b949e" font-size="8" font-family="monospace" text-anchor="middle">B</text>
  <!-- Jobb felső -->
  <polygon points="280,110 320,88 320,44 280,22 240,44 240,88" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="280" cy="66" r="4" fill="#8b949e"/>
  <text x="280" y="86" fill="#8b949e" font-size="8" font-family="monospace" text-anchor="middle">C</text>
  <!-- Bal középső -->
  <polygon points="120,198 160,176 160,132 120,110 80,132 80,176" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="120" cy="154" r="4" fill="#8b949e"/>
  <text x="120" y="174" fill="#8b949e" font-size="8" font-family="monospace" text-anchor="middle">D</text>
  <!-- Jobb középső -->
  <polygon points="280,198 320,176 320,132 280,110 240,132 240,176" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="280" cy="154" r="4" fill="#8b949e"/>
  <text x="280" y="174" fill="#8b949e" font-size="8" font-family="monospace" text-anchor="middle">E</text>
  <!-- Bal alsó -->
  <polygon points="120,286 160,264 160,220 120,198 80,220 80,264" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="120" cy="242" r="4" fill="#8b949e"/>
  <text x="120" y="262" fill="#8b949e" font-size="8" font-family="monospace" text-anchor="middle">F</text>
  <!-- Jobb alsó -->
  <polygon points="280,286 320,264 320,220 280,198 240,220 240,264" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="280" cy="242" r="4" fill="#8b949e"/>
  <text x="280" y="262" fill="#8b949e" font-size="8" font-family="monospace" text-anchor="middle">G</text>
  <!-- Jelmagyarázat -->
  <circle cx="32" cy="306" r="5" fill="#fbbf24"/>
  <text x="44" y="310" fill="#fbbf24" font-size="10" font-family="sans-serif">BS = bázisállomás</text>
  <text x="8" y="14" fill="#8b949e" font-size="10" font-family="sans-serif">Cellás hálózati elrendezés (mobiltelefónia)</text>
</svg>

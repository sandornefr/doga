  <text x="175" y="130" fill="#388bfd" font-size="11" font-family="monospace" text-anchor="middle">Közös adatvezeték (busz)</text>
  <text x="8" y="14" fill="#8b949e" font-size="10" font-family="sans-serif">Hálózati topológia</text>

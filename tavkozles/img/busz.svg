  <text x="3" y="120" fill="#8b949e" font-size="9" font-family="monospace">T</text>
  <text x="453" y="120" fill="#8b949e" font-size="9" font-family="monospace">T</text>
  <!-- Csomópontok és eszközök -->
  <line x1="80" y1="90" x2="80" y2="55" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="80" cy="90" r="5" fill="#388bfd"/>
  <rect x="50" y="22" width="60" height="32" rx="5" fill="#1c2128" stroke="#22c55e" stroke-width="1.5"/>
  <text x="80" y="42" fill="#22c55e" font-size="10" font-family="monospace" text-anchor="middle">PC 1</text>
  <line x1="170" y1="90" x2="170" y2="55" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="170" cy="90" r="5" fill="#388bfd"/>
  <rect x="140" y="22" width="60" height="32" rx="5" fill="#1c2128" stroke="#22c55e" stroke-width="1.5"/>
  <text x="170" y="42" fill="#22c55e" font-size="10" font-family="monospace" text-anchor="middle">PC 2</text>
  <line x1="260" y1="90" x2="260" y2="55" stroke="#30363d" stroke-width="1.5"/>

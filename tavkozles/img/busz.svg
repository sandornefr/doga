  <rect x="230" y="22" width="60" height="32" rx="5" fill="#1c2128" stroke="#22c55e" stroke-width="1.5"/>
  <text x="260" y="42" fill="#22c55e" font-size="10" font-family="monospace" text-anchor="middle">PC 3</text>
  <line x1="350" y1="90" x2="350" y2="55" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="350" cy="90" r="5" fill="#388bfd"/>
  <rect x="320" y="22" width="60" height="32" rx="5" fill="#1c2128" stroke="#22c55e" stroke-width="1.5"/>

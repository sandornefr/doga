<svg xmlns="http://www.w3.org/2000/svg" width="480" height="160" viewBox="0 0 480 160">
  <rect width="480" height="160" fill="#0d1117" rx="8"/>
  <!-- Közös busz vonal -->
  <line x1="30" y1="90" x2="450" y2="90" stroke="#388bfd" stroke-width="3"/>
  <!-- Lezárók -->
  <rect x="10" y="82" width="20" height="16" rx="3" fill="#30363d" stroke="#8b949e" stroke-width="1.5"/>

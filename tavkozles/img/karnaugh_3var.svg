<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200" font-family="Arial" font-size="14">
  <!-- Title -->
  <text x="140" y="20" text-anchor="middle" font-size="13" font-weight="bold">Karnaugh-tábla (A, B, C)</text>

  <!-- Table frame -->
  <rect x="60" y="35" width="200" height="140" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- Column dividers -->
  <line x1="110" y1="35" x2="110" y2="175" stroke="#333" stroke-width="1"/>
  <line x1="160" y1="35" x2="160" y2="175" stroke="#333" stroke-width="1"/>
  <line x1="210" y1="35" x2="210" y2="175" stroke="#333" stroke-width="1"/>

  <!-- Row divider -->
  <line x1="60" y1="85" x2="260" y2="85" stroke="#333" stroke-width="1"/>

  <!-- AB header -->
  <text x="85" y="28" text-anchor="middle" font-size="12" fill="#555">AB→</text>
  <text x="85" y="75" text-anchor="middle" font-size="13" font-weight="bold">C↓</text>

  <!-- Column headers (Gray code: 00, 01, 11, 10) -->
  <text x="135" y="62" text-anchor="middle" font-size="13">00</text>
  <text x="185" y="62" text-anchor="middle" font-size="13">01</text>
  <text x="235" y="62" text-anchor="middle" font-size="13">11</text>
  <text x="85" y="62" text-anchor="middle" font-size="13">10</text>

  <!-- Row headers -->
  <text x="85" y="115" text-anchor="middle" font-size="13">0</text>
  <text x="85" y="155" text-anchor="middle" font-size="13">1</text>

  <!-- Cell values (example: C=0 row) -->
  <text x="135" y="115" text-anchor="middle" font-size="14">1</text>
  <text x="185" y="115" text-anchor="middle" font-size="14">0</text>
  <text x="235" y="115" text-anchor="middle" font-size="14">1</text>
  <text x="85"  y="115" text-anchor="middle" font-size="14">0</text>

  <!-- Cell values (C=1 row) -->
  <text x="135" y="155" text-anchor="middle" font-size="14">1</text>
  <text x="185" y="155" text-anchor="middle" font-size="14">1</text>
  <text x="235" y="155" text-anchor="middle" font-size="14">1</text>
  <text x="85"  y="155" text-anchor="middle" font-size="14">1</text>

  <!-- Grouping ellipse (4-cell group) -->
  <ellipse cx="185" cy="145" rx="72" ry="22" fill="none" stroke="#1d6feb" stroke-width="2" stroke-dasharray="5,3"/>
</svg>

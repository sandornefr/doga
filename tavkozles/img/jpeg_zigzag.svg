<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 280" width="260" height="280" font-family="Arial" font-size="11">
  <text x="130" y="18" text-anchor="middle" font-size="13" font-weight="bold">JPEG Zig-Zag bejárás (8×8 DCT blokk)</text>

  <!-- 8x8 grid -->
  <g transform="translate(20,30)">
    <!-- Grid lines -->
    <rect x="0" y="0" width="220" height="220" fill="#f8f8f8" stroke="#ccc" stroke-width="1"/>
    <!-- Vertical lines -->
    <line x1="27.5" y1="0" x2="27.5" y2="220" stroke="#ccc" stroke-width="0.8"/>
    <line x1="55"   y1="0" x2="55"   y2="220" stroke="#ccc" stroke-width="0.8"/>
    <line x1="82.5" y1="0" x2="82.5" y2="220" stroke="#ccc" stroke-width="0.8"/>
    <line x1="110"  y1="0" x2="110"  y2="220" stroke="#ccc" stroke-width="0.8"/>
    <line x1="137.5" y1="0" x2="137.5" y2="220" stroke="#ccc" stroke-width="0.8"/>
    <line x1="165"  y1="0" x2="165"  y2="220" stroke="#ccc" stroke-width="0.8"/>
    <line x1="192.5" y1="0" x2="192.5" y2="220" stroke="#ccc" stroke-width="0.8"/>
    <!-- Horizontal lines -->
    <line x1="0" y1="27.5" x2="220" y2="27.5" stroke="#ccc" stroke-width="0.8"/>
    <line x1="0" y1="55"   x2="220" y2="55"   stroke="#ccc" stroke-width="0.8"/>
    <line x1="0" y1="82.5" x2="220" y2="82.5" stroke="#ccc" stroke-width="0.8"/>
    <line x1="0" y1="110"  x2="220" y2="110"  stroke="#ccc" stroke-width="0.8"/>
    <line x1="0" y1="137.5" x2="220" y2="137.5" stroke="#ccc" stroke-width="0.8"/>
    <line x1="0" y1="165"  x2="220" y2="165"  stroke="#ccc" stroke-width="0.8"/>
    <line x1="0" y1="192.5" x2="220" y2="192.5" stroke="#ccc" stroke-width="0.8"/>

    <!-- Zig-zag path (approximate key waypoints) -->
    <polyline
      points="14,14  41,14  14,41  14,69  41,41  69,14  96,14  69,41  41,69  14,96
              14,124 41,96  69,69  96,41  124,14 151,14 124,41 96,69  69,96  41,124
              14,151 14,179 41,151 69,124 96,96  124,69 151,41 179,14 206,14 179,41
              151,69 124,96 96,124 69,151 41,179 14,206 41,206 69,179 96,151 124,124
              151,96 179,69 206,41 206,69 179,96 151,124 124,151 96,179 69,206 96,206
              124,179 151,151 179,124 206,96 206,124 179,151 151,179 124,206 151,206
              179,179 206,151 206,179 179,206 206,206"
      fill="none" stroke="#e63946" stroke-width="2" stroke-linejoin="round"/>

    <!-- Start dot -->
    <circle cx="14" cy="14" r="5" fill="#22c55e"/>
    <text x="18" y="12" font-size="10" fill="#22c55e">DC</text>
  </g>

  <text x="130" y="268" text-anchor="middle" font-size="11" fill="#555">Alacsony frekvenciától a magas felé haladó bejárás</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" font-family="Arial" font-size="13">
  <!-- Gate lead -->
  <line x1="40" y1="130" x2="90" y2="130" stroke="#222" stroke-width="2"/>
  <text x="28" y="134" text-anchor="middle" font-size="14">G</text>

  <!-- Gate bar -->
  <line x1="90" y1="100" x2="90" y2="160" stroke="#222" stroke-width="3"/>

  <!-- Body (channel) bar -->
  <line x1="100" y1="105" x2="100" y2="155" stroke="#222" stroke-width="3"/>

  <!-- Drain connection -->
  <line x1="100" y1="110" x2="130" y2="110" stroke="#222" stroke-width="2"/>
  <line x1="130" y1="110" x2="130" y2="60" stroke="#222" stroke-width="2"/>
  <text x="143" y="64" text-anchor="start" font-size="14">D</text>

  <!-- Source connection -->
  <line x1="100" y1="150" x2="130" y2="150" stroke="#222" stroke-width="2"/>
  <line x1="130" y1="150" x2="130" y2="200" stroke="#222" stroke-width="2"/>
  <text x="143" y="204" text-anchor="start" font-size="14">S</text>

  <!-- Body arrow (P-channel: arrow pointing OUT from channel) -->
  <line x1="100" y1="130" x2="118" y2="130" stroke="#222" stroke-width="2"/>
  <polygon points="100,130 112,124 112,136" fill="#222"/>

  <!-- Bulk/body to source -->
  <line x1="118" y1="130" x2="130" y2="130" stroke="#222" stroke-width="2"/>
  <line x1="130" y1="130" x2="130" y2="150" stroke="#222" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Labels -->
  <text x="100" y="240" text-anchor="middle" font-size="12" fill="#555">P-csatornás növekményes MOSFET</text>
</svg>

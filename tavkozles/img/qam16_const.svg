<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" width="260" height="260" font-family="Arial" font-size="12">
  <!-- Axes -->
  <line x1="130" y1="10" x2="130" y2="250" stroke="#aaa" stroke-width="1"/>
  <line x1="10"  y1="130" x2="250" y2="130" stroke="#aaa" stroke-width="1"/>
  <text x="252" y="134" font-size="12" fill="#666">I</text>
  <text x="132" y="10"  font-size="12" fill="#666">Q</text>

  <!-- 16 constellation points (4x4 grid, ±1, ±3 normalized) -->
  <!-- Row Q=+3 -->
  <circle cx="80"  cy="80"  r="6" fill="#1d6feb"/>
  <circle cx="107" cy="80"  r="6" fill="#1d6feb"/>
  <circle cx="153" cy="80"  r="6" fill="#1d6feb"/>
  <circle cx="180" cy="80"  r="6" fill="#1d6feb"/>
  <!-- Row Q=+1 -->
  <circle cx="80"  cy="107" r="6" fill="#1d6feb"/>
  <circle cx="107" cy="107" r="6" fill="#1d6feb"/>
  <circle cx="153" cy="107" r="6" fill="#1d6feb"/>
  <circle cx="180" cy="107" r="6" fill="#1d6feb"/>
  <!-- Row Q=-1 -->
  <circle cx="80"  cy="153" r="6" fill="#1d6feb"/>
  <circle cx="107" cy="153" r="6" fill="#1d6feb"/>
  <circle cx="153" cy="153" r="6" fill="#1d6feb"/>
  <circle cx="180" cy="153" r="6" fill="#1d6feb"/>
  <!-- Row Q=-3 -->
  <circle cx="80"  cy="180" r="6" fill="#1d6feb"/>
  <circle cx="107" cy="180" r="6" fill="#1d6feb"/>
  <circle cx="153" cy="180" r="6" fill="#1d6feb"/>
  <circle cx="180" cy="180" r="6" fill="#1d6feb"/>

  <text x="130" y="250" text-anchor="middle" font-size="12" fill="#555">16-QAM konstellációs diagram</text>
</svg>

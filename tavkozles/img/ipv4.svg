<svg xmlns="http://www.w3.org/2000/svg" width="500" height="180" viewBox="0 0 500 180">
  <rect width="500" height="180" fill="#0d1117" rx="8"/>
  <!-- 32 bit mezők 4 × 8 bit -->
  <!-- 1. oktett -->
  <rect x="30" y="60" width="100" height="50" rx="4" fill="#1c2128" stroke="#1f6feb" stroke-width="2"/>
  <text x="80" y="82" fill="#58a6ff" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">192</text>
  <text x="80" y="100" fill="#8b949e" font-size="10" font-family="monospace" text-anchor="middle">8 bit</text>
  <!-- 2. oktett -->
  <rect x="140" y="60" width="100" height="50" rx="4" fill="#1c2128" stroke="#1f6feb" stroke-width="2"/>
  <text x="190" y="82" fill="#58a6ff" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">168</text>
  <text x="190" y="100" fill="#8b949e" font-size="10" font-family="monospace" text-anchor="middle">8 bit</text>
  <!-- 3. oktett -->
  <rect x="250" y="60" width="100" height="50" rx="4" fill="#1c2128" stroke="#1f6feb" stroke-width="2"/>
  <text x="300" y="82" fill="#58a6ff" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">10</text>
  <text x="300" y="100" fill="#8b949e" font-size="10" font-family="monospace" text-anchor="middle">8 bit</text>
  <!-- 4. oktett -->
  <rect x="360" y="60" width="100" height="50" rx="4" fill="#1c2128" stroke="#1f6feb" stroke-width="2"/>
  <text x="410" y="82" fill="#58a6ff" font-size="14" font-family="monospace" text-anchor="middle" font-weight="bold">5</text>
  <text x="410" y="100" fill="#8b949e" font-size="10" font-family="monospace" text-anchor="middle">8 bit</text>
  <!-- Pont elválasztók -->
  <text x="131" y="92" fill="#c9d1d9" font-size="18" font-family="monospace" text-anchor="middle">.</text>
  <text x="241" y="92" fill="#c9d1d9" font-size="18" font-family="monospace" text-anchor="middle">.</text>
  <text x="351" y="92" fill="#c9d1d9" font-size="18" font-family="monospace" text-anchor="middle">.</text>
  <!-- Összesítő nyíl -->
  <line x1="30" y1="130" x2="460" y2="130" stroke="#30363d" stroke-width="1"/>
  <line x1="30" y1="125" x2="30" y2="135" stroke="#30363d" stroke-width="1"/>
  <line x1="460" y1="125" x2="460" y2="135" stroke="#30363d" stroke-width="1"/>
  <text x="245" y="148" fill="#8b949e" font-size="11" font-family="monospace" text-anchor="middle">32 bit összesen</text>
  <!-- Cím felirat -->
  <text x="245" y="40" fill="#c9d1d9" font-size="13" font-family="monospace" text-anchor="middle">192 . 168 . 10 . 5</text>
  <text x="8" y="14" fill="#8b949e" font-size="10" font-family="sans-serif">IPv4-cím felépítése (4 oktett)</text>
  <!-- Értéktartomány -->
  <text x="245" y="170" fill="#8b949e" font-size="10" font-family="monospace" text-anchor="middle">Minden oktett értéke: 0–255</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200">
  <rect width="420" height="200" fill="#0d1117" rx="8"/>
  <!-- Bal függőleges sín -->
  <line x1="60" y1="20" x2="60" y2="180" stroke="#58a6ff" stroke-width="2"/>
  <!-- Jobb függőleges sín -->
  <line x1="360" y1="20" x2="360" y2="180" stroke="#58a6ff" stroke-width="2"/>
  <!-- Akkumulátor (bal oldalon belül) -->
  <line x1="20" y1="85" x2="20" y2="20" stroke="#58a6ff" stroke-width="2"/>
  <line x1="20" y1="115" x2="20" y2="180" stroke="#58a6ff" stroke-width="2"/>
  <line x1="5" y1="85" x2="35" y2="85" stroke="#22c55e" stroke-width="3"/>
  <line x1="9" y1="92" x2="31" y2="92" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="5" y1="98" x2="35" y2="98" stroke="#8b949e" stroke-width="3"/>
  <line x1="9" y1="105" x2="31" y2="105" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="20" y1="20" x2="60" y2="20" stroke="#58a6ff" stroke-width="2"/>
  <line x1="20" y1="180" x2="60" y2="180" stroke="#58a6ff" stroke-width="2"/>
  <!-- R1 (felső ág) -->
  <line x1="60" y1="40" x2="120" y2="40" stroke="#58a6ff" stroke-width="2"/>
  <rect x="120" y="27" width="160" height="26" rx="4" fill="#1c2128" stroke="#fbbf24" stroke-width="2"/>
  <text x="200" y="44" fill="#fbbf24" font-size="14" font-family="monospace" text-anchor="middle">R₁</text>
  <line x1="280" y1="40" x2="360" y2="40" stroke="#58a6ff" stroke-width="2"/>
  <!-- R2 (középső ág) -->
  <line x1="60" y1="100" x2="120" y2="100" stroke="#58a6ff" stroke-width="2"/>
  <rect x="120" y="87" width="160" height="26" rx="4" fill="#1c2128" stroke="#fbbf24" stroke-width="2"/>
  <text x="200" y="104" fill="#fbbf24" font-size="14" font-family="monospace" text-anchor="middle">R₂</text>
  <line x1="280" y1="100" x2="360" y2="100" stroke="#58a6ff" stroke-width="2"/>
  <!-- R3 (alsó ág) -->
  <line x1="60" y1="160" x2="120" y2="160" stroke="#58a6ff" stroke-width="2"/>
  <rect x="120" y="147" width="160" height="26" rx="4" fill="#1c2128" stroke="#fbbf24" stroke-width="2"/>
  <text x="200" y="164" fill="#fbbf24" font-size="14" font-family="monospace" text-anchor="middle">R₃</text>
  <line x1="280" y1="160" x2="360" y2="160" stroke="#58a6ff" stroke-width="2"/>
  <!-- Csatlakozó pontok -->
  <circle cx="60" cy="40" r="4" fill="#58a6ff"/>
  <circle cx="60" cy="100" r="4" fill="#58a6ff"/>
  <circle cx="60" cy="160" r="4" fill="#58a6ff"/>
  <circle cx="360" cy="40" r="4" fill="#58a6ff"/>
  <circle cx="360" cy="100" r="4" fill="#58a6ff"/>
  <circle cx="360" cy="160" r="4" fill="#58a6ff"/>
  <!-- Felirat -->
  <text x="8" y="14" fill="#8b949e" font-size="10" font-family="sans-serif">Párhuzamos kapcsolás</text>
</svg>

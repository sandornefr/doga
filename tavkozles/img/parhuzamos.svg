<svg xmlns="http://www.w3.org/2000/svg" width="420" height="200" viewBox="0 0 420 200">
  <rect width="420" height="200" fill="#0d1117" rx="8"/>
  <!-- Felső sín (+ csomópont) -->
  <line x1="55" y1="48" x2="375" y2="48" stroke="#58a6ff" stroke-width="2"/>
  <!-- Alsó sín (− csomópont) -->
  <line x1="55" y1="158" x2="375" y2="158" stroke="#58a6ff" stroke-width="2"/>
  <!-- Akkumulátor (x=78) – felső síntől alsó sínig -->
  <line x1="78" y1="48" x2="78" y2="80" stroke="#58a6ff" stroke-width="2"/>
  <line x1="62" y1="80" x2="94" y2="80" stroke="#22c55e" stroke-width="3"/>
  <line x1="66" y1="88" x2="90" y2="88" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="62" y1="97" x2="94" y2="97" stroke="#8b949e" stroke-width="3"/>
  <line x1="66" y1="105" x2="90" y2="105" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="78" y1="105" x2="78" y2="158" stroke="#58a6ff" stroke-width="2"/>
  <text x="98" y="83" fill="#22c55e" font-size="11" font-family="monospace">+</text>
  <text x="98" y="109" fill="#8b949e" font-size="11" font-family="monospace">−</text>
  <text x="28" y="105" fill="#22c55e" font-size="13" font-family="monospace">U</text>
  <!-- R1 (x=178) -->
  <line x1="178" y1="48" x2="178" y2="77" stroke="#58a6ff" stroke-width="2"/>
  <rect x="165" y="77" width="26" height="50" rx="4" fill="#1c2128" stroke="#fbbf24" stroke-width="2"/>
  <text x="178" y="107" fill="#fbbf24" font-size="13" font-family="monospace" text-anchor="middle">R₁</text>
  <line x1="178" y1="127" x2="178" y2="158" stroke="#58a6ff" stroke-width="2"/>
  <!-- R2 (x=258) -->
  <line x1="258" y1="48" x2="258" y2="77" stroke="#58a6ff" stroke-width="2"/>
  <rect x="245" y="77" width="26" height="50" rx="4" fill="#1c2128" stroke="#fbbf24" stroke-width="2"/>
  <text x="258" y="107" fill="#fbbf24" font-size="13" font-family="monospace" text-anchor="middle">R₂</text>
  <line x1="258" y1="127" x2="258" y2="158" stroke="#58a6ff" stroke-width="2"/>
  <!-- R3 (x=338) -->
  <line x1="338" y1="48" x2="338" y2="77" stroke="#58a6ff" stroke-width="2"/>
  <rect x="325" y="77" width="26" height="50" rx="4" fill="#1c2128" stroke="#fbbf24" stroke-width="2"/>
  <text x="338" y="107" fill="#fbbf24" font-size="13" font-family="monospace" text-anchor="middle">R₃</text>
  <line x1="338" y1="127" x2="338" y2="158" stroke="#58a6ff" stroke-width="2"/>
  <!-- Csatlakozó pontok – felső sín -->
  <circle cx="78"  cy="48"  r="4" fill="#58a6ff"/>
  <circle cx="178" cy="48"  r="4" fill="#58a6ff"/>
  <circle cx="258" cy="48"  r="4" fill="#58a6ff"/>
  <circle cx="338" cy="48"  r="4" fill="#58a6ff"/>
  <!-- Csatlakozó pontok – alsó sín -->
  <circle cx="78"  cy="158" r="4" fill="#58a6ff"/>
  <circle cx="178" cy="158" r="4" fill="#58a6ff"/>
  <circle cx="258" cy="158" r="4" fill="#58a6ff"/>
  <circle cx="338" cy="158" r="4" fill="#58a6ff"/>
  <!-- Felirat -->
  <text x="8" y="14" fill="#8b949e" font-size="10" font-family="sans-serif">Párhuzamos kapcsolás</text>
</svg>

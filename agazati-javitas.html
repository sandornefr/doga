<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ágazati Javítás – Kandó</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0b1120;color:#e0e0e0;font-family:'Segoe UI',sans-serif;min-height:100vh}
    .topbar{background:#16213e;border-bottom:1px solid #1f2937;padding:11px 20px;display:flex;align-items:center;justify-content:space-between}
    .topbar-logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.95rem;color:#e0e0e0;text-decoration:none}
    .topbar-logo img{height:30px}
    a.back{padding:5px 14px;border-radius:8px;border:1px solid #374151;background:transparent;color:#9ca3af;font-size:.82rem;text-decoration:none;transition:.2s}
    a.back:hover{border-color:#6b7280;color:#e0e0e0}
    .container{max-width:1500px;margin:0 auto;padding:20px 16px}
    .subj-tabs{display:flex;gap:8px;margin-bottom:20px}
    .subj-btn{padding:8px 20px;border-radius:8px;border:1px solid #374151;background:transparent;color:#64748b;font-size:.88rem;font-weight:700;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:7px}
    .subj-btn.active{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
    .subj-btn:disabled{opacity:.35;cursor:not-allowed}
    .card{background:#16213e;border:1px solid #1f2937;border-radius:12px;padding:18px;margin-bottom:14px}
    label{font-size:.82rem;color:#94a3b8;display:block;margin-bottom:4px}
    input[type=text],select{width:100%;padding:8px 11px;background:#0b1120;border:1px solid #374151;border-radius:8px;color:#e0e0e0;font-size:.88rem;outline:none;transition:border .2s}
    input[type=text]:focus,select:focus{border-color:#3b82f6}
    .upload-zone{border:2px dashed #374151;border-radius:10px;padding:28px 16px;text-align:center;cursor:pointer;transition:.2s;background:#0b1120;position:relative}
    .upload-zone:hover,.upload-zone.dragover{border-color:#3b82f6;background:#0d1a2e}
    .upload-zone.has-files{border-color:#15803d;background:#0a2a1a}
    .upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:10}
    .btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-size:.88rem;font-weight:700;transition:.2s;display:inline-flex;align-items:center;gap:7px}
    .btn-primary{background:#1d4ed8;color:#fff}.btn-primary:hover:not(:disabled){background:#2563eb}
    .btn-primary:disabled{opacity:.45;cursor:not-allowed}
    .btn-ghost{background:transparent;border:1px solid #374151;color:#9ca3af}.btn-ghost:hover{border-color:#6b7280;color:#e0e0e0}
    .btn-sm{padding:5px 12px;font-size:.8rem}
    .form-row{margin-bottom:12px}
    /* Grading layout */
    .grading-header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;background:#16213e;border:1px solid #1f2937;border-radius:10px;margin-bottom:14px}
    .split{display:flex;gap:14px;align-items:flex-start}
    .code-col{width:46%;flex-shrink:0}
    .criteria-col{flex:1;overflow-y:auto;max-height:540px}
    /* Code viewer */
    .code-wrap{background:#16213e;border:1px solid #1f2937;border-radius:10px;overflow:hidden}
    .code-tabbar{display:flex;gap:0;background:#0b1120;border-bottom:1px solid #1f2937}
    .code-tab{padding:6px 18px;border:none;background:transparent;color:#64748b;font-size:.8rem;font-weight:700;cursor:pointer;transition:.15s;border-right:1px solid #1f2937}
    .code-tab.active{background:#16213e;color:#e0e0e0}
    .code-tab:hover:not(.active){color:#94a3b8}
    #aj-code-view{width:100%;height:500px;background:#0b1120;color:#cbd5e1;font-family:'Cascadia Code','Fira Code',Consolas,monospace;font-size:.76rem;border:none;padding:12px;resize:none;outline:none;line-height:1.6;display:block}
    .code-hint{padding:5px 12px;background:#0d1a2e;font-size:.72rem;color:#374151;min-height:22px;font-family:monospace}
    /* Criteria */
    .aj-sec{background:#0d1a2e;border-left:3px solid #3b82f6;padding:6px 12px;margin:10px 0 3px;border-radius:0 6px 6px 0;color:#64748b;font-size:.73rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .aj-row{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;margin-bottom:2px;transition:background .15s}
    .aj-row:hover{background:rgba(255,255,255,.03)}
    .aj-row.pass{border-left:3px solid #22c55e}
    .aj-row.fail{border-left:3px solid #ef4444}
    .aj-row.manual{border-left:3px solid #f59e0b}
    .aj-row-lbl{flex:1;font-size:.79rem;color:#cbd5e1;line-height:1.4}
    .aj-row.fail .aj-row-lbl{cursor:pointer}
    .aj-row.fail .aj-row-lbl:hover{color:#fff;text-decoration:underline dotted #ef4444}
    .clickhint{font-size:.68rem;color:#4b5563;margin-left:4px;font-style:italic}
    .aj-btns{display:flex;gap:3px;flex-shrink:0}
    .aj-btn{width:30px;height:26px;border:1px solid #374151;border-radius:5px;background:#0b1120;color:#4b5563;font-size:.8rem;font-weight:700;cursor:pointer;transition:.15s}
    .aj-btn:hover{border-color:#3b82f6;color:#94a3b8}
    .aj-btn.a1{background:#22c55e;border-color:#22c55e;color:#0b1120}
    .aj-btn.a05{background:#f59e0b;border-color:#f59e0b;color:#0b1120}
    .aj-btn.a0{background:#ef4444;border-color:#ef4444;color:#fff}
    .aj-thumb{max-width:100%;max-height:100px;border-radius:5px;border:1px solid #374151;margin-top:4px;display:block;cursor:pointer}
    @media(max-width:900px){.split{flex-direction:column}.code-col{width:100%}}
  </style>
</head>
<body>

<div class="topbar">
  <a class="topbar-logo" href="portal.html">
    <img src="kandologo2.png" alt="Kandó">
    Ágazati Javítás
  </a>
  <a class="back" href="portal.html"><i class="fas fa-arrow-left"></i> Vissza a portálra</a>
</div>

<div class="container">

  <div id="auth-err" style="display:none;padding:14px;background:#7f1d1d;border:1px solid #dc2626;border-radius:10px;margin-bottom:16px;color:#fca5a5">
    <i class="fas fa-lock"></i> Oktatói bejelentkezés szükséges.
    <a href="portal.html" style="color:#fca5a5;margin-left:8px">← Portál</a>
  </div>

  <div id="main-ui">

    <div class="subj-tabs">
      <button class="subj-btn active"><i class="fas fa-globe"></i> WEB</button>
      <button class="subj-btn" disabled title="Hamarosan..."><i class="fas fa-code"></i> PYTHON</button>
    </div>

    <!-- ══ FELTÖLTÉS ══ -->
    <div id="aj-upload-step">
      <div class="card">
        <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;">
          <div style="flex:1;min-width:160px;" class="form-row">
            <label>Tanuló neve</label>
            <input type="text" id="aj-nev" placeholder="pl. Kovács Béla">
          </div>
          <div style="flex:1;min-width:160px;" class="form-row">
            <label>Feladat</label>
            <select id="aj-feladat">
              <option value="szigetek">Szigetek – Weboldal kódolása</option>
            </select>
          </div>
        </div>
        <div class="form-row" style="margin-bottom:16px;">
          <label><i class="fas fa-file-lines" style="color:#f59e0b"></i> Feladat leírás <span style="color:#4b5563;font-weight:400;">(opcionális – .docx vagy .txt)</span></label>
          <div class="upload-zone" style="padding:14px;position:relative;">
            <input type="file" id="aj-feladat-inp" accept=".docx,.txt" style="position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;z-index:10;" onchange="ajLoadFeladat(this.files[0])">
            <div style="font-size:.85rem;color:#64748b;pointer-events:none;" id="aj-feladat-info">
              <i class="fas fa-file-word" style="color:#f59e0b"></i> Kattints a feladat .docx feltöltéséhez
            </div>
          </div>
        </div>

        <div class="upload-zone" id="aj-drop-zone"
            ondragover="event.preventDefault();this.classList.add('dragover')"
            ondragleave="this.classList.remove('dragover')"
            ondrop="ajDrop(event)">
          <input type="file" id="aj-folder-input" webkitdirectory multiple onchange="ajSelect(this.files)">
          <div style="font-size:2rem;color:#3b82f6;margin-bottom:8px;pointer-events:none"><i class="fas fa-folder-open"></i></div>
          <div style="font-size:.9rem;font-weight:600;margin-bottom:4px;pointer-events:none">Húzd ide a tanuló megoldás mappáját</div>
          <div style="font-size:.78rem;color:#64748b;pointer-events:none">vagy kattints a kiválasztáshoz (egész mappa egyszerre)</div>
          <div id="aj-upload-info" style="margin-top:10px;font-size:.82rem;color:#4ade80;min-height:18px;pointer-events:none"></div>
        </div>
        <button class="btn btn-primary" id="aj-start-btn" onclick="ajStart()" disabled style="margin-top:14px;width:100%;">
          <i class="fas fa-play"></i> Javítás indítása
        </button>
      </div>
    </div>

    <!-- ══ JAVÍTÁS ══ -->
    <div id="aj-grading-step" style="display:none;">

      <div class="grading-header">
        <span style="font-weight:700;font-size:.95rem;" id="aj-nev-display"></span>
        <span style="color:#374151;">|</span>
        <span style="font-size:.88rem;color:#94a3b8;">
          Összpontszám: <b id="aj-total" style="color:#4ade80;font-size:1.05rem;">0</b><span style="color:#374151;">/40</span>
        </span>
        <label style="display:flex;align-items:center;gap:6px;font-size:.82rem;color:#94a3b8;cursor:pointer;margin-left:auto;">
          <input type="checkbox" id="aj-only-bad" onchange="ajFilter()"> Csak kétes / hibás
        </label>
        <button class="btn btn-ghost btn-sm" onclick="ajExport()"><i class="fas fa-file-export"></i> Export</button>
        <button class="btn btn-ghost btn-sm" onclick="ajReset()" style="color:#f87171;border-color:#7f1d1d;">
          <i class="fas fa-rotate-left"></i> Új tanuló
        </button>
      </div>

      <div class="split">
        <!-- Kód nézet -->
        <div class="code-col">
          <div class="code-wrap">
            <div class="code-tabbar">
              <button class="code-tab active" id="ctab-html" onclick="showCodeTab('html')">HTML</button>
              <button class="code-tab" id="ctab-css" onclick="showCodeTab('css')">CSS</button>
              <button class="code-tab" id="ctab-feladat" onclick="showCodeTab('feladat')"><i class="fas fa-file-lines" style="color:#f59e0b"></i> Feladat</button>
            </div>
            <textarea id="aj-code-view" readonly spellcheck="false"></textarea>
            <div id="aj-feladat-html-view" style="display:none;height:500px;overflow-y:auto;padding:16px;background:#0f1923;font-size:.83rem;line-height:1.7;color:#cbd5e1;"></div>
            <div class="code-hint" id="aj-code-hint">← A piros szempontra kattintva ide ugrik a kód</div>
          </div>
        </div>
        <!-- Szempontlista -->
        <div class="criteria-col" id="aj-list"></div>
      </div>
    </div>

  </div>
</div>

<script>
// ── Auth ───────────────────────────────────────────────────────────────────
(function(){
  const u = JSON.parse(sessionStorage.getItem('kandoUser') || localStorage.getItem('kandoUser') || '{}');
  if (!u.token && !u._tesztMod) {
    document.getElementById('auth-err').style.display = 'block';
    document.getElementById('main-ui').style.display = 'none';
  }
})();

// ── Állapot ────────────────────────────────────────────────────────────────
let ajFiles = {}, ajHtml = '', ajCss = '', ajDoc = null, ajScores = {}, ajNev = '';
let ajCurrentCodeTab = 'html', ajFeladatHtml = '';

// ── Fájlkezelés ────────────────────────────────────────────────────────────
function ajDrop(e) {
  e.preventDefault();
  document.getElementById('aj-drop-zone').classList.remove('dragover');
  if (e.dataTransfer.files?.length) ajProcess(Array.from(e.dataTransfer.files));
}
function ajSelect(files) { ajProcess(Array.from(files)); }

function ajProcess(files) {
  ajFiles = {};
  for (const f of files) {
    const rel = f.webkitRelativePath || f.name;
    const parts = rel.split('/');
    const key = (parts.length > 1 ? parts.slice(1).join('/') : parts[0]).toLowerCase();
    ajFiles[key] = { file: f, blobUrl: URL.createObjectURL(f) };
  }
  const n = Object.keys(ajFiles).length;
  document.getElementById('aj-upload-info').textContent = n ? `${n} fájl betöltve` : '';
  document.getElementById('aj-drop-zone').classList.toggle('has-files', n > 0);
  const btn = document.getElementById('aj-start-btn');
  btn.disabled = n === 0;
  btn.style.opacity = n ? '1' : '.45';
  btn.style.cursor = n ? 'pointer' : 'not-allowed';
}

// ── Javítás indítása ────────────────────────────────────────────────────────
async function ajStart() {
  ajNev = document.getElementById('aj-nev').value.trim() || 'Ismeretlen tanuló';
  const htmlKey = Object.keys(ajFiles).find(k => k.endsWith('.html'));
  const cssKey  = Object.keys(ajFiles).find(k => k.includes('css/') && k.endsWith('.css'))
               || Object.keys(ajFiles).find(k => k.endsWith('.css'));
  if (!htmlKey) { alert('Nem található .html fájl a feltöltött mappában!'); return; }

  ajHtml = await ajFiles[htmlKey].file.text();
  ajCss  = cssKey ? await ajFiles[cssKey].file.text() : '';
  ajDoc  = new DOMParser().parseFromString(ajHtml, 'text/html');

  // Kód nézet feltöltése
  document.getElementById('aj-code-view').value = ajHtml;
  ajCurrentCodeTab = 'html';
  document.getElementById('ctab-html').classList.add('active');
  document.getElementById('ctab-css').classList.remove('active');

  const checks = ajGetChecks();
  const cssR = ajParseCss(ajCss);
  ajScores = {};
  // Referencia fájlok – ezek NEM screenshot-ok
  const REF_FILES = new Set(['szigetek.html','css/style.css','szigetek.png',
    'img/ciprus.jpg','img/fejlec.jpg','img/history-icon.png','img/ibiza.jpg',
    'img/kreta.jpg','img/mallorca.jpg','img/santorini.jpg',
    'bootstrap/bootstrap.bundle.min.js','bootstrap/bootstrap.min.css']);
  const extraImgs = Object.keys(ajFiles).filter(k =>
    /\.(png|jpg|jpeg|gif|webp)$/i.test(k) && !REF_FILES.has(k));

  for (const c of checks) {
    if (c.section) continue;
    if (c.screenshotCheck) {
      ajScores[c.id] = null; // mindig manuális
    } else if (c.cssCheck) {
      try { ajScores[c.id] = c.cssCheck(ajCss) ? 1 : 0; } catch { ajScores[c.id] = null; }
    } else {
      try { ajScores[c.id] = c.check(ajDoc, ajHtml, ajCss) ? 1 : 0; } catch { ajScores[c.id] = null; }
    }
  }

  ajRenderList(checks);
  ajUpdateTotal();
  document.getElementById('aj-upload-step').style.display = 'none';
  document.getElementById('aj-grading-step').style.display = 'block';
  document.getElementById('aj-nev-display').textContent = ajNev;
}

// ── Kód nézet ──────────────────────────────────────────────────────────────
function showCodeTab(tab) {
  ajCurrentCodeTab = tab;
  ['html','css','feladat'].forEach(t => document.getElementById('ctab-'+t)?.classList.toggle('active', t===tab));
  const tv = document.getElementById('aj-code-view');
  const fv = document.getElementById('aj-feladat-html-view');
  const hint = document.getElementById('aj-code-hint');
  if (tab === 'feladat') {
    tv.style.display = 'none';
    fv.style.display = 'block';
    fv.innerHTML = ajFeladatHtml || '<p style="color:#4b5563;padding:20px;">Feladat leírás nem lett feltöltve.</p>';
    hint.textContent = 'Feladat leírás';
  } else {
    tv.style.display = 'block';
    fv.style.display = 'none';
    tv.value = tab === 'css' ? ajCss : ajHtml;
    hint.textContent = '← A piros szempontra kattintva ide ugrik a kód';
    hint.style.color = '#374151';
  }
}

async function ajLoadFeladat(file) {
  if (!file) return;
  const info = document.getElementById('aj-feladat-info');
  info.textContent = `Betöltés: ${file.name}…`;
  try {
    if (file.name.endsWith('.docx')) {
      const buf = await file.arrayBuffer();
      const result = await mammoth.convertToHtml({ arrayBuffer: buf });
      ajFeladatHtml = result.value;
    } else {
      ajFeladatHtml = '<pre style="white-space:pre-wrap">' + esc(await file.text()) + '</pre>';
    }
    info.innerHTML = `<i class="fas fa-check" style="color:#4ade80"></i> ${esc(file.name)} betöltve`;
  } catch(e) {
    info.innerHTML = `<i class="fas fa-times" style="color:#ef4444"></i> Hiba: ${esc(e.message)}`;
  }
}

function ajJumpToCode(id) {
  const checks = ajGetChecks();
  const c = checks.find(x => x.id === id);
  if (!c || !c.find) return;

  const tab = c.find.in;
  const code = tab === 'css' ? ajCss : ajHtml;
  showCodeTab(tab);

  const tv = document.getElementById('aj-code-view');
  const hint = document.getElementById('aj-code-hint');

  // Próbálkozások sorban: find.term, aztán find.fallback
  const terms = [c.find.term, c.find.fallback].filter(Boolean);
  let pos = -1, matchLen = 0;

  for (const term of terms) {
    if (term instanceof RegExp) {
      const m = code.match(term);
      if (m) { pos = code.indexOf(m[0]); matchLen = m[0].length; break; }
    } else {
      const idx = code.toLowerCase().indexOf(term.toLowerCase());
      if (idx >= 0) { pos = idx; matchLen = term.length; break; }
    }
  }

  if (pos < 0) {
    hint.textContent = 'A keresett elem nem található a kódban (hiányzik).';
    hint.style.color = '#ef4444';
    return;
  }

  // Sor kiszámítása a görgetéshez
  const linesBefore = code.slice(0, pos).split('\n').length - 1;
  const lineHeight = parseFloat(getComputedStyle(tv).lineHeight) || 19;
  tv.scrollTop = Math.max(0, (linesBefore - 3) * lineHeight);
  tv.focus();
  tv.setSelectionRange(pos, pos + matchLen);

  const lineNum = linesBefore + 1;
  hint.textContent = `${lineNum}. sor – ${tab.toUpperCase()} kód`;
  hint.style.color = '#f59e0b';
}

// ── CSS segédfüggvény: adott szelektor blokkjában van-e property:value ──────
function cssHas(css, selector, property, valuePattern) {
  const clean = css.replace(/\/\*[\s\S]*?\*\//g, '');
  // Escape selector for regex
  const selEsc = selector.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp(selEsc + '\\s*\\{([^}]*)\\}', 'i');
  const m = re.exec(clean);
  if (!m) return false;
  const block = m[1];
  const propEsc = property.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const valRe = valuePattern instanceof RegExp
    ? new RegExp(propEsc + '\\s*:[^;\\n]*?' + valuePattern.source, 'i')
    : new RegExp(propEsc + '\\s*:[^;\\n]*?' + String(valuePattern).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
  return valRe.test(block);
}

function ajParseCss(css) { return css; } // megtartjuk a hívási helyek miatt

// ── Kritérium lista ─────────────────────────────────────────────────────────
function ajRenderList(checks) {
  const list = document.getElementById('aj-list');
  list.innerHTML = '';
  checks.forEach(c => {
    if (c.section) {
      const d = document.createElement('div');
      d.className = 'aj-sec';
      d.innerHTML = `<i class="fas fa-chevron-right"></i> ${esc(c.section)}`;
      list.appendChild(d); return;
    }
    const score = ajScores[c.id];
    const status = score === null ? 'manual' : score >= 1 ? 'pass' : 'fail';
    const icon = status === 'pass'
      ? '<i class="fas fa-check-circle" style="color:#22c55e;font-size:.9rem;"></i>'
      : status === 'fail'
      ? '<i class="fas fa-times-circle" style="color:#ef4444;font-size:.9rem;"></i>'
      : '<i class="fas fa-question-circle" style="color:#f59e0b;font-size:.9rem;"></i>';
    const cur = score ?? 0;

    const canJump = status === 'fail' && c.find;
    const clickAttr = canJump ? `onclick="ajJumpToCode(${c.id})" title="Kattints a kódban való ugráshoz"` : '';
    const jumpHint = canJump ? `<span class="clickhint"><i class="fas fa-arrow-pointer"></i> ugrás a kódhoz</span>` : '';

    let extraContent = '';
    if (c.screenshotCheck) {
      // Csak a releváns validálási képet keressük fájlnév alapján
      const correctName = c.screenshotCheck === 'html' ? 'szigetekvalidalas' : 'stylevalidalas';
      const searchFn = c.screenshotCheck === 'html'
        ? fn => fn.includes('szigetek') && fn.includes('valid')
        : fn => fn.includes('stylevalidalas') || (fn.includes('style') && fn.includes('valid'));
      const imgKey = Object.keys(ajFiles).find(k => {
        if (!/\.(png|jpg|jpeg|gif|webp)$/i.test(k)) return false;
        const fn = k.split('/').pop().toLowerCase().replace(/\.[^.]+$/, '');
        return searchFn(fn);
      });
      if (imgKey) {
        const fileName = imgKey.split('/').pop();
        const fnNoExt = fileName.toLowerCase().replace(/\.[^.]+$/, '');
        const nameOk = fnNoExt === correctName;
        const nameStatus = nameOk
          ? `<span style="color:#4ade80;font-size:.7rem;"><i class="fas fa-check"></i> fájlnév helyes</span>`
          : `<span style="color:#ef4444;font-size:.7rem;"><i class="fas fa-times"></i> helytelen fájlnév – kell: <b>${c.screenshotCheck === 'html' ? 'szigetekValidalas' : 'styleValidalas'}</b></span>`;
        extraContent = `<div style="margin-top:6px;">
          <div style="font-size:.72rem;color:#94a3b8;margin-bottom:3px;">${esc(fileName)} ${nameStatus}</div>
          <a href="${ajFiles[imgKey].blobUrl}" target="_blank">
            <img src="${ajFiles[imgKey].blobUrl}" class="aj-thumb" title="${esc(fileName)} – kattints a nagyításhoz">
          </a>
        </div>`;
      } else {
        extraContent = `<div style="color:#4b5563;font-size:.73rem;font-style:italic;margin-top:4px;">
          <i class="fas fa-triangle-exclamation" style="color:#f59e0b"></i> Nem találtam validálási képet a mappában</div>`;
      }
    }

    const row = document.createElement('div');
    row.className = `aj-row ${status}`;
    row.dataset.id = c.id; row.dataset.status = status;

    if (c.screenshotCheck) {
      // Screenshot sor: kép + gomb egy blokkban, egymás alatt
      row.style.flexDirection = 'column';
      row.style.alignItems = 'stretch';
      row.innerHTML = `
        <div style="display:flex;align-items:center;gap:9px;">
          <div style="flex-shrink:0;width:18px;text-align:center;">${icon}</div>
          <div class="aj-row-lbl">${esc(c.label)}</div>
        </div>
        <div style="padding-left:27px;margin-top:4px;">
          ${extraContent}
          <div class="aj-btns" style="margin-top:8px;">
            <button class="aj-btn ${cur===0?'a0':''}" data-val="0" onclick="ajSet(${c.id},0)">0</button>
            <button class="aj-btn ${cur===1?'a1':''}" data-val="1" onclick="ajSet(${c.id},1)">1</button>
          </div>
        </div>`;
    } else {
      row.innerHTML = `
        <div style="flex-shrink:0;width:18px;text-align:center;">${icon}</div>
        <div class="aj-row-lbl" ${clickAttr}>
          ${esc(c.label)}${jumpHint}
        </div>
        <div class="aj-btns">
          <button class="aj-btn ${cur===0?'a0':''}" data-val="0" onclick="ajSet(${c.id},0)">0</button>
          <button class="aj-btn ${cur===0.5?'a05':''}" data-val="0.5" onclick="ajSet(${c.id},0.5)">½</button>
          <button class="aj-btn ${cur===1?'a1':''}" data-val="1" onclick="ajSet(${c.id},1)">1</button>
        </div>`;
    }
    list.appendChild(row);
  });
}

function ajSet(id, val) {
  ajScores[id] = val;
  const row = document.querySelector(`.aj-row[data-id="${id}"]`);
  if (!row) return;
  row.querySelectorAll('.aj-btn').forEach(b => {
    b.className = 'aj-btn';
    const bval = parseFloat(b.dataset.val);
    if (bval === val) b.classList.add(val === 0 ? 'a0' : val === 0.5 ? 'a05' : 'a1');
  });
  const newStatus = val === 1 ? 'pass' : val === 0.5 ? 'manual' : 'fail';
  row.className = `aj-row ${newStatus}`;
  row.dataset.status = newStatus;
  ajUpdateTotal();
}

function ajUpdateTotal() {
  let t = 0;
  Object.values(ajScores).forEach(v => { if (v !== null) t += v; });
  document.getElementById('aj-total').textContent = t % 1 === 0 ? t : t.toFixed(1);
}

function ajFilter() {
  const only = document.getElementById('aj-only-bad').checked;
  document.querySelectorAll('.aj-row').forEach(row => {
    const id = parseInt(row.dataset.id);
    const isGreen = row.dataset.status === 'pass' && ajScores[id] === 1;
    row.style.display = (only && isGreen) ? 'none' : '';
  });
  document.querySelectorAll('.aj-sec').forEach(hdr => {
    let next = hdr.nextElementSibling, vis = false;
    while (next && !next.classList.contains('aj-sec')) {
      if (next.style.display !== 'none') vis = true;
      next = next.nextElementSibling;
    }
    hdr.style.display = vis ? '' : 'none';
  });
}

function ajReset() {
  document.getElementById('aj-grading-step').style.display = 'none';
  document.getElementById('aj-upload-step').style.display = 'block';
  document.getElementById('aj-nev').value = '';
  document.getElementById('aj-upload-info').textContent = '';
  document.getElementById('aj-only-bad').checked = false;
  document.getElementById('aj-drop-zone').classList.remove('has-files');
  document.getElementById('aj-folder-input').value = '';
  const btn = document.getElementById('aj-start-btn');
  btn.disabled = true; btn.style.opacity = '.45'; btn.style.cursor = 'not-allowed';
  ajFiles = {}; ajHtml = ''; ajCss = ''; ajDoc = null; ajScores = {};
}

function ajExport() {
  const checks = ajGetChecks();
  let lines = [`ÁGAZATI WEB FELADAT JAVÍTÁS\nTanuló: ${ajNev}\nDátum: ${new Date().toLocaleDateString('hu-HU')}\nFeladat: Szigetek – Weboldal kódolása\n\n`];
  let total = 0;
  checks.forEach(c => {
    if (c.section) { lines.push(`\n[${c.section}]\n`); return; }
    const v = ajScores[c.id] ?? 0; total += v;
    lines.push(`  [${v === 0.5 ? '0.5' : v}/1] ${c.label}\n`);
  });
  lines.push(`\n${'─'.repeat(50)}\nÖSSZESEN: ${total % 1 === 0 ? total : total.toFixed(1)}/40 pont\n`);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([lines.join('')], {type:'text/plain;charset=utf-8'}));
  a.download = `javitas_${ajNev.replace(/\s+/g,'_')}.txt`;
  a.click();
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
